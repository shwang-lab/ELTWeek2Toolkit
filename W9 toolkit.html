<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 9 Toolkit &mdash; AI in the Language Classroom</title>
<style>
:root {
  --teal: #1F4E44;
  --teal-acc: #2F6F62;
  --gold: #C98A2B;
  --gold-lt: #E8C468;
  --ink: #1B2430;
  --cream: #F2EFE6;
  --white: #FFFFFF;
  --cardbg: #F3F1EC;
  --muted: #6B7280;
  --success: #7BC67E;
  --error: #A23B33;
  --error-bg: #FDEDEA;
  --font-body: "Segoe UI", Arial, sans-serif;
  --font-head: Georgia, "Times New Roman", serif;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--white);
  min-height: 100%;
}
#app { min-height: 900px; position: relative; }
button { font-family: var(--font-body); cursor: pointer; border: none; }
input, select, textarea { font-family: var(--font-body); }
a { color: inherit; }

.screen { min-height: 900px; padding: 84px 24px 48px; max-width: 900px; margin: 0 auto; }
.screen.wide { max-width: 1100px; }
.screen.dark { background: var(--teal); color: var(--cream); min-height: 900px; }
.screen.center { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 900px; padding-top: 24px; }

/* ---------- top toggle pill ---------- */
.toggle-pill {
  position: fixed; top: 16px; right: 16px; z-index: 50;
  display: flex; background: var(--cardbg); border-radius: 999px; padding: 4px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.12);
}
.toggle-pill button {
  padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 700;
  background: transparent; color: var(--muted);
}
.toggle-pill button.active { background: var(--teal); color: var(--white); }

/* ---------- landing ---------- */
.landing-title { font-family: var(--font-head); font-size: 30px; font-weight: 700; color: var(--teal); margin-bottom: 6px; text-align: center; }
.landing-sub { color: var(--muted); text-align: center; margin-bottom: 36px; font-size: 15px; }
.landing-cards { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
.landing-card {
  width: 260px; padding: 28px 22px; border-radius: 14px; background: var(--cardbg);
  text-align: center; transition: transform .15s;
}
.landing-card:hover { transform: translateY(-2px); }
.landing-card .icon { font-size: 34px; margin-bottom: 10px; }
.landing-card h3 { font-family: var(--font-head); color: var(--teal); margin: 0 0 8px; }
.landing-card p { color: var(--muted); font-size: 13.5px; margin: 0 0 18px; }
.btn {
  display: inline-block; padding: 12px 22px; border-radius: 8px; font-weight: 700; font-size: 14.5px;
  background: var(--teal); color: var(--white);
}
.btn.gold { background: var(--gold); color: var(--white); }
.btn.outline { background: transparent; border: 1.5px solid var(--teal); color: var(--teal); }
.btn.danger { background: var(--error); color: var(--white); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-row { display: flex; gap: 12px; flex-wrap: wrap; }

/* ---------- form basics ---------- */
.field-label { font-weight: 700; font-size: 14px; margin-bottom: 6px; display: block; color: var(--ink); }
.text-input, .select-input {
  width: 100%; padding: 12px 14px; border-radius: 8px; border: 1.5px solid #D8D4C8;
  font-size: 15px; background: var(--white); color: var(--ink);
}
.text-input:focus, .select-input:focus { outline: 2px solid var(--teal-acc); }
textarea.text-input { resize: vertical; min-height: 110px; }
.form-card { background: var(--cardbg); border-radius: 12px; padding: 24px; max-width: 480px; margin: 0 auto; }

/* ---------- kicker / titles ---------- */
.kicker { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; color: var(--gold); text-transform: uppercase; margin-bottom: 8px; }
.kicker.on-dark { color: var(--gold-lt); }
.h1 { font-family: var(--font-head); font-size: 26px; font-weight: 700; color: var(--teal); margin: 0 0 6px; }
.h1.on-dark { color: var(--white); }
.subtext { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
.subtext.on-dark { color: var(--cream); opacity: 0.85; }

/* ---------- course map ---------- */
.map-header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom: 22px; }
.progress-pill { background: var(--teal); color: var(--white); font-weight: 700; font-size: 13px; padding: 8px 16px; border-radius: 999px; }
.block-section { margin-bottom: 28px; }
.block-title { font-family: var(--font-head); font-weight: 700; color: var(--teal-acc); font-size: 17px; margin-bottom: 10px; border-bottom: 1px solid #E2DFD5; padding-bottom: 6px; }
.activity-row {
  display: flex; align-items: center; gap: 14px; background: var(--cardbg); border-radius: 10px;
  padding: 14px 16px; margin-bottom: 10px; transition: background .12s;
}
.activity-row:hover { background: #ECE8DB; }
.activity-num {
  width: 30px; height: 30px; border-radius: 50%; background: var(--teal-acc); color: var(--white);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0;
}
.activity-row.done .activity-num { background: var(--success); }
.activity-info { flex: 1; min-width: 0; }
.activity-info .t { font-weight: 700; font-size: 15px; }
.activity-info .b { color: var(--muted); font-size: 13px; margin-top: 2px; }
.group-badge { background: var(--gold); color: var(--white); font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; margin-left: 8px; }
.check-badge { color: var(--success); font-size: 20px; flex-shrink: 0; }
.arrow-badge { color: var(--muted); font-size: 18px; flex-shrink: 0; }

/* ---------- activity content ---------- */
.act-card { background: var(--cardbg); border-radius: 12px; padding: 22px; margin-bottom: 16px; }
.act-question { font-weight: 700; font-size: 17px; margin-bottom: 16px; }
.option-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 8px; background: var(--white); margin-bottom: 8px; border: 1.5px solid transparent; cursor: pointer; }
.option-row:hover { border-color: var(--teal-acc); }
.option-row.selected { border-color: var(--teal-acc); background: #E4EFEC; }
.option-row input { accent-color: var(--teal-acc); width: 17px; height: 17px; }
.match-row { display:flex; align-items:center; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
.match-term { font-weight: 700; min-width: 220px; color: var(--teal-acc); }
.quiz-item { margin-bottom: 22px; }
.quiz-stem { font-weight: 700; font-size: 15px; margin-bottom: 10px; }
.order-row { display:flex; align-items:center; gap: 12px; background: var(--white); border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; }
.order-num { width: 26px; height: 26px; border-radius: 50%; background: var(--teal-acc); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; flex-shrink:0; }
.order-text { flex: 1; font-size: 14.5px; }
.order-btns { display:flex; gap: 4px; }
.order-btns button { width: 30px; height: 30px; border-radius: 6px; background: var(--cardbg); color: var(--teal); font-weight: 700; }
.order-btns button:disabled { opacity: 0.3; cursor: not-allowed; }
.field-box { background: var(--white); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
.field-box label { font-weight: 700; color: var(--gold); font-size: 13.5px; display:block; margin-bottom: 6px; }

/* ---------- inline error / save banner ---------- */
.inline-error {
  background: var(--error-bg); color: var(--error); border-radius: 8px; padding: 12px 16px;
  font-size: 13.5px; margin-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.inline-error .detail { font-size: 11.5px; color: #8a4a44; opacity: .8; }
.inline-error button { background: var(--error); color: #fff; padding: 7px 14px; border-radius: 6px; font-size: 12.5px; font-weight: 700; flex-shrink: 0; }

/* ---------- submitted screen ---------- */
.submitted-box { text-align: center; padding-top: 60px; }
.submitted-icon { font-size: 52px; color: var(--success); margin-bottom: 12px; }

/* ---------- modal ---------- */
.modal-overlay { position: fixed; inset: 0; background: rgba(27,36,48,0.55); z-index: 100; display:flex; align-items:center; justify-content:center; padding: 20px; }
.modal-card { background: var(--white); border-radius: 12px; padding: 26px; max-width: 420px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,0.25); }
.modal-card h3 { font-family: var(--font-head); color: var(--teal); margin: 0 0 10px; font-size: 19px; }
.modal-card p { color: var(--ink); font-size: 14.5px; line-height: 1.5; margin: 0 0 20px; }
.modal-btns { display: flex; justify-content: flex-end; gap: 10px; }

/* ---------- instructor dashboard ---------- */
.dash-tabs { display:flex; gap: 8px; margin-bottom: 20px; }
.dash-tab { padding: 9px 20px; border-radius: 8px; font-weight: 700; font-size: 14px; background: var(--teal-acc); color: var(--cream); opacity: 0.6; }
.dash-tab.active { opacity: 1; background: var(--gold); color: var(--white); }
.dash-actions { display:flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; align-items: center; }
.dash-card { background: var(--teal-acc); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; }
.dash-card .t { font-weight: 700; font-size: 15.5px; margin-bottom: 10px; }
.dash-bar-row { display:flex; align-items:center; gap: 10px; margin-bottom: 6px; font-size: 13px; }
.dash-bar-track { flex: 1; height: 10px; background: rgba(255,255,255,0.15); border-radius: 6px; overflow: hidden; }
.dash-bar-fill { height: 100%; background: var(--gold-lt); }
.dash-bar-fill.correct { background: var(--success); }
.dash-label { min-width: 220px; font-size: 12.5px; }
.dash-pct { min-width: 46px; text-align: right; font-weight: 700; font-size: 12.5px; }
.dash-empty { color: var(--cream); opacity: 0.6; font-size: 13px; font-style: italic; }
.dash-entry { background: rgba(255,255,255,0.08); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; }
.dash-entry .who { font-weight: 700; color: var(--gold-lt); margin-bottom: 4px; }
.progress-text { font-size: 13px; color: var(--gold-lt); font-weight: 700; }
</style>
</head>

<script>

   CONFIG

    instruction: "Chain-of-thought prompting works in a sequence. Put these 4 steps in the order you'd actually use them.",

var BLOCKS = [
  { id: "A", label: "Block A -- The Five-Ecosystem Framework" },

  { id: "S", label: "Synthesis" }

function activityById(id) {
  for (var i = 0; i < ACTIVITIES.length; i++) { if (ACTIVITIES[i].id === id) return ACTIVITIES[i]; }
  return null;
}

/* =========================================================
   KV STORAGE SHIM (section 7a -- reusable pattern, do not rebuild)
   ========================================================= */
async function kvGet(key) {
  var res = await fetch(APPS_SCRIPT_URL + "?action=get&key=" + encodeURIComponent(key));
  var data = await res.json();
  if (data.status !== "ok") throw new Error(data.message || "get failed");
  return data.value;
}
async function kvSet(key, value) {
  var res = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "set", key: key, value: value })
  });
  var data = await res.json();
  if (data.status !== "ok") throw new Error(data.message || "set failed");
  return true;
}
async function kvList(prefix) {
  var res = await fetch(APPS_SCRIPT_URL + "?action=list&prefix=" + encodeURIComponent(prefix));
  var data = await res.json();
  if (data.status !== "ok") throw new Error(data.message || "list failed");
  return data.keys;
}
async function kvDelete(key) {
  var res = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "delete", key: key })
  });
  var data = await res.json();
  if (data.status !== "ok") throw new Error(data.message || "delete failed");
  return true;
}

/* =========================================================
   ADAPTIVE THROTTLE -- shared by every raw storage call
   ========================================================= */
var Throttle = {
  minGap: 150,
  maxGap: 4000,
  lastDispatch: 0,
  lastAdjust: 0,
  async schedule(fn) {
    var now = Date.now();
    var wait = Math.max(0, this.lastDispatch + this.minGap - now);
    if (wait > 0) await sleep(wait);
    this.lastDispatch = Date.now();
    try {
      var result = await fn();
      this._onSuccess();
      return result;
    } catch (e) {
      this._onFailure();
      throw e;
    }
  },
  _onSuccess() {
    var now = Date.now();
    if (now - this.lastAdjust < 300) return;
    this.lastAdjust = now;
    this.minGap = Math.max(120, Math.round(this.minGap * 0.9));
  },
  _onFailure() {
    var now = Date.now();
    if (now - this.lastAdjust < 300) return;
    this.lastAdjust = now;
    this.minGap = Math.min(this.maxGap, Math.round(this.minGap * 2));
  }
};

function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

/* ---------- retry wrappers built on top of the shim ---------- */
async function kvSetRetry(key, value, attempts) {
  attempts = attempts || 4;
  var delay = 400;
  var lastErr = null;
  for (var i = 0; i < attempts; i++) {
    try {
      return await Throttle.schedule(function () { return kvSet(key, value); });
    } catch (e) {
      lastErr = e;
      await sleep(delay);
      delay = Math.min(delay * 2, 4000);
    }
  }
  throw lastErr;
}
async function kvGetRetrySoft(key, attempts) {
  attempts = attempts || 3;
  var delay = 300;
  for (var i = 0; i < attempts; i++) {
    try {
      return await Throttle.schedule(function () { return kvGet(key); });
    } catch (e) {
      await sleep(delay);
      delay = Math.min(delay * 2, 3000);
    }
  }
  return null; // soft-fail: treat as empty/null after exhausting retries
}
async function kvListRetrySoft(prefix, attempts) {
  attempts = attempts || 3;
  var delay = 300;
  for (var i = 0; i < attempts; i++) {
    try {
      return await Throttle.schedule(function () { return kvList(prefix); });
    } catch (e) {
      await sleep(delay);
      delay = Math.min(delay * 2, 3000);
    }
  }
  return { failed: true, keys: [] }; // soft-fail marker, distinguishable from a genuinely empty list
}
async function kvDeleteRetryVerified(key, attempts) {
  attempts = attempts || 3;
  for (var i = 0; i < attempts; i++) {
    try {
      await Throttle.schedule(function () { return kvDelete(key); });
    } catch (e) { /* fall through to verify/retry */ }
    // verify: re-fetch; if it throws "not found"-style or returns null, treat as gone
    var stillThere = true;
    try {
      var v = await Throttle.schedule(function () { return kvGet(key); });
      stillThere = (v !== null && v !== undefined);
    } catch (e) {
      stillThere = true; // inconclusive -> treat as not-yet-verified, retry
    }
    if (!stillThere) return true;
    await sleep(300);
  }
  return false;
}

/* ---------- bulk concurrency-limited executor ---------- */
async function mapLimited(items, limit, fn) {
  var results = new Array(items.length);
  var idx = 0;
  async function worker() {
    while (idx < items.length) {
      var i = idx++;
      results[i] = await fn(items[i], i);
    }
  }
  var n = Math.min(limit, items.length) || 1;
  var workers = [];
  for (var w = 0; w < n; w++) workers.push(worker());
  await Promise.all(workers);
  return results;
}

function escapeHtml(s) {

function activityMatchingHtml(a) {

function activityOrderingHtml(a) {
  var draft = STATE.draft[a.id];
  if (!draft || !draft.order) {
    var order = a.items.map(function (_, i) { return i; });
    // simple deterministic shuffle so it isn't shown in the "correct" order
    order = shuffleDeterministic(order, a.id);
    draft = { order: order };
    STATE.draft[a.id] = draft;
  }
  var rows = draft.order.map(function (origIdx, pos) {
    return (
      '<div class="order-row">' +
        '<div class="order-num">' + (pos + 1) + "</div>" +
        '<div class="order-text">' + escapeHtml(a.items[origIdx]) + "</div>" +
        '<div class="order-btns">' +
          '<button data-action="order-up" data-pos="' + pos + '" ' + (pos === 0 ? "disabled" : "") + ">&uarr;</button>" +
          '<button data-action="order-down" data-pos="' + pos + '" ' + (pos === draft.order.length - 1 ? "disabled" : "") + ">&darr;</button>" +
        "</div>" +
      "</div>"
    );
  }).join("");
  return '<div class="act-card">' + rows + "</div>";
}
function shuffleDeterministic(arr, seedStr) {
  var seed = 0;
  for (var i = 0; i < seedStr.length; i++) seed = (seed * 31 + seedStr.charCodeAt(i)) >>> 0;
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    var j = seed % (i + 1);
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  // avoid the already-correct order landing by chance
  var isCorrect = a.every(function (v, idx) { return v === idx; });
  if (isCorrect && a.length > 1) { var t = a[0]; a[0] = a[1]; a[1] = t; }
  return a;
}

function renderDashCard(a, data) {
  var entry = data && data[a.id];
  var respondents = (entry && entry.responses) || [];
  var header = '<div class="dash-card"><div class="t">' + escapeHtml(a.title) + " <span style=\"font-weight:400;opacity:.7;font-size:12px;\">(" + respondents.length + (a.group ? " group" : " student") + (respondents.length === 1 ? "" : "s") + " submitted)</span></div>";
  if (!entry) return header + '<div class="dash-empty">No data loaded.</div></div>';
  if (respondents.length === 0) return header + '<div class="dash-empty">No submissions yet.</div></div>';

  var body = "";
  if (a.type === "poll") {
    var counts = a.options.map(function () { return 0; });
    respondents.forEach(function (r) { if (typeof r.answer === "number" && r.answer >= 0 && r.answer < counts.length) counts[r.answer]++; });
    var total = respondents.length;
    body = a.options.map(function (opt, i) {
      var pct = total ? Math.round((counts[i] / total) * 100) : 0;
      return dashBarRow(opt, pct, counts[i] + "/" + total, false);
    }).join("");
  } else if (a.type === "quiz") {
    body = a.items.map(function (item, qi) {
      var counts = item.options.map(function () { return 0; });
      respondents.forEach(function (r) {
        var ans = r.answers && r.answers[qi];
        if (typeof ans === "number" && ans >= 0 && ans < counts.length) counts[ans]++;
      });
      var total = respondents.length;
      var correctCount = counts[item.correct] || 0;
      var pct = total ? Math.round((correctCount / total) * 100) : 0;
      var rows = item.options.map(function (opt, oi) {
        var isCorrect = oi === item.correct;
        var optPct = total ? Math.round((counts[oi] / total) * 100) : 0;
        return dashBarRow((isCorrect ? "\u2713 " : "") + opt, optPct, counts[oi] + "/" + total, isCorrect);
      }).join("");
      return '<div style="margin-bottom:14px;"><div style="font-size:13px;font-weight:700;margin-bottom:6px;">' + (qi + 1) + ". " + escapeHtml(item.stem) + '</div><div style="font-size:12px;color:var(--gold-lt);margin-bottom:4px;">Accuracy: ' + pct + "%</div>" + rows + "</div>";
    }).join("");
  } else if (a.type === "matching") {
    body = a.pairs.map(function (p, i) {
      var correctIdx = i;
      var total = respondents.length;
      var correctCount = 0;
      respondents.forEach(function (r) {
        var v = r.answers && r.answers["t" + i];
        if (String(v) === String(correctIdx)) correctCount++;
      });
      var pct = total ? Math.round((correctCount / total) * 100) : 0;
      return dashBarRow(p.term, pct, correctCount + "/" + total, true);
    }).join("");
  } else if (a.type === "ordering") {
    var total = respondents.length;
    var correctOrder = a.items.map(function (_, i) { return i; }).join(",");
    var correctCount = 0;
    respondents.forEach(function (r) { if (r.order && r.order.join(",") === correctOrder) correctCount++; });
    var pct = total ? Math.round((correctCount / total) * 100) : 0;
    body = dashBarRow("Fully correct order", pct, correctCount + "/" + total, true);
  } else if (a.type === "group") {
    body = respondents.map(function (r) {
      var fieldsHtml = a.fields.map(function (f, i) {
        return "<div><strong>" + escapeHtml(f) + ":</strong> " + escapeHtml((r.fields && r.fields["f" + i]) || "(blank)") + "</div>";
      }).join("");
      return '<div class="dash-entry"><div class="who">Group ' + escapeHtml(r.groupNum) + "</div>" + fieldsHtml + "</div>";
    }).join("");
  } else if (a.type === "freetext") {
    body = respondents.map(function (r) {
      return '<div class="dash-entry"><div class="who">' + escapeHtml(r.name || "Anonymous") + "</div>" + escapeHtml(r.text || "") + "</div>";
    }).join("");
  }
  return header + body + "</div>";
}

function dashBarRow(label, pct, countLabel, correct) {
  return (
    '<div class="dash-bar-row">' +
      '<div class="dash-label">' + escapeHtml(label) + "</div>" +
      '<div class="dash-bar-track"><div class="dash-bar-fill ' + (correct ? "correct" : "") + '" style="width:' + pct + '%;"></div></div>' +
      '<div class="dash-pct">' + pct + "%</div>" +
    "</div>"
  );
}

/* =========================================================
   EVENT HANDLERS
   ========================================================= */
function attachHandlers() {
  var app = document.getElementById("app");

  app.querySelectorAll("[data-action]").forEach(function (el) {
    el.addEventListener("click", function (ev) {
      var action = el.getAttribute("data-action");
      handleAction(action, el, ev);
    });
  });

  var pw = document.getElementById("pwInput");
  if (pw) pw.addEventListener("keydown", function (e) { if (e.key === "Enter") handleAction("submit-password", pw, e); });
  var nm = document.getElementById("nameInput");
  if (nm) nm.addEventListener("keydown", function (e) { if (e.key === "Enter") handleAction("submit-name", nm, e); });

  var grpSel = document.getElementById("groupSelect");
  if (grpSel) grpSel.addEventListener("change", function () { /* value read on confirm */ });

  app.querySelectorAll("[data-action='match-pick']").forEach(function (el) {
    el.addEventListener("change", function () {
      var a = activityById(STATE.currentActivityId);
      var term = el.getAttribute("data-term");
      STATE.draft[a.id] = STATE.draft[a.id] || {};
      STATE.draft[a.id]["t" + term] = el.value;
    });
  });
  app.querySelectorAll("[data-action='group-field']").forEach(function (el) {
    el.addEventListener("input", function () {
      var a = activityById(STATE.currentActivityId);
      var idx = el.getAttribute("data-idx");
      STATE.draft[a.id] = STATE.draft[a.id] || {};
      STATE.draft[a.id]["f" + idx] = el.value;
    });
  });
  app.querySelectorAll("[data-action='freetext-input']").forEach(function (el) {
    el.addEventListener("input", function () {
      var a = activityById(STATE.currentActivityId);
      STATE.draft[a.id] = STATE.draft[a.id] || {};
      STATE.draft[a.id].text = el.value;
    });
  });

  var overlay = app.querySelector("[data-modal-overlay]");
  if (overlay) {
    app.querySelectorAll("[data-modal-btn]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var i = parseInt(btn.getAttribute("data-modal-btn"), 10);
        var cfg = STATE.modal;
        closeModal();
        if (cfg && cfg.buttons[i] && cfg.buttons[i].onClick) cfg.buttons[i].onClick();
      });
    });
  }
}

function handleAction(action, el) {
  if (action === "enter-student") {
    STATE.role = "student";
    STATE.screen = STATE.studentName ? (STATE.classSection ? "course-map" : "student-class") : "student-name";
    if (STATE.screen === "course-map") loadCourseMap();
    render();
  } else if (action === "enter-instructor") {
    STATE.role = "instructor";
    STATE.screen = STATE.instructorAuthed ? "instructor-dashboard" : "instructor-password";
    render();
  } else if (action === "submit-name") {
    var v = document.getElementById("nameInput").value.trim();
    if (!v) { STATE.nameInputError = true; render(); return; }
    STATE.studentName = v;
    STATE.studentSlug = slugify(v);
    STATE.nameInputError = false;
    STATE.screen = "student-class";
    render();
  } else if (action === "pick-class") {
    STATE.classSection = el.getAttribute("data-class");
    STATE.screen = "course-map";
    render();
    loadCourseMap();
  } else if (action === "open-activity") {
    var id = el.getAttribute("data-id");
    var a = activityById(id);
    if (a.group && !STATE.groupNum) {
      STATE.pendingGroupActivityId = id;
      STATE.screen = "group-pick";
      render();
      return;
    }
    STATE.currentActivityId = id;
    STATE.saveError = null;
    STATE.screen = "activity";
    render();
  } else if (action === "confirm-group") {
    var sel = document.getElementById("groupSelect");
    STATE.groupNum = sel.value;
    STATE.currentActivityId = STATE.pendingGroupActivityId;
    STATE.pendingGroupActivityId = null;
    STATE.saveError = null;
    STATE.screen = "activity";
    render();
  } else if (action === "back-to-map") {
    STATE.screen = "course-map";
    render();
    loadCourseMap();
  } else if (action === "poll-pick") {
    var idx = parseInt(el.getAttribute("data-idx"), 10);
    var a2 = activityById(STATE.currentActivityId);
    STATE.draft[a2.id] = STATE.draft[a2.id] || {};
    STATE.draft[a2.id].answer = idx;
    render();
  } else if (action === "quiz-pick") {
    var q = parseInt(el.getAttribute("data-q"), 10);
    var oi = parseInt(el.getAttribute("data-idx"), 10);
    var a3 = activityById(STATE.currentActivityId);
    STATE.draft[a3.id] = STATE.draft[a3.id] || {};
    STATE.draft[a3.id]["q" + q] = oi;
    render();
  } else if (action === "order-up" || action === "order-down") {
    var pos = parseInt(el.getAttribute("data-pos"), 10);
    var a4 = activityById(STATE.currentActivityId);
    var draft = STATE.draft[a4.id];
    var swapWith = action === "order-up" ? pos - 1 : pos + 1;
    if (swapWith < 0 || swapWith >= draft.order.length) return;
    var tmp = draft.order[pos]; draft.order[pos] = draft.order[swapWith]; draft.order[swapWith] = tmp;
    render();
  } else if (action === "submit-activity" || action === "retry-submit") {
    submitCurrentActivity();
  } else if (action === "submit-password") {
    var pwVal = document.getElementById("pwInput").value;
    if (pwVal === INSTRUCTOR_PASSWORD) {
      STATE.instructorAuthed = true;
      STATE.passwordError = false;
      STATE.screen = "instructor-dashboard";
      render();
    } else {
      STATE.passwordError = true;
      render();
    }
  } else if (action === "toggle") {
    var target = el.getAttribute("data-toggle");
    if (target === "student") {
      STATE.role = "student";
      STATE.screen = STATE.studentName ? (STATE.classSection ? "course-map" : "student-class") : "student-name";
      render();
      if (STATE.screen === "course-map") loadCourseMap();
    } else if (target === "instructor") {
      STATE.role = "instructor";
      STATE.screen = STATE.instructorAuthed ? "instructor-dashboard" : "instructor-password";
      render();
    }
  } else if (action === "dash-tab") {
    STATE.instructorTab = el.getAttribute("data-tab");
    render();
  } else if (action === "refresh-all") {
    loadDashboard(STATE.instructorTab);
  } else if (action === "reset-all-confirm") {
    showModal({
      title: "Reset all data?",
      body: "This clears every response for BOTH A Class and B Class and cannot be undone. Are you sure?",
      buttons: [
        { label: "Cancel" },
        { label: "Reset All", variant: "danger", onClick: doResetAll }
      ]
    });
  }
}

/* =========================================================
   COURSE MAP LOADING (1 kvList for individual, 1 for group)
   ========================================================= */
async function loadCourseMap() {
  STATE.mapLoading = true;
  render();
  var doneSet = {};
  var cls = STATE.classSection;
  var slug = STATE.studentSlug;
  var indivPrefix = WEEK + ":resp:" + cls + ":" + slug + ":";
  var indivKeys = await kvListRetrySoft(indivPrefix);
  (indivKeys.keys || indivKeys).forEach && null;
  var keys1 = Array.isArray(indivKeys) ? indivKeys : (indivKeys.keys || []);
  keys1.forEach(function (k) {
    var actId = k.slice(indivPrefix.length);
    doneSet[actId] = true;
  });
  if (STATE.groupNum) {
    var grpPrefix = WEEK + ":groupresp:" + cls + ":g" + STATE.groupNum + ":";
    var grpKeysRaw = await kvListRetrySoft(grpPrefix);
    var keys2 = Array.isArray(grpKeysRaw) ? grpKeysRaw : (grpKeysRaw.keys || []);
    keys2.forEach(function (k) {
      var actId = k.slice(grpPrefix.length);
      doneSet[actId] = true;
    });
  }
  STATE.doneSet = doneSet;
  STATE.mapLoading = false;
  render();
}

/* =========================================================
   SUBMIT CURRENT ACTIVITY
   ========================================================= */
function validateActivity(a, draft) {
  draft = draft || {};
  if (a.type === "poll") return typeof draft.answer === "number";
  if (a.type === "quiz") {
    for (var i = 0; i < a.items.length; i++) { if (typeof draft["q" + i] !== "number") return false; }
    return true;
  }
  if (a.type === "matching") {
    for (var j = 0; j < a.pairs.length; j++) { if (draft["t" + j] === undefined || draft["t" + j] === "") return false; }
    return true;
  }
  if (a.type === "ordering") return !!(draft.order && draft.order.length === a.items.length);
  if (a.type === "group") {
    for (var k = 0; k < a.fields.length; k++) { if (!draft["f" + k] || !draft["f" + k].trim()) return false; }
    return true;
  }
  if (a.type === "freetext") return !!(draft.text && draft.text.trim());
  return true;
}

function buildPayload(a, draft) {
  var base = { ts: Date.now() };
  if (a.type === "poll") return Object.assign(base, { name: STATE.studentName, answer: draft.answer });
  if (a.type === "quiz") {
    var answers = a.items.map(function (_, i) { return draft["q" + i]; });
    return Object.assign(base, { name: STATE.studentName, answers: answers });
  }
  if (a.type === "matching") {
    var ans = {};
    a.pairs.forEach(function (_, i) { ans["t" + i] = draft["t" + i]; });
    return Object.assign(base, { name: STATE.studentName, answers: ans });
  }
  if (a.type === "ordering") return Object.assign(base, { name: STATE.studentName, order: draft.order.slice() });
  if (a.type === "group") {
    var fields = {};
    a.fields.forEach(function (_, i) { fields["f" + i] = draft["f" + i]; });
    return Object.assign(base, { groupNum: STATE.groupNum, fields: fields });
  }
  if (a.type === "freetext") return Object.assign(base, { name: STATE.studentName, text: draft.text });
  return base;
}

async function submitCurrentActivity() {
  var a = activityById(STATE.currentActivityId);
  var draft = STATE.draft[a.id];
  if (!validateActivity(a, draft)) {
    showModal({
      title: "Almost done",
      body: "Please complete every item before submitting.",
      buttons: [{ label: "OK" }]
    });
    return;
  }
  STATE.saving = true;
  STATE.saveError = null;
  render();
  var key = a.group ? groupKey(STATE.classSection, STATE.groupNum, a.id) : respKey(STATE.classSection, STATE.studentSlug, a.id);
  var payload = buildPayload(a, draft);
  try {
    await kvSetRetry(key, JSON.stringify(payload));
    STATE.saving = false;
    STATE.doneSet[a.id] = true;
    STATE.lastSubmittedId = a.id;
    STATE.screen = "submitted";
    render();
  } catch (e) {
    STATE.saving = false;
    STATE.saveError = { activityId: a.id, message: String((e && e.message) || e) };
    render();
  }
}

/* =========================================================
   INSTRUCTOR DASHBOARD LOADING
   ========================================================= */
async function loadDashboard(cls) {
  STATE.dashboardLoading = true;
  render();
  var indivPrefix = WEEK + ":resp:" + cls + ":";
  var grpPrefix = WEEK + ":groupresp:" + cls + ":";

  var indivListRaw = await kvListRetrySoft(indivPrefix);
  var indivKeys = Array.isArray(indivListRaw) ? indivListRaw : (indivListRaw.keys || []);
  var grpListRaw = await kvListRetrySoft(grpPrefix);
  var grpKeys = Array.isArray(grpListRaw) ? grpListRaw : (grpListRaw.keys || []);

  var byActivity = {};
  ACTIVITIES.forEach(function (a) { byActivity[a.id] = { responses: [] }; });

  await mapLimited(indivKeys, 6, async function (k) {
    var actId = k.slice(indivPrefix.length).split(":").pop();
    var val = await kvGetRetrySoft(k);
    if (val == null) return;
    try {
      var parsed = JSON.parse(val);
      if (byActivity[actId]) byActivity[actId].responses.push(parsed);
    } catch (e) { /* skip malformed */ }
  });

  await mapLimited(grpKeys, 6, async function (k) {
    var actId = k.slice(grpPrefix.length).split(":").pop();
    var val = await kvGetRetrySoft(k);
    if (val == null) return;
    try {
      var parsed = JSON.parse(val);
      if (byActivity[actId]) byActivity[actId].responses.push(parsed);
    } catch (e) { /* skip malformed */ }
  });

  STATE.dashboardData = STATE.dashboardData || {};
  STATE.dashboardData[cls] = byActivity;
  STATE.dashboardLoading = false;
  render();
}

/* =========================================================
   RESET ALL (both classes, full verified wipe)
   ========================================================= */
async function doResetAll() {
  STATE.resetInProgress = true;
  STATE.resetProgress = { done: 0, total: 0 };
  render();

  try {
    var allKeys = [];
    var listFailed = false;
    for (var c = 0; c < ["A", "B"].length; c++) {
      var cls = ["A", "B"][c];
      var r1 = await kvListRetrySoft(WEEK + ":resp:" + cls + ":");
      if (!Array.isArray(r1)) { listFailed = true; break; }
      var r2 = await kvListRetrySoft(WEEK + ":groupresp:" + cls + ":");
      if (!Array.isArray(r2)) { listFailed = true; break; }
      allKeys = allKeys.concat(r1, r2);
    }
    if (listFailed) {
      throw new Error("Could not reliably list existing data (list calls failed) -- please try Reset All again.");
    }
    STATE.resetProgress.total = allKeys.length;
    render();

    if (allKeys.length === 0) {
      finishReset(true);
      return;
    }

    var failedKeys = [];
    await mapLimited(allKeys, 6, async function (k) {
      var ok = await kvDeleteRetryVerified(k, 3);
      STATE.resetProgress.done++;
      render();
      if (!ok) failedKeys.push(k);
    });

    // retry any leftovers a couple more passes
    var passes = 0;
    while (failedKeys.length > 0 && passes < 2) {
      passes++;
      var stillFailed = [];
      await mapLimited(failedKeys, 4, async function (k) {
        var ok = await kvDeleteRetryVerified(k, 3);
        if (!ok) stillFailed.push(k);
      });
      failedKeys = stillFailed;
    }

    // final verification pass: re-list both classes, confirm truly empty
    var verifyKeys = [];
    for (var c2 = 0; c2 < ["A", "B"].length; c2++) {
      var cls2 = ["A", "B"][c2];
      var rv1 = await kvListRetrySoft(WEEK + ":resp:" + cls2 + ":");
      var vk1 = Array.isArray(rv1) ? rv1 : (rv1.failed ? null : []);
      var rv2 = await kvListRetrySoft(WEEK + ":groupresp:" + cls2 + ":");
      var vk2 = Array.isArray(rv2) ? rv2 : (rv2.failed ? null : []);
      if (vk1 === null || vk2 === null) { verifyKeys = null; break; } // inconclusive
      verifyKeys = verifyKeys.concat(vk1, vk2);
    }

    if (verifyKeys === null) {
      throw new Error("Could not verify reset completed (listing failed) -- please try Reset All again.");
    }
    if (verifyKeys.length > 0) {
      throw new Error(verifyKeys.length + " item(s) could not be confirmed deleted -- please try Reset All again.");
    }
    finishReset(true);
  } catch (e) {
    STATE.resetInProgress = false;
    showModal({
      title: "Reset didn't fully complete",
      body: String((e && e.message) || e),
      buttons: [{ label: "OK" }]
    });
    render();
  }
}

function finishReset(success) {
  STATE.resetInProgress = false;
  STATE.resetProgress = null;
  STATE.dashboardData = null;
  showModal({
    title: "Reset complete",
    body: "All response data for both classes has been cleared.",
    buttons: [{
      label: "OK",
      onClick: function () {
        // clear local session state; instructor auth persists per spec
        STATE.role = null;
        STATE.studentName = "";
        STATE.studentSlug = "";
        STATE.classSection = null;
        STATE.groupNum = null;
        STATE.doneSet = {};
        STATE.draft = {};
        STATE.currentActivityId = null;
        STATE.screen = "landing";
        render();
      }
    }]
  });
}

/* =========================================================
   INIT
   ========================================================= */
render();
