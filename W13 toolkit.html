<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 13 Toolkit - AI and the Digital Divide</title>
<style>
  :root {
    --teal: #1F4E44;
    --teal-acc: #2F6F62;
    --gold: #C98A2B;
    --gold-lt: #E8C468;
    --ink: #1B2430;
    --cream: #F2EFE6;
    --white: #FFFFFF;
    --cardbg: #F3F1EC;
    --muted: #6B7280;
    --success: #7BC67E;
    --error: #A23B33;
    --error-bg: #FDEDEA;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--white); color: var(--ink); font-family: "Segoe UI", Arial, sans-serif; }
  h1, h2, h3 { font-family: Georgia, "Times New Roman", serif; margin: 0; }
  #app { min-height: 100vh; }
  .screen { max-width: 900px; margin: 0 auto; padding: 24px 20px 80px; }
  .dark-screen { background: var(--teal); color: var(--cream); min-height: 100vh; }
  .dark-screen .screen { max-width: 1000px; }
  button { font-family: inherit; cursor: pointer; border: none; }
  .btn { padding: 12px 20px; border-radius: 8px; font-size: 15px; font-weight: 600; }
  .btn-primary { background: var(--teal-acc); color: var(--white); }
  .btn-primary:disabled { background: #9db3ad; cursor: not-allowed; }
  .btn-gold { background: var(--gold); color: var(--white); }
  .btn-outline { background: transparent; border: 1.5px solid var(--teal-acc); color: var(--teal-acc); }
  .btn-danger { background: var(--error); color: var(--white); }
  .btn-danger:disabled { background: #d8a9a4; cursor: not-allowed; }
  .btn-sm { padding: 8px 14px; font-size: 13px; border-radius: 6px; }
  .card { background: var(--cardbg); border-radius: 10px; padding: 18px 20px; margin-bottom: 14px; }
  .card-white { background: var(--white); border: 1px solid #E4E0D6; border-radius: 10px; padding: 18px 20px; margin-bottom: 14px; }
  input[type=text], select {
    width: 100%; padding: 11px 12px; font-size: 15px; border-radius: 7px;
    border: 1.5px solid #CBD5CE; font-family: inherit; background: var(--white); color: var(--ink);
  }
  .toggle-pill {
    position: fixed; top: 16px; right: 16px; z-index: 500;
    background: var(--ink); border-radius: 999px; display: flex; padding: 3px; gap: 2px;
  }
  .toggle-pill button {
    padding: 7px 14px; border-radius: 999px; font-size: 12px; font-weight: 700; background: transparent; color: #C7CDD3;
  }
  .toggle-pill button.active { background: var(--gold); color: var(--white); }
  .kicker { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: var(--gold); text-transform: uppercase; margin-bottom: 6px; }
  .landing-card {
    border: 2px solid #E4E0D6; border-radius: 14px; padding: 32px 24px; text-align: center; cursor: pointer;
    transition: border-color .15s; background: var(--white);
  }
  .landing-card:hover { border-color: var(--teal-acc); }
  .landing-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 20px; margin-top: 30px; }
  .pill-badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .pill-gold { background: var(--gold); color: var(--white); }
  .pill-teal { background: var(--teal-acc); color: var(--white); }
  .progress-pill { background: #E4EFEC; color: var(--teal); padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; }
  .activity-row {
    display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--white);
    border: 1px solid #E4E0D6; border-radius: 10px; margin-bottom: 10px; cursor: pointer;
  }
  .activity-row:hover { border-color: var(--teal-acc); }
  .activity-num { width: 30px; height: 30px; border-radius: 50%; background: var(--teal-acc); color: var(--white);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0; }
  .check { color: var(--success); font-weight: 900; font-size: 18px; }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(27,36,48,.55); display: flex; align-items: center; justify-content: center; z-index: 1000;
  }
  .modal-card { background: var(--white); border-radius: 12px; padding: 26px 24px; max-width: 420px; width: 90%; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  .error-banner { background: var(--error-bg); color: var(--error); border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-top: 10px; }
  .option-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1.5px solid #E4E0D6; border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
  .option-row.selected { border-color: var(--teal-acc); background: #E4EFEC; }
  .option-letter { font-weight: 800; color: var(--gold); width: 20px; flex-shrink: 0; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .db-card { background: #16382F; border-radius: 10px; padding: 16px 18px; margin-bottom: 14px; }
  .db-tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .db-tab { padding: 8px 20px; border-radius: 8px; font-weight: 700; background: #16382F; color: var(--cream); }
  .db-tab.active { background: var(--gold-lt); color: var(--ink); }
  .bar-track { background: #0F2822; border-radius: 5px; height: 10px; overflow: hidden; margin-top: 4px; }
  .bar-fill { background: var(--gold-lt); height: 100%; }
  .correct-tag { background: rgba(123,198,126,.18); color: var(--success); font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
  .ord-item { display: flex; align-items: center; gap: 12px; background: var(--white); border: 1px solid #E4E0D6; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; }
  .ord-btns { display: flex; flex-direction: column; gap: 2px; }
  .ord-btns button { background: var(--cardbg); border-radius: 5px; width: 26px; height: 22px; font-size: 12px; }
  .bucket-zone { border: 2px dashed #CBD5CE; border-radius: 10px; padding: 14px; min-height: 90px; }
  .bucket-zone.a { border-color: var(--teal-acc); background: #E4EFEC; }
  .bucket-zone.b { border-color: var(--gold); background: #FBF0DC; }
  .bucket-item { background: var(--white); border: 1px solid #E4E0D6; border-radius: 7px; padding: 8px 10px; margin-bottom: 6px; font-size: 13.5px; cursor: pointer; }
  .muted { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
"use strict";

var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzJc_RFDdhCU4_VB41uMefmy6cKgjg4DVwqVk1xBDa5MDAA0aMq53VinzQf1iZKyy4i/exec";
var WEEK_NS = "week13";
var INSTRUCTOR_PASSWORD = "ELT100";
var CLASS_SIZES = { A: 26, B: 20 };
var ARROW = "\u2192";
var CHECK = "\u2713";

// ---------------------------------------------------------------
// Storage shim: kvGet / kvSet / kvList / kvDelete + adaptive throttle + retry
// ---------------------------------------------------------------
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

var throttleGap = 150;
var lastDispatch = 0;
function throttledCall(fn) {
  var now = Date.now();
  var wait = Math.max(0, lastDispatch + throttleGap - now);
  return sleep(wait).then(function () {
    lastDispatch = Date.now();
    return fn().then(function (res) {
      throttleGap = Math.max(80, throttleGap * 0.9);
      return res;
    }).catch(function (err) {
      throttleGap = Math.min(3000, throttleGap * 2);
      throw err;
    });
  });
}

function withRetry(fn, attempts, baseDelay) {
  attempts = attempts || 4;
  baseDelay = baseDelay || 350;
  var i = 0;
  function attempt() {
    return throttledCall(fn).catch(function (err) {
      i++;
      if (i >= attempts) throw err;
      return sleep(baseDelay * Math.pow(2, i)).then(attempt);
    });
  }
  return attempt();
}

function rawGet(key) {
  return fetch(APPS_SCRIPT_URL + "?action=get&key=" + encodeURIComponent(key)).then(function (res) {
    return res.json();
  }).then(function (data) {
    if (data.status !== "ok") throw new Error(data.message || "get failed");
    return data.value;
  });
}
function rawSet(key, value) {
  return fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "set", key: key, value: value }),
  }).then(function (res) { return res.json(); }).then(function (data) {
    if (data.status !== "ok") throw new Error(data.message || "set failed");
    return true;
  });
}
function rawList(prefix) {
  return fetch(APPS_SCRIPT_URL + "?action=list&prefix=" + encodeURIComponent(prefix)).then(function (res) {
    return res.json();
  }).then(function (data) {
    if (data.status !== "ok") throw new Error(data.message || "list failed");
    return data.keys;
  });
}
function rawDelete(key) {
  return fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "delete", key: key }),
  }).then(function (res) { return res.json(); }).then(function (data) {
    if (data.status !== "ok") throw new Error(data.message || "delete failed");
    return true;
  });
}

function kvGet(key) { return withRetry(function () { return rawGet(key); }, 3, 250).catch(function () { return null; }); }
function kvSet(key, value) { return withRetry(function () { return rawSet(key, value); }, 4, 350); }
function kvList(prefix) { return withRetry(function () { return rawList(prefix); }, 3, 250).catch(function () { return []; }); }
function kvDelete(key) { return withRetry(function () { return rawDelete(key); }, 4, 350); }

function mapLimited(items, limit, fn) {
  var i = 0;
  var results = new Array(items.length);
  var workers = [];
  var n = Math.min(limit, items.length) || 1;
  for (var w = 0; w < n; w++) {
    workers.push((function worker() {
      if (i >= items.length) return Promise.resolve();
      var idx = i++;
      return Promise.resolve(fn(items[idx], idx)).then(function (r) {
        results[idx] = r;
        return worker();
      });
    })());
  }
  return Promise.all(workers).then(function () { return results; });
}

function slug(name) {
  return String(name).trim().toLowerCase().replace(/[\/\\'"\s]+/g, "-").replace(/[^a-z0-9\-]/g, "").slice(0, 40) || "student";
}

// ---------------------------------------------------------------
// Activity definitions
// ---------------------------------------------------------------
var TERMS = ["Digital Divide", "Homework Gap", "Digital Literacy", "Algorithmic Bias", "Premium Divide"];
var MATCH_OPTIONS = [
  "The inability to complete assignments because a student lacks a computer or internet connection at home.",
  "The ability to understand, navigate, and critically evaluate digital tools, data, and media, not just operate a device.",
  "Distortions in an AI system's outputs that reflect and reinforce existing social inequalities in its training data.",
  "Inequity created when only those who can afford paid AI subscriptions get enhanced features and capabilities.",
  "The gap between those who have reliable access to and knowledge of information and communication technologies, and those who do not.",
];
// correct option index (0=A..4=E) for each term index (0..4)
var MATCH_CORRECT = [4, 0, 1, 2, 3];

var QUIZ_STEMS = [
  {
    q: "A rural school gets free laptops, but the town has no broadband provider. Which barrier is this?",
    opts: ["Digital literacy", "Connectivity", "Algorithmic bias", "Premium divide"],
    correct: 1,
  },
  {
    q: "A speech-to-text tool consistently fails a student with a motor speech disorder, because its training data came almost entirely from young, standard-accented speakers. This is:",
    opts: ["Homework gap", "Premium divide", "Algorithmic/training-data bias", "Digital literacy gap"],
    correct: 2,
  },
  {
    q: "A student can only afford the free tier of an AI writing tool, with a much smaller context window than her classmate's paid version. This illustrates:",
    opts: ["The premium divide", "The homework gap", "Algorithmic bias", "Connectivity divide"],
    correct: 0,
  },
  {
    q: "A teacher never received training on AI tools and, as a result, doesn't use them meaningfully in class. This shows the impact of:",
    opts: ["Hardware access", "Educator/digital literacy gap", "Premium divide", "Algorithmic bias"],
    correct: 1,
  },
];

var BUCKET_ITEMS = [
  { id: "b1", text: "Subsidized broadband + devices for underserved areas", correct: "bridges" },
  { id: "b2", text: "Free AI tools with severely limited features (throttled)", correct: "widens" },
  { id: "b3", text: "Adaptive learning platforms with knowledge-graph-style personalization", correct: "bridges" },
  { id: "b4", text: "AI trained mostly on dominant-language, dominant-culture data", correct: "widens" },
  { id: "b5", text: "Equity-informed design (e.g., Goblin Tools) built for neurodivergent users", correct: "bridges" },
  { id: "b6", text: "AI-driven behavioral monitoring/surveillance without oversight", correct: "widens" },
  { id: "b7", text: "Mandatory third-party bias audits of educational AI", correct: "bridges" },
  { id: "b8", text: "Real-time translation tools (e.g., DeepL) for non-native speakers", correct: "bridges" },
];

var ORDER_CORRECT = [
  "Subsidize hardware and broadband access",
  "Mandate bias audits and inclusive design in AI systems",
  "Establish data-privacy protections for student data",
  "Fund ongoing AI professional development for teachers",
];
// initial shuffled (zero fixed points relative to ORDER_CORRECT)
var ORDER_INITIAL = [
  "Establish data-privacy protections for student data",
  "Fund ongoing AI professional development for teachers",
  "Subsidize hardware and broadband access",
  "Mandate bias audits and inclusive design in AI systems",
];

var ACTIVITIES = [
  { id: "poll1", type: "poll", num: 1, group: false, title: "Which Barrier Hits Closest to Home?", blurb: "Quick poll, no right answer." },
  { id: "match1", type: "matching", num: 2, group: false, title: "Match the Key Term", blurb: "Match 5 terms to their definitions." },
  { id: "quiz1", type: "scenario", num: 3, group: false, title: "Name That Barrier", blurb: "4 short scenarios." },
  { id: "bucket1", type: "bucket", num: 4, group: true, title: "Bridges the Divide, or Widens It?", blurb: "Group sort - 8 items, 2 categories." },
  { id: "order1", type: "ordering", num: 5, group: false, title: "Build the Policy Roadmap", blurb: "Put 4 priorities in order." },
];

// ---------------------------------------------------------------
// STATE
// ---------------------------------------------------------------
var STATE = {
  screen: "landing", // landing | studentInfo | courseMap | activity | instructorAuth | dashboard
  role: null,
  student: { name: "", cls: null, group: null },
  currentActivityId: null,
  draft: {},
  progress: {}, // activityId -> true if submitted
  loadingProgress: false,
  submitting: false,
  submitError: null,
  instructorAuthed: false,
  authError: null,
  dashboard: { classTab: "A", data: null, loading: false, error: null, resetInProgress: false, resetProgress: null },
  modal: null,
  groupPromptFor: null,
};

function setState(patch) {
  Object.assign(STATE, patch);
  render();
}

// ---------------------------------------------------------------
// Modal (custom, never native alert/confirm/prompt)
// ---------------------------------------------------------------
function showModal(opts) { setState({ modal: opts }); }
function closeModal() { setState({ modal: null }); }

function renderModal() {
  if (!STATE.modal) return "";
  var m = STATE.modal;
  return (
    '<div class="modal-overlay" id="modalOverlay">' +
      '<div class="modal-card">' +
        '<h3 style="margin-bottom:10px;">' + escapeHtml(m.title || "") + '</h3>' +
        '<div style="font-size:14px;line-height:1.5;">' + escapeHtml(m.message || "") + '</div>' +
        (m.detail ? '<div class="muted" style="margin-top:8px;">' + escapeHtml(m.detail) + '</div>' : "") +
        '<div class="modal-actions">' +
          (m.onCancel !== undefined ? '<button class="btn btn-outline btn-sm" data-action="modal-cancel" id="modalCancel">' + (m.cancelText || "Cancel") + '</button>' : "") +
          '<button class="btn btn-primary btn-sm" data-action="modal-confirm" id="modalConfirm">' + (m.confirmText || "OK") + '</button>' +
        '</div>' +
      '</div>' +
    '</div>'
  );
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

// ---------------------------------------------------------------
// Toggle pill
// ---------------------------------------------------------------
function renderTogglePill() {
  if (STATE.screen === "landing") return "";
  var studentActive = STATE.role === "student" ? " active" : "";
  var instrActive = STATE.role === "instructor" ? " active" : "";
  return (
    '<div class="toggle-pill">' +
      '<button data-action="toggle-role" data-role="student" class="' + studentActive.trim() + '">Student</button>' +
      '<button data-action="toggle-role" data-role="instructor" class="' + instrActive.trim() + '">Instructor</button>' +
    '</div>'
  );
}

function switchToStudent() {
  setState({ role: "student", screen: STATE.student.name ? "courseMap" : "studentInfo" });
  if (STATE.student.name) loadProgress();
}
function switchToInstructor() {
  if (STATE.instructorAuthed) {
    setState({ role: "instructor", screen: "dashboard" });
    loadDashboard();
  } else {
    setState({ role: "instructor", screen: "instructorAuth", authError: null });
  }
}

// ---------------------------------------------------------------
// LANDING
// ---------------------------------------------------------------
function renderLanding() {
  return (
    '<div class="screen">' +
      '<div class="kicker">Week 13</div>' +
      '<h1 style="font-size:30px;margin-bottom:6px;">AI and the Digital Divide</h1>' +
      '<p class="muted" style="margin-bottom:10px;">Toolkit for today\'s class</p>' +
      '<div class="landing-grid">' +
        '<div class="landing-card" data-action="enter-student"><h2 style="font-size:20px;margin-bottom:8px;">Enter as Student</h2><p class="muted">Work through today\'s activities</p></div>' +
        '<div class="landing-card" data-action="enter-instructor"><h2 style="font-size:20px;margin-bottom:8px;">Enter as Instructor</h2><p class="muted">View live results dashboard</p></div>' +
      '</div>' +
    '</div>'
  );
}

// ---------------------------------------------------------------
// STUDENT INFO
// ---------------------------------------------------------------
function renderStudentInfo() {
  var name = STATE.student.name || "";
  return (
    '<div class="screen">' +
      '<div class="kicker">Get Started</div>' +
      '<h1 style="font-size:26px;margin-bottom:18px;">Enter Your Info</h1>' +
      '<div class="card-white">' +
        '<label style="font-size:13px;font-weight:700;display:block;margin-bottom:6px;">Name</label>' +
        '<input type="text" id="nameInput" value="' + escapeHtml(name) + '" placeholder="Your full name" style="margin-bottom:16px;">' +
        '<label style="font-size:13px;font-weight:700;display:block;margin-bottom:6px;">Class Section</label>' +
        '<div style="display:flex;gap:10px;margin-bottom:6px;">' +
          '<button class="btn ' + (STATE.student.cls === "A" ? "btn-primary" : "btn-outline") + '" data-action="pick-class" data-cls="A" style="flex:1;">A Class</button>' +
          '<button class="btn ' + (STATE.student.cls === "B" ? "btn-primary" : "btn-outline") + '" data-action="pick-class" data-cls="B" style="flex:1;">B Class</button>' +
        '</div>' +
        '<p class="muted">A Class and B Class data are kept completely separate.</p>' +
        (STATE.submitError ? '<div class="error-banner">' + escapeHtml(STATE.submitError) + '</div>' : "") +
        '<button class="btn btn-primary" data-action="confirm-student-info" style="margin-top:16px;width:100%;">Continue</button>' +
      '</div>' +
    '</div>'
  );
}

function confirmStudentInfo() {
  var input = document.getElementById("nameInput");
  var name = input ? input.value.trim() : "";
  if (!name) { setState({ submitError: "Please enter your name." }); return; }
  if (!STATE.student.cls) { setState({ submitError: "Please choose A Class or B Class." }); return; }
  STATE.student.name = name;
  setState({ screen: "courseMap", submitError: null });
  loadProgress();
}

// ---------------------------------------------------------------
// PROGRESS LOADING
// ---------------------------------------------------------------
function progressKey(activityId, group) {
  var cls = STATE.student.cls;
  if (group) {
    return WEEK_NS + ":groupresp:" + cls + ":g" + STATE.student.group + ":" + activityId;
  }
  return WEEK_NS + ":resp:" + cls + ":" + slug(STATE.student.name) + ":" + activityId;
}

function loadProgress() {
  setState({ loadingProgress: true });
  var keys = ACTIVITIES.map(function (a) { return { id: a.id, key: progressKey(a.id, a.group && STATE.student.group != null) }; });
  Promise.all(keys.map(function (k) {
    if (k.key.indexOf(":groupresp:") !== -1 && STATE.student.group == null) return Promise.resolve(null);
    return kvGet(k.key);
  })).then(function (values) {
    var progress = {};
    keys.forEach(function (k, i) { progress[k.id] = !!values[i]; });
    setState({ progress: progress, loadingProgress: false });
  }).catch(function () {
    setState({ loadingProgress: false });
  });
}

// ---------------------------------------------------------------
// COURSE MAP
// ---------------------------------------------------------------
function renderCourseMap() {
  var done = ACTIVITIES.filter(function (a) { return STATE.progress[a.id]; }).length;
  var rows = ACTIVITIES.map(function (a) {
    var isDone = STATE.progress[a.id];
    return (
      '<div class="activity-row" data-action="open-activity" data-id="' + a.id + '">' +
        '<div class="activity-num">' + a.num + '</div>' +
        '<div style="flex:1;">' +
          '<div style="font-weight:700;font-size:15px;">' + escapeHtml(a.title) + (a.group ? ' <span class="pill-badge pill-gold" style="margin-left:6px;">GROUP</span>' : "") + '</div>' +
          '<div class="muted">' + escapeHtml(a.blurb) + '</div>' +
        '</div>' +
        (isDone ? '<span class="check">' + CHECK + '</span>' : '<span class="muted">' + ARROW + '</span>') +
      '</div>'
    );
  }).join("");
  return (
    '<div class="screen">' +
      '<div class="kicker">Course Map</div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">' +
        '<h1 style="font-size:24px;">Hi, ' + escapeHtml(STATE.student.name) + '</h1>' +
        '<span class="progress-pill">' + done + '/' + ACTIVITIES.length + ' done</span>' +
      '</div>' +
      '<h3 style="font-size:15px;color:var(--teal-acc);margin-bottom:10px;">Block: AI and the Digital Divide</h3>' +
      rows +
      (STATE.loadingProgress ? '<p class="muted">Refreshing progress...</p>' : "") +
    '</div>'
  );
}

function openActivity(id) {
  var act = ACTIVITIES.filter(function (a) { return a.id === id; })[0];
  if (!act) return;
  if (act.group && STATE.student.group == null) {
    setState({ groupPromptFor: id });
    return;
  }
  STATE.currentActivityId = id;
  STATE.draft = defaultDraft(act);
  setState({ screen: "activity", submitError: null });
}

function defaultDraft(act) {
  if (act.type === "matching") return { picks: TERMS.map(function () { return null; }) };
  if (act.type === "scenario") return { picks: QUIZ_STEMS.map(function () { return null; }) };
  if (act.type === "ordering") return { order: ORDER_INITIAL.slice() };
  if (act.type === "bucket") return { assign: {} };
  if (act.type === "poll") return { pick: null };
  return {};
}

function renderPollBody() {
  var opts = ["Not having a reliable device", "Slow or unreliable internet", "Not knowing how to use the tools well (digital/AI literacy)", "Not being able to afford premium/paid AI tools"];
  var rows = opts.map(function (o, i) {

  }).join("");
  return '<div class="card-white"><p style="font-weight:700;margin-bottom:14px;">Which of these do you think is the biggest barrier to equal access to AI tools for students like you, right now?</p>' + rows + '<p class="muted" style="margin-top:8px;">No right answer here - just your honest read.</p></div>';
}

function renderMatchingBody() {
  var rows = TERMS.map(function (t, ti) {
    var pick = STATE.draft.picks[ti];
    var optHtml = MATCH_OPTIONS.map(function (o, oi) {
      return '<option value="' + oi + '"' + (pick === oi ? " selected" : "") + '>' + "ABCDE"[oi] + '. ' + escapeHtml(o.slice(0, 60)) + (o.length > 60 ? "..." : "") + '</option>';
    }).join("");
    return (
      '<div class="card-white">' +
        '<div style="font-weight:700;margin-bottom:8px;">' + (ti + 1) + '. ' + escapeHtml(t) + '</div>' +
        '<select data-action="match-pick" data-ti="' + ti + '"><option value="">-- choose a definition --</option>' + optHtml + '</select>' +
      '</div>'
    );
  }).join("");
  return rows + '<p class="muted">Match each term to its correct definition.</p>';
}

function renderScenarioBody() {
  return QUIZ_STEMS.map(function (st, qi) {
    var pick = STATE.draft.picks[qi];
    var opts = st.opts.map(function (o, oi) {
      var sel = pick === oi ? " selected" : "";
      return '<div class="option-row' + sel + '" data-action="quiz-pick" data-qi="' + qi + '" data-oi="' + oi + '"><span class="option-letter">' + "ABCD"[oi] + '.</span><span>' + escapeHtml(o) + '</span></div>';
    }).join("");
    return '<div class="card-white"><p style="font-weight:700;margin-bottom:10px;">' + (qi + 1) + '. ' + escapeHtml(st.q) + '</p>' + opts + '</div>';
  }).join("");
}

function renderBucketBody() {
  var assign = STATE.draft.assign;
  function zone(cat, label, cls) {
    var items = BUCKET_ITEMS.filter(function (it) { return assign[it.id] === cat; });
    var html = items.map(function (it) {
      return '<div class="bucket-item" data-action="bucket-unassign" data-id="' + it.id + '">' + escapeHtml(it.text) + ' <span class="muted">(tap to remove)</span></div>';
    }).join("");
    return '<div><h3 style="font-size:15px;margin-bottom:8px;">' + label + '</h3><div class="bucket-zone ' + cls + '">' + html + '</div></div>';
  }
  var unassigned = BUCKET_ITEMS.filter(function (it) { return !assign[it.id]; });
  var unassignedHtml = unassigned.map(function (it) {
    return (
      '<div class="card-white" style="padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;">' +
        '<span style="font-size:13.5px;">' + escapeHtml(it.text) + '</span>' +
        '<span style="display:flex;gap:6px;flex-shrink:0;">' +
          '<button class="btn btn-outline btn-sm" data-action="bucket-assign" data-id="' + it.id + '" data-cat="bridges">Bridges</button>' +
          '<button class="btn btn-outline btn-sm" data-action="bucket-assign" data-id="' + it.id + '" data-cat="widens">Widens</button>' +
        '</span>' +
      '</div>'
    );
  }).join("");
  return (
    '<div class="card"><p class="muted">As a group, sort each item below. Tap "Bridges" or "Widens" for each unsorted item; tap a sorted item to move it back.</p></div>' +
    (unassignedHtml || '<p class="muted">All items sorted.</p>') +
    '<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:16px;">' +
      zone("bridges", "Bridges the Divide", "a") +
      zone("widens", "Widens the Divide", "b") +
    '</div>'
  );
}

function renderOrderingBody() {
  var order = STATE.draft.order;
  var rows = order.map(function (item, i) {
    return (
      '<div class="ord-item">' +
        '<div class="ord-btns">' +
          '<button data-action="ord-up" data-i="' + i + '" ' + (i === 0 ? "disabled" : "") + '>&#9650;</button>' +
          '<button data-action="ord-down" data-i="' + i + '" ' + (i === order.length - 1 ? "disabled" : "") + '>&#9660;</button>' +
        '</div>' +
        '<span>' + escapeHtml(item) + '</span>' +
      '</div>'
    );
  }).join("");
  return '<div class="card"><p class="muted">Use the arrows to reorder these 4 priorities, first to last.</p></div>' + rows;
}

// ---------------------------------------------------------------
// SUBMIT
// ---------------------------------------------------------------
function submitActivity() {
  var act = ACTIVITIES.filter(function (a) { return a.id === STATE.currentActivityId; })[0];
  if (!act) return;
  var err = validateDraft(act);
  if (err) { setState({ submitError: err }); return; }

  setState({ submitting: true, submitError: null });
  var payload = buildPayload(act);
  var key = progressKey(act.id, act.group);
  kvSet(key, JSON.stringify(payload)).then(function () {
    STATE.progress[act.id] = true;
    setState({ submitting: false, screen: "courseMap" });
    showModal({
      title: "Submitted!",
      message: "Your answer for \"" + act.title + "\" was saved.",
      confirmText: "Back to Course Map",
    });
  }).catch(function () {
    setState({ submitting: false, submitError: "Could not save - try again. (Check your connection and resubmit.)" });
  });
}

function validateDraft(act) {
  var d = STATE.draft;
  if (act.type === "poll" && d.pick == null) return "Please choose an option.";
  if (act.type === "matching" && d.picks.some(function (p) { return p == null; })) return "Please match every term.";
  if (act.type === "scenario" && d.picks.some(function (p) { return p == null; })) return "Please answer every question.";
  if (act.type === "bucket") {
    var allAssigned = BUCKET_ITEMS.every(function (it) { return d.assign[it.id]; });
    if (!allAssigned) return "Please sort every item into a category.";
  }
  return null;
}

function buildPayload(act) {
  var d = STATE.draft;
  var base = { activityId: act.id, submittedAt: new Date().toISOString(), studentName: STATE.student.name };
  if (act.type === "poll") return Object.assign(base, { pick: d.pick });
  if (act.type === "matching") return Object.assign(base, { picks: d.picks });
  if (act.type === "scenario") return Object.assign(base, { picks: d.picks });
  if (act.type === "ordering") return Object.assign(base, { order: d.order });
  if (act.type === "bucket") return Object.assign(base, { assign: d.assign, group: STATE.student.group });
  return base;
}

function loadDashboard() {
  STATE.dashboard.loading = true;
  STATE.dashboard.error = null;
  render();
  var cls = STATE.dashboard.classTab;
  var prefix = WEEK_NS + ":resp:" + cls + ":";
  var gPrefix = WEEK_NS + ":groupresp:" + cls + ":";
  Promise.all([kvList(prefix), kvList(gPrefix)]).then(function (res) {
    var indivKeys = res[0] || [];
    var groupKeys = res[1] || [];
    return Promise.all(
      indivKeys.map(function (k) { return kvGet(k).then(function (v) { return { key: k, value: v }; }); })
        .concat(groupKeys.map(function (k) { return kvGet(k).then(function (v) { return { key: k, value: v }; }); }))
    );
  }).then(function (entries) {
    var data = {};
    ACTIVITIES.forEach(function (a) { data[a.id] = []; });
    entries.forEach(function (e) {
      if (!e.value) return;
      try {
        var parsed = JSON.parse(e.value);
        if (data[parsed.activityId]) data[parsed.activityId].push(parsed);
      } catch (err) { /* skip malformed */ }
    });
    STATE.dashboard.data = data;
    STATE.dashboard.loading = false;
    render();
  }).catch(function () {
    STATE.dashboard.loading = false;
    STATE.dashboard.error = "Could not load results - try Refresh All again.";
    render();
  });
}

function renderDashboard() {
  var d = STATE.dashboard;
  var tabs = ["A", "B"].map(function (c) {
    return '<button class="db-tab ' + (d.classTab === c ? "active" : "") + '" data-action="db-tab" data-cls="' + c + '">' + c + ' Class</button>';
  }).join("");

  var body = "";
  if (d.loading) {
    body = '<p><span class="spinner"></span>Loading results...</p>';
  } else if (d.error) {
    body = '<div class="error-banner" style="background:#3a1c18;color:#f3b3ab;">' + escapeHtml(d.error) + '</div>';
  } else if (d.data) {
    body = ACTIVITIES.map(renderActivityResultCard).join("");
  }

  var resetBtn = d.resetInProgress
    ? '<button class="btn btn-danger btn-sm" disabled><span class="spinner"></span>Resetting' + (d.resetProgress ? " (" + d.resetProgress.done + "/" + d.resetProgress.total + ")" : "") + '...</button>'
    : '<button class="btn btn-danger btn-sm" data-action="reset-all">Reset All</button>';

  return (
    '<div class="dark-screen"><div class="screen">' +
      '<div class="kicker" style="color:var(--gold-lt);">Instructor Dashboard</div>' +
      '<h1 style="font-size:24px;color:#fff;margin-bottom:16px;">Week 13 Results</h1>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;">' +
        '<div class="db-tabs">' + tabs + '</div>' +
        '<div style="display:flex;gap:8px;">' +
          '<button class="btn btn-gold btn-sm" data-action="refresh-all">Refresh All</button>' +
          resetBtn +
        '</div>' +
      '</div>' +
      '<h3 style="font-size:14px;color:var(--gold-lt);margin-bottom:8px;">Block: AI and the Digital Divide</h3>' +
      body +
    '</div></div>'
  );
}

function pct(n, total) { return total > 0 ? Math.round((n / total) * 100) : 0; }

function renderActivityResultCard(act) {
  var rows = (STATE.dashboard.data && STATE.dashboard.data[act.id]) || [];
  var total = rows.length;
  var inner = "";

  if (act.type === "poll") {
    var opts = ["Device", "Connectivity", "Digital/AI literacy", "Affordability (premium tools)"];
    var counts = [0, 0, 0, 0];
    rows.forEach(function (r) { if (r.pick != null && counts[r.pick] != null) counts[r.pick]++; });
    inner = opts.map(function (o, i) {
      return '<div style="margin-bottom:8px;"><div style="display:flex;justify-content:space-between;font-size:13px;"><span>' + "ABCD"[i] + '. ' + o + '</span><span>' + counts[i] + ' (' + pct(counts[i], total) + '%)</span></div><div class="bar-track"><div class="bar-fill" style="width:' + pct(counts[i], total) + '%;"></div></div></div>';
    }).join("");
  } else if (act.type === "matching") {
    inner = TERMS.map(function (t, ti) {
      var correctCount = rows.filter(function (r) { return r.picks && r.picks[ti] === MATCH_CORRECT[ti]; }).length;
      return '<div style="margin-bottom:8px;font-size:13px;"><span style="font-weight:700;">' + escapeHtml(t) + ':</span> <span class="correct-tag">' + correctCount + '/' + total + ' correct</span> <span class="muted">(correct: ' + "ABCDE"[MATCH_CORRECT[ti]] + ')</span></div>';
    }).join("");
  } else if (act.type === "scenario") {
    inner = QUIZ_STEMS.map(function (st, qi) {
      var correctCount = rows.filter(function (r) { return r.picks && r.picks[qi] === st.correct; }).length;
      return '<div style="margin-bottom:8px;font-size:13px;"><span style="font-weight:700;">Q' + (qi + 1) + ':</span> <span class="correct-tag">' + correctCount + '/' + total + ' correct</span> <span class="muted">(correct: ' + "ABCD"[st.correct] + '. ' + escapeHtml(st.opts[st.correct]) + ')</span></div>';
    }).join("");
  } else if (act.type === "bucket") {
    inner = BUCKET_ITEMS.map(function (it) {
      var counts = { bridges: 0, widens: 0 };
      rows.forEach(function (r) { if (r.assign && r.assign[it.id]) counts[r.assign[it.id]]++; });
      return '<div style="margin-bottom:6px;font-size:12.5px;">' + escapeHtml(it.text) + ' - <span class="correct-tag">Bridges: ' + counts.bridges + '</span> / <span style="color:var(--gold-lt);">Widens: ' + counts.widens + '</span> <span class="muted">(suggested: ' + it.correct + ')</span></div>';
    }).join("");
  } else if (act.type === "ordering") {
    var fullyCorrect = rows.filter(function (r) {
      return r.order && r.order.length === ORDER_CORRECT.length && r.order.every(function (v, i) { return v === ORDER_CORRECT[i]; });
    }).length;
    inner = '<div style="font-size:13px;"><span class="correct-tag">' + fullyCorrect + '/' + total + ' fully correct order</span></div><div class="muted" style="margin-top:6px;font-size:12px;">Correct order: ' + ORDER_CORRECT.map(function (o, i) { return (i + 1) + ". " + o; }).join(" | ") + '</div>';
  }

  return (
    '<div class="db-card">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">' +
        '<div><span class="pill-badge ' + (act.group ? "pill-gold" : "pill-teal") + '">Activity ' + act.num + '</span> <span style="font-weight:700;margin-left:8px;color:#fff;">' + escapeHtml(act.title) + '</span></div>' +
        '<span class="muted">' + total + ' response' + (total === 1 ? "" : "s") + '</span>' +
      '</div>' +
      inner +
    '</div>'
  );
}

function refreshAll() { loadDashboard(); }

function resetAll() {
  showModal({
    title: "Reset All Data?",
    message: "This clears ALL Week 13 responses for BOTH classes. This cannot be undone.",
    confirmText: "Yes, Reset Everything",
    cancelText: "Cancel",
    onConfirm: doResetAll,
    onCancel: function () {},
  });
}

function doResetAll() {
  closeModal();
  STATE.dashboard.resetInProgress = true;
  STATE.dashboard.resetProgress = { done: 0, total: 0 };
  render();
  Promise.all([kvList(WEEK_NS + ":resp:"), kvList(WEEK_NS + ":groupresp:")]).then(function (res) {
    var keys = (res[0] || []).concat(res[1] || []);
    STATE.dashboard.resetProgress = { done: 0, total: keys.length };
    render();
    return mapLimited(keys, 5, function (key) {
      return kvDelete(key).then(function () {
        STATE.dashboard.resetProgress.done++;
        render();
      });
    }).then(function () { return keys; });
  }).then(function (deletedKeys) {
    return Promise.all([kvList(WEEK_NS + ":resp:"), kvList(WEEK_NS + ":groupresp:")]).then(function (res) {
      var remaining = (res[0] || []).concat(res[1] || []);
      if (remaining.length > 0) throw new Error("Some keys remain after reset.");
    });
  }).then(function () {
    STATE.dashboard.resetInProgress = false;
    STATE.dashboard.resetProgress = null;
    // clear local student session on this browser
    STATE.student = { name: "", cls: null, group: null };
    STATE.progress = {};
    render();
    showModal({ title: "Reset Complete", message: "All Week 13 data has been cleared for both classes.", confirmText: "OK" });
    loadDashboard();
  }).catch(function () {
    STATE.dashboard.resetInProgress = false;
    render();
    showModal({ title: "Reset Incomplete", message: "Some data could not be verified as deleted. Please try Reset All again.", confirmText: "OK" });
  });
}

// ---------------------------------------------------------------
// RENDER DISPATCH
// ---------------------------------------------------------------
function render() {
  var app = document.getElementById("app");
  var html = "";
  if (STATE.screen === "landing") html = renderLanding();
  else if (STATE.screen === "studentInfo") html = renderStudentInfo();
  else if (STATE.screen === "courseMap") html = renderCourseMap();
  else if (STATE.screen === "activity") html = renderActivity();
  else if (STATE.screen === "instructorAuth") html = renderInstructorAuth();
  else if (STATE.screen === "dashboard") html = renderDashboard();

  app.innerHTML = renderTogglePill() + html + renderGroupPrompt() + renderModal();
  wireEvents();
}

// ---------------------------------------------------------------
// EVENT WIRING (delegation on #app, always re-bound after render)
// ---------------------------------------------------------------
function wireEvents() {
  var app = document.getElementById("app");
  app.onclick = function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");

    if (action === "toggle-role") {
      var role = el.getAttribute("data-role");
      if (role === "student") switchToStudent();
      else switchToInstructor();
      return;
    }
    if (action === "enter-student") { setState({ role: "student", screen: STATE.student.name ? "courseMap" : "studentInfo" }); if (STATE.student.name) loadProgress(); return; }
    if (action === "enter-instructor") { switchToInstructor(); return; }
    if (action === "pick-class") { STATE.student.cls = el.getAttribute("data-cls"); render(); return; }
    if (action === "confirm-student-info") { confirmStudentInfo(); return; }
    if (action === "open-activity") { openActivity(el.getAttribute("data-id")); return; }
    if (action === "back-to-map") { setState({ screen: "courseMap", submitError: null }); loadProgress(); return; }
    if (action === "submit-activity") { submitActivity(); return; }

    if (action === "poll-pick") { STATE.draft.pick = parseInt(el.getAttribute("data-i"), 10); render(); return; }
    if (action === "quiz-pick") {
      var qi = parseInt(el.getAttribute("data-qi"), 10), oi = parseInt(el.getAttribute("data-oi"), 10);
      STATE.draft.picks[qi] = oi; render(); return;
    }
    if (action === "bucket-assign") {
      var id = el.getAttribute("data-id"), cat = el.getAttribute("data-cat");
      STATE.draft.assign[id] = cat; render(); return;
    }
    if (action === "bucket-unassign") {
      var uid = el.getAttribute("data-id");
      delete STATE.draft.assign[uid]; render(); return;
    }
    if (action === "ord-up") {
      var iu = parseInt(el.getAttribute("data-i"), 10);
      if (iu > 0) { var arr = STATE.draft.order; var tmp = arr[iu - 1]; arr[iu - 1] = arr[iu]; arr[iu] = tmp; render(); }
      return;
    }
    if (action === "ord-down") {
      var idn = parseInt(el.getAttribute("data-i"), 10);
      var arr2 = STATE.draft.order;
      if (idn < arr2.length - 1) { var tmp2 = arr2[idn + 1]; arr2[idn + 1] = arr2[idn]; arr2[idn] = tmp2; render(); }
      return;
    }

    if (action === "confirm-instructor-auth") { confirmInstructorAuth(); return; }
    if (action === "db-tab") { STATE.dashboard.classTab = el.getAttribute("data-cls"); loadDashboard(); return; }
    if (action === "refresh-all") { refreshAll(); return; }
    if (action === "reset-all") { resetAll(); return; }

    if (action === "cancel-group-prompt") { setState({ groupPromptFor: null }); return; }
    if (action === "confirm-group-prompt") {
      var sel = document.getElementById("groupSelect");
      STATE.student.group = sel ? sel.value : "1";
      var pendingId = STATE.groupPromptFor;
      STATE.groupPromptFor = null;
      openActivity(pendingId);
      return;
    }

    if (action === "modal-confirm") {
      var m = STATE.modal;
      closeModal();
      if (m && m.onConfirm) m.onConfirm();
      return;
    }
    if (action === "modal-cancel") {
      var mc = STATE.modal;
      closeModal();
      if (mc && mc.onCancel) mc.onCancel();
      return;
    }
  };

  app.onchange = function (e) {
    var el = e.target;
    if (el.getAttribute && el.getAttribute("data-action") === "match-pick") {
      var ti = parseInt(el.getAttribute("data-ti"), 10);
      var v = el.value === "" ? null : parseInt(el.value, 10);
      STATE.draft.picks[ti] = v;
    }
  };

  // Capture text-input keystrokes into STATE without a full re-render,
  // so a click elsewhere (e.g. "A Class") that DOES trigger render()
  // never wipes out what the user already typed.
  app.oninput = function (e) {
    var el = e.target;
    if (el.id === "nameInput") STATE.student.name = el.value;
  };
}

// ---------------------------------------------------------------
// INIT
// ---------------------------------------------------------------
render();
})();
</script>
</body>
</html>
