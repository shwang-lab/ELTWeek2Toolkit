<script>
"use strict";

/* =====================================================================
   7a. Storage Backend - Reusable Pattern
   ===================================================================== */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzJc_RFDdhCU4_VB41uMefmy6cKgjg4DVwqVk1xBDa5MDAA0aMq53VinzQf1iZKyy4i/exec";

async function rawKvGet(key) {
  const res = await fetch(APPS_SCRIPT_URL + "?action=get&key=" + encodeURIComponent(key));
  const data = await res.json();
  if (data.status !== "ok") throw new Error(data.message || "get failed");
  return data.value;
}
async function rawKvSet(key, value) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "set", key, value })
  });
  const data = await res.json();
  if (data.status !== "ok") throw new Error(data.message || "set failed");
  return true;
}
async function rawKvList(prefix) {
  const res = await fetch(APPS_SCRIPT_URL + "?action=list&prefix=" + encodeURIComponent(prefix));
  const data = await res.json();
  if (data.status !== "ok") throw new Error(data.message || "list failed");
  return data.keys;
}
async function rawKvDelete(key) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "delete", key })
  });
  const data = await res.json();
  if (data.status !== "ok") throw new Error(data.message || "delete failed");
  return true;
}

/* ---- adaptive throttle shared by every raw storage call ---- */
const Throttle = {
  minGap: 120,       // ms, shrinks on success
  maxGap: 4000,       // ms ceiling
  lastDispatch: 0,
  pendingQueue: Promise.resolve(),
  recordSuccess() {
    this.minGap = Math.max(60, this.minGap * 0.85);
  },
  recordFailure() {
    this.minGap = Math.min(this.maxGap, this.minGap * 2.2);
  },
  schedule(fn) {
    const self = this;
    const runner = async () => {
      const wait = Math.max(0, self.minGap - (Date.now() - self.lastDispatch));
      if (wait > 0) await sleep(wait);
      self.lastDispatch = Date.now();
      return fn();
    };
    // Chain onto the queue regardless of whether the previous link succeeded or
    // failed (a rejected promise must not poison every future call), but keep
    // the queue itself always resolved so later calls still run in order.
    const resultPromise = this.pendingQueue.then(runner, runner);
    this.pendingQueue = resultPromise.then(() => {}, () => {});
    return resultPromise;
  }
};
function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

async function withRetry(fn, { attempts = 4, baseDelay = 300, treatAsEmptyOnFail = false, emptyValue = null } = {}) {
  let lastErr;
  for (let i = 0; i < attempts; i++) {
    try {
      const result = await Throttle.schedule(fn);
      Throttle.recordSuccess();
      return result;
    } catch (err) {
      lastErr = err;
      Throttle.recordFailure();
      if (i < attempts - 1) await sleep(baseDelay * Math.pow(1.8, i));
    }
  }
  if (treatAsEmptyOnFail) return emptyValue;
  throw lastErr;
}

async function kvGet(key) {
  return withRetry(() => rawKvGet(key), { attempts: 4, treatAsEmptyOnFail: true, emptyValue: null });
}
async function kvGetStrict(key) {
  return withRetry(() => rawKvGet(key), { attempts: 4 });
}
async function kvSet(key, value) {
  return withRetry(() => rawKvSet(key, value), { attempts: 5 });
}
async function kvList(prefix) {
  return withRetry(() => rawKvList(prefix), { attempts: 4, treatAsEmptyOnFail: true, emptyValue: [] });
}
async function kvDelete(key) {
  return withRetry(() => rawKvDelete(key), { attempts: 5 });
}

/* concurrency-limited batch executor */
async function mapLimited(items, limit, fn, onProgress) {
  const results = new Array(items.length);
  let idx = 0, done = 0;
  async function worker() {
    while (idx < items.length) {
      const my = idx++;
      results[my] = await fn(items[my], my);
      done++;
      if (onProgress) onProgress(done, items.length);
    }
  }
  const workers = [];
  for (let i = 0; i < Math.min(limit, items.length); i++) workers.push(worker());
  await Promise.all(workers);
  return results;
}

const appEl = document.getElementById("app");

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      if (k === "class") node.className = attrs[k];
      else if (k === "html") node.innerHTML = attrs[k];
      else if (k.startsWith("data-")) node.setAttribute(k, attrs[k]);
      else node[k] = attrs[k];
    }
  }
  (children || []).forEach((c) => {
    if (c === null || c === undefined) return;
    if (typeof c === "string") node.appendChild(document.createTextNode(c));
    else node.appendChild(c);
  });
  return node;
}

function render() {
  appEl.innerHTML = "";
  appEl.className = STATE.role === "instructor" && STATE.screen !== "landing" ? "instructor-theme" : "";

  if (STATE.screen !== "landing") {
    appEl.appendChild(renderTogglePill());
  }

  let content;
  switch (STATE.screen) {
    case "landing": content = renderLanding(); break;
    case "student-name": content = renderStudentName(); break;
    case "student-class": content = renderStudentClass(); break;
    case "course-map": content = renderCourseMap(); break;
    case "activity": content = renderActivityScreen(); break;
    case "submitted": content = renderSubmitted(); break;
    case "instructor-password": content = renderInstructorPassword(); break;
    case "instructor-dashboard": content = renderInstructorDashboard(); break;
    default: content = el("div", {}, ["Unknown screen"]);
  }
  appEl.appendChild(content);

  if (STATE.modal) {
    appEl.appendChild(renderModal(STATE.modal));
  }

  bindDelegatedEvents();
}

function renderTogglePill() {

}

  const done = {};
  keys.forEach((k) => {
    const id = k.slice(prefix.length);
    if (id) done[id] = true;
  });
  // group activities: if this student already has a group, check group submissions too
  if (STATE.groupNumber) {
    const gPrefix = `${WEEK}:groupresp:${STATE.classSection}:g${STATE.groupNumber}:`;

function getDraft(activity) {
  if (!STATE.activityDraft[activity.id]) {
    STATE.activityDraft[activity.id] = initDraft(activity);
  }
  return STATE.activityDraft[activity.id];
}
function initDraft(activity) {
  switch (activity.type) {
    case "poll": return { selected: null };
    case "quiz": return { answers: new Array(activity.stems.length).fill(null) };
    case "matching": return { answers: new Array(activity.terms.length).fill(null) };
    case "bucket": return {
      assignments: new Array(activity.items.length).fill(null),
      pickedIndex: null
    };
    case "ordering": return { order: activity.items.map((_, i) => i) };
    case "spectrum": return { values: activity.items.map(() => 50), notes: activity.items.map(() => "") };
    case "pick": return { selected: null, justification: "" };
    default: return {};
  }
}
function validateDraft(activity, draft) {
  switch (activity.type) {
    case "poll": return draft.selected !== null;
    case "quiz": return draft.answers.every((a) => a !== null);
    case "matching": return draft.answers.every((a) => a !== null);
    case "bucket": return draft.assignments.every((a) => a !== null);
    case "ordering": return true;
    case "spectrum": return draft.notes.every((n) => n.trim().length > 0);
    case "pick": return draft.selected !== null && draft.justification.trim().length > 0;
    default: return false;
  }
}

/* ---- Poll ---- */

      el("span", {}, [opt])
    ]));

  if (a.footer) wrap.appendChild(el("div", { class: "discussion-footer" }, [a.footer]));
  return wrap;
}

function renderQuiz(a, draft) {
  const letters = ["A", "B", "C", "D", "E"];

    const optRow = el("div", { class: "inline-options" }, []);
    a.options.forEach((opt, oi) => {
      optRow.appendChild(el("div", {
        class: `inline-opt ${draft.answers[si] === oi ? "selected" : ""}`,
        "data-action": "quiz-select", "data-id": a.id, "data-stem": si, "data-idx": oi
      }, [`${letters[oi]}) ${opt}`]));
    });
    block.appendChild(optRow);
    wrap.appendChild(block);
  });
  return wrap;
}

      el("option", { value: "" }, ["Choose a definition..."]),
      ...a.displayedDefs.map((d, di) => el("option", { value: di, selected: draft.answers[ti] === di }, [letters[di] + ") " + (d.length > 46 ? d.slice(0, 46) + "\u2026" : d)]))
    ]);
    termCol.appendChild(el("div", { class: "match-term-row" }, [
      el("span", { class: "match-term-num" }, [String(ti + 1)]),
      el("div", { style: "flex:1;" }, [
        el("div", { style: "font-weight:600; font-size:13.5px; margin-bottom:6px;" }, [term]),
        sel
      ])
    ]));
  });
  const defCol = el("div", { class: "match-col" }, [el("h4", { style: "margin-bottom:10px; color:var(--teal);" }, ["Definitions (not in matching order)"])]);
  a.displayedDefs.forEach((d, di) => {
    defCol.appendChild(el("div", { class: "match-def-row" }, [
      el("span", { class: "match-def-letter" }, [letters[di]]),

    ]));
  });
  cols.appendChild(termCol);
  cols.appendChild(defCol);
  wrap.appendChild(cols);
  return wrap;
}

/* ---- Bucket / category sort (also used for GROUP activities) ---- */
function renderBucket(a, draft) {
  const wrap = el("div", { class: "card" }, []);
  if (a.instruction) wrap.appendChild(el("p", { style: "font-style:italic; color:var(--muted); font-size:13px; margin-bottom:14px;" }, [a.instruction]));

  const unassigned = a.items.map((it, i) => i).filter((i) => draft.assignments[i] === null);
  const itemsWrap = el("div", { class: "bucket-items" }, []);
  unassigned.forEach((i) => {
    itemsWrap.appendChild(el("div", {
      class: `bucket-item ${draft.pickedIndex === i ? "picked-for-assign" : ""}`,
      "data-action": "bucket-pick", "data-id": a.id, "data-idx": i
    }, [a.items[i].text]));
  });
  if (unassigned.length === 0) {
    itemsWrap.appendChild(el("div", { style: "color:var(--muted); font-size:13px;" }, ["All items sorted. Tap a category to reassign, or submit below."]));
  }
  wrap.appendChild(itemsWrap);

  const cats = el("div", { class: "bucket-categories" }, []);
  a.categories.forEach((cat, ci) => {
    const catBox = el("div", { class: "bucket-cat", "data-action": "bucket-assign", "data-id": a.id, "data-cat": ci }, [
      el("h4", {}, [cat]),
      el("div", { class: "cat-items" }, a.items.map((it, i) => {
        if (draft.assignments[i] !== ci) return null;
        return el("div", { class: "cat-item" }, [
          el("span", {}, [it.text]),
          el("button", { "data-action": "bucket-remove", "data-id": a.id, "data-idx": i }, ["\u00D7"])
        ]);
      }).filter(Boolean))
    ]);
    cats.appendChild(catBox);
  });
  wrap.appendChild(cats);

  if (a.footer) wrap.appendChild(el("div", { class: "discussion-footer" }, [a.footer]));
  return wrap;
}

/* ---- Spectrum sort ---- */
function renderSpectrum(a, draft) {
  const wrap = el("div", { class: "card" }, []);
  if (a.instruction) wrap.appendChild(el("p", { style: "color:var(--muted); font-size:13px; margin-bottom:16px;" }, [a.instruction]));
  a.items.forEach((item, i) => {
    const box = el("div", { class: "spectrum-item" }, [
      el("div", { class: "spectrum-label" }, [item]),
      el("input", {
        type: "range", min: "0", max: "100", value: draft.values[i], class: "spectrum-track",
        "data-action": "spectrum-slide", "data-id": a.id, "data-idx": i
      }),
      el("div", { class: "spectrum-ends" }, [el("span", {}, ["Not at all effective"]), el("span", {}, ["Very effective"])]),
      el("textarea", {
        placeholder: "One line on why...", value: draft.notes[i],
        "data-action": "spectrum-note", "data-id": a.id, "data-idx": i, rows: 2
      })
    ]);
    wrap.appendChild(box);
  });
  return wrap;
}

/* ---- Synthesis pick ---- */
function renderPick(a, draft) {
  const letters = ["A", "B", "C", "D"];
  const wrap = el("div", { class: "card" }, [
    el("p", { style: "font-weight:600; margin-bottom:16px;" }, [a.prompt])
  ]);
  a.options.forEach((opt, i) => {
    wrap.appendChild(el("div", {
      class: `option-row ${draft.selected === i ? "selected" : ""}`,
      "data-action": "pick-select", "data-id": a.id, "data-idx": i
    }, [
      el("span", { class: "option-letter" }, [letters[i]]),
      el("span", {}, [opt])
    ]));
  });
  wrap.appendChild(el("label", { class: "field-label", style: "margin-top:16px;" }, [a.footer || "Why?"]));
  wrap.appendChild(el("textarea", { id: "pick-justification", "data-action": "pick-justify", "data-id": a.id, value: draft.justification, placeholder: "One sentence..." }));
  return wrap;
}

/* =====================================================================
   SUBMIT
   ===================================================================== */
function buildPayload(activity, draft) {
  switch (activity.type) {
    case "poll": return { selectedIndex: draft.selected };
    case "quiz": return { answers: draft.answers.slice() };
    case "matching": return { answers: draft.answers.slice() };
    case "bucket": return { assignments: draft.assignments.slice() };
    case "ordering": return { order: draft.order.slice() };
    case "spectrum": return { values: draft.values.slice(), notes: draft.notes.slice() };
    case "pick": return { selectedIndex: draft.selected, justification: draft.justification };
    default: return {};
  }
}

async function submitActivity() {
  const found = findActivity(STATE.currentActivityId);
  if (!found) return;
  const { activity } = found;
  const draft = getDraft(activity);
  if (!validateDraft(activity, draft)) return;

  STATE.submitInProgress = true;
  STATE.submitError = null;
  render();

  const payload = buildPayload(activity, draft);
  payload.submittedAt = new Date().toISOString();
  payload.studentName = STATE.studentName;

  const key = activity.group
    ? `${WEEK}:groupresp:${STATE.classSection}:g${STATE.groupNumber}:${activity.id}`
    : `${WEEK}:resp:${STATE.classSection}:${STATE.studentSlug}:${activity.id}`;

  try {
    await kvSet(key, JSON.stringify(payload));
    STATE.submitInProgress = false;
    STATE.courseMapDone[activity.id] = true;
    STATE.screen = "submitted";
    render();
  } catch (err) {
    STATE.submitInProgress = false;
    STATE.submitError = String(err && err.message ? err.message : err);
    render();
  }
}

function renderSubmitted() {
  const found = findActivity(STATE.currentActivityId);
  const block = found ? found.block : null;
  let nextActivity = null;
  if (block) {
    const idx = block.activities.findIndex((a) => a.id === STATE.currentActivityId);
    if (idx >= 0 && idx < block.activities.length - 1) nextActivity = block.activities[idx + 1];
    else {
      const blockIdx = BLOCKS.findIndex((b) => b.id === block.id);
      if (blockIdx >= 0 && blockIdx < BLOCKS.length - 1) nextActivity = BLOCKS[blockIdx + 1].activities[0];
    }
  }
  return el("div", { class: "screen-wrap" }, [
    el("div", { class: "card", style: "text-align:center;" }, [
      el("div", { style: "font-size:40px; margin-bottom:10px;" }, ["\u2705"]),
      el("h2", { class: "page-title" }, ["Submitted!"]),
      el("div", { class: "page-sub" }, ["Your response has been saved."]),
      el("div", { style: "display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:10px;" }, [
        el("button", { class: "secondary-btn", "data-action": "back-to-map" }, ["Back to Course Map"]),
        nextActivity ? el("button", { class: "primary-btn", "data-action": "open-activity", "data-id": nextActivity.id }, [`Next: ${nextActivity.title}`]) : null
      ])
    ])
  ]);
}

async function loadDashboardData() {
  STATE.dashboard.loading = true;
  render();
  const cls = STATE.dashboard.classTab;
  const data = {};
  const allActivities = BLOCKS.flatMap((b) => b.activities);
  await mapLimited(allActivities, 4, async (a) => {
    if (a.group) {
      const prefix = `${WEEK}:groupresp:${cls}:`;
      const keys = await kvList(prefix + "");
      const relevant = keys.filter((k) => k.endsWith(":" + a.id));
      const values = await mapLimited(relevant, 4, async (k) => {
        const v = await kvGet(k);
        return v ? safeParse(v) : null;
      });
      data[a.id] = { group: values.filter(Boolean) };
    } else {
      const prefix = `${WEEK}:resp:${cls}:`;
      const keys = await kvList(prefix);
      const relevant = keys.filter((k) => k.endsWith(":" + a.id));
      const values = await mapLimited(relevant, 4, async (k) => {
        const v = await kvGet(k);
        return v ? safeParse(v) : null;
      });
      data[a.id] = { individual: values.filter(Boolean) };
    }
  });
  STATE.dashboard.data = data;
  STATE.dashboard.loading = false;
  render();
}
function safeParse(v) { try { return JSON.parse(v); } catch (e) { return null; } }

function renderInstructorDashboard() {
  const wrap = el("div", { class: "dash-wrap" }, []);
  const header = el("div", { class: "dash-header" }, [
    el("div", { class: "dash-title" }, ["Week 11 \u2014 Instructor Dashboard"]),
    el("div", { class: "dash-actions" }, [
      el("button", { class: "gold-btn", "data-action": "refresh-dashboard", disabled: STATE.dashboard.loading }, ["\uD83D\uDD04 Refresh All"]),
      el("button", { class: "danger-btn", "data-action": "reset-all", disabled: STATE.dashboard.resetInProgress }, ["\uD83D\uDDD1 Reset All"])
    ])
  ]);
  wrap.appendChild(header);

  const tabs = el("div", { class: "class-tabs" }, [
    el("div", { class: `class-tab ${STATE.dashboard.classTab === "A" ? "active" : ""}`, "data-action": "dash-tab", "data-class": "A" }, ["A Class (24)"]),
    el("div", { class: `class-tab ${STATE.dashboard.classTab === "B" ? "active" : ""}`, "data-action": "dash-tab", "data-class": "B" }, ["B Class (20)"])
  ]);
  wrap.appendChild(tabs);

  if (STATE.dashboard.resetInProgress) {
    wrap.appendChild(el("div", { class: "result-card" }, [
      el("span", { class: "loading-spinner" }),
      `Resetting\u2026 ${STATE.dashboard.resetProgress ? STATE.dashboard.resetProgress.done + "/" + STATE.dashboard.resetProgress.total : "starting"}`
    ]));
  }
  if (STATE.dashboard.error) {
    wrap.appendChild(el("div", { class: "inline-error" }, [
      el("div", {}, [
        "\u26A0\uFE0F Something went wrong.",
        el("div", { class: "tech-detail" }, [STATE.dashboard.error])
      ]),
      el("button", { class: "secondary-btn", "data-action": "refresh-dashboard" }, ["Retry"])
    ]));
  }

  if (STATE.dashboard.loading) {
    wrap.appendChild(el("p", {}, [el("span", { class: "loading-spinner" }), "Loading results..."]));
    return wrap;
  }

  BLOCKS.forEach((block) => {
    const blockWrap = el("div", { class: "dash-block" }, [el("h3", {}, [block.label])]);
    block.activities.forEach((a) => {
      blockWrap.appendChild(renderDashResultCard(a));
    });
    wrap.appendChild(blockWrap);
  });

  return wrap;
}

function renderDashResultCard(activity) {
  const bucket = STATE.dashboard.data[activity.id] || {};
  const responses = activity.group ? (bucket.group || []) : (bucket.individual || []);
  const n = responses.length;
  const expected = activity.group ? groupCountFor(STATE.dashboard.classTab) : CLASS_SIZES[STATE.dashboard.classTab];

  const card = el("div", { class: "result-card" }, [
    el("h4", {}, [activity.title, el("span", { class: "result-meta", style: "margin-left:6px;" }, [`(${activity.group ? "group" : "individual"})`])]),
    el("div", { class: "result-meta" }, [`${n} of ${expected} ${activity.group ? "groups" : "students"} submitted`])
  ]);

  if (n === 0) {
    card.appendChild(el("div", { class: "empty-note" }, ["No submissions yet."]));
    return card;
  }

  switch (activity.type) {
    case "poll": card.appendChild(renderDashPoll(activity, responses)); break;
    case "quiz": card.appendChild(renderDashQuiz(activity, responses)); break;
    case "matching": card.appendChild(renderDashMatching(activity, responses)); break;
    case "bucket": card.appendChild(renderDashBucket(activity, responses)); break;
    case "ordering": card.appendChild(renderDashOrdering(activity, responses)); break;
    case "spectrum": card.appendChild(renderDashSpectrum(activity, responses)); break;
    case "pick": card.appendChild(renderDashPick(activity, responses)); break;
  }
  return card;
}

function tally(responses, extractFn, labels) {
  const counts = labels.map(() => 0);
  responses.forEach((r) => {
    const idx = extractFn(r);
    if (idx !== null && idx !== undefined && counts[idx] !== undefined) counts[idx]++;
  });
  return counts;
}

function renderDashPoll(a, responses) {
  const counts = tally(responses, (r) => r.selectedIndex, a.options);
  const box = el("div", {}, []);
  a.options.forEach((opt, i) => {
    const pct = responses.length ? Math.round((counts[i] / responses.length) * 100) : 0;
    box.appendChild(el("div", { class: "dash-stem" }, [
      el("div", { class: "q-text" }, [`${opt} \u2014 ${counts[i]} (${pct}%)`]),
      el("div", { class: "progress-line" }, [el("div", { class: "progress-line-fill", style: `width:${pct}%;` })])
    ]));
  });
  return box;
}

function renderDashQuiz(a, responses) {
  const box = el("div", {}, []);
  a.stems.forEach((stem, si) => {
    const counts = tally(responses, (r) => r.answers ? r.answers[si] : null, a.options);
    const correctCount = counts[stem.correct] || 0;
    const pct = responses.length ? Math.round((correctCount / responses.length) * 100) : 0;
    box.appendChild(el("div", { class: "dash-stem" }, [
      el("div", { class: "q-text" }, [`${si + 1}. ${stem.text}`]),
      el("div", { class: "dash-correct" }, [`Correct: ${a.options[stem.correct]}`, el("span", { class: "accuracy-badge" }, [`${pct}% correct`])]),
      el("div", { class: "dash-tally" }, [a.options.map((o, oi) => `${o}: ${counts[oi]}`).join("  \u00B7  ")])
    ]));
  });
  return box;
}

function renderDashMatching(a, responses) {
  const box = el("div", {}, []);
  a.terms.forEach((term, ti) => {
    const counts = tally(responses, (r) => r.answers ? r.answers[ti] : null, a.displayedDefs);
    const correctCount = counts[a.correctDefIndex[ti]] || 0;
    const pct = responses.length ? Math.round((correctCount / responses.length) * 100) : 0;
    box.appendChild(el("div", { class: "dash-stem" }, [
      el("div", { class: "q-text" }, [term]),
      el("div", { class: "dash-correct" }, [`Correct definition: ${a.displayedDefs[a.correctDefIndex[ti]]}`, el("span", { class: "accuracy-badge" }, [`${pct}% correct`])])
    ]));
  });
  return box;
}

function renderDashBucket(a, responses) {
  const box = el("div", {}, []);
  a.items.forEach((item, ii) => {
    const counts = tally(responses, (r) => r.assignments ? r.assignments[ii] : null, a.categories);
    const correctCount = counts[item.correct] || 0;
    const pct = responses.length ? Math.round((correctCount / responses.length) * 100) : 0;
    box.appendChild(el("div", { class: "dash-stem" }, [
      el("div", { class: "q-text" }, [item.text]),
      el("div", { class: "dash-correct" }, [`Correct category: ${a.categories[item.correct]}`, el("span", { class: "accuracy-badge" }, [`${pct}% correct`])])
    ]));
  });
  return box;
}

function renderDashOrdering(a, responses) {
  let fullyCorrect = 0;
  responses.forEach((r) => {
    if (r.order && JSON.stringify(r.order) === JSON.stringify(a.correctOrder)) fullyCorrect++;
  });
  const pct = responses.length ? Math.round((fullyCorrect / responses.length) * 100) : 0;
  const correctList = a.correctOrder.map((idx, pos) => `${pos + 1}. ${a.items[idx]}`).join(" ");
  return el("div", { class: "dash-stem" }, [
    el("div", { class: "dash-correct" }, ["Correct order:", el("span", { class: "accuracy-badge" }, [`${pct}% fully correct`])]),
    el("div", { class: "q-text", style: "margin-top:6px;" }, [correctList])
  ]);
}

function renderDashSpectrum(a, responses) {
  const box = el("div", {}, []);
  a.items.forEach((item, ii) => {
    const vals = responses.map((r) => (r.values ? r.values[ii] : null)).filter((v) => v !== null && v !== undefined);
    const avg = vals.length ? Math.round(vals.reduce((s, v) => s + Number(v), 0) / vals.length) : 0;
    box.appendChild(el("div", { class: "dash-stem" }, [
      el("div", { class: "q-text" }, [item]),
      el("div", { class: "dash-tally" }, [`Average: ${avg}/100 (n=${vals.length})`]),
      el("div", { class: "progress-line" }, [el("div", { class: "progress-line-fill", style: `width:${avg}%;` })])
    ]));
  });
  return box;
}

function renderDashPick(a, responses) {
  const counts = tally(responses, (r) => r.selectedIndex, a.options);
  const box = el("div", {}, []);
  a.options.forEach((opt, i) => {
    const pct = responses.length ? Math.round((counts[i] / responses.length) * 100) : 0;
    box.appendChild(el("div", { class: "dash-stem" }, [
      el("div", { class: "q-text" }, [`${opt} \u2014 ${counts[i]} (${pct}%)`]),
      el("div", { class: "progress-line" }, [el("div", { class: "progress-line-fill", style: `width:${pct}%;` })])
    ]));
  });
  const withJust = responses.filter((r) => r.justification).slice(0, 6);
  if (withJust.length) {
    box.appendChild(el("div", { style: "margin-top:10px;" }, [
      el("div", { class: "dash-tally", style: "margin-bottom:6px;" }, ["Sample justifications:"]),
      ...withJust.map((r) => el("div", { class: "q-text", style: "margin-bottom:4px;" }, [`"${r.justification}"`]))
    ]));
  }
  return box;
}

/* =====================================================================
   RESET ALL
   ===================================================================== */
async function resetAll() {
  STATE.dashboard.resetInProgress = true;
  STATE.dashboard.error = null;
  STATE.dashboard.resetProgress = null;
  render();
  try {
    const allKeys = [];
    for (const cls of ["A", "B"]) {
      const respKeys = await kvList(`${WEEK}:resp:${cls}:`);
      const groupKeys = await kvList(`${WEEK}:groupresp:${cls}:`);
      allKeys.push(...respKeys, ...groupKeys);
    }
    await mapLimited(allKeys, 5, async (k) => {
      await kvDelete(k);
      STATE.dashboard.resetProgress = { done: (STATE.dashboard.resetProgress ? STATE.dashboard.resetProgress.done : 0) + 1, total: allKeys.length };
      render();
    });
    // verify
    let remaining = 0;
    for (const cls of ["A", "B"]) {
      const r1 = await kvList(`${WEEK}:resp:${cls}:`);
      const r2 = await kvList(`${WEEK}:groupresp:${cls}:`);
      remaining += r1.length + r2.length;
    }
    STATE.dashboard.resetInProgress = false;
    if (remaining > 0) {
      STATE.dashboard.error = `Reset incomplete \u2014 ${remaining} key(s) still remain. Try again.`;
      render();
      return;
    }
    // success: clear local student session state too, and confirm
    resetLocalStudentSession();
    showModal({
      title: "Reset complete",
      body: "All response data for both classes has been cleared, and local session state has been reset.",
      confirmLabel: "OK",
      onConfirm: () => { closeModal(); loadDashboardData(); }
    });
  } catch (err) {
    STATE.dashboard.resetInProgress = false;
    STATE.dashboard.error = String(err && err.message ? err.message : err);
    render();
  }
}
function resetLocalStudentSession() {
  STATE.studentName = "";
  STATE.studentSlug = "";
  STATE.classSection = null;
  STATE.groupNumber = null;
  STATE.currentActivityId = null;
  STATE.courseMapDone = {};
  STATE.activityDraft = {};
}

/* =====================================================================
   EVENT DELEGATION
   ===================================================================== */
let delegatedBound = false;
function bindDelegatedEvents() {
  if (delegatedBound) return;
  delegatedBound = true;

  document.addEventListener("click", async (e) => {
    const target = e.target.closest("[data-action]");
    if (!target) return;
    const action = target.getAttribute("data-action");

    switch (action) {
      case "toggle-role": {
        const role = target.getAttribute("data-role");
        if (role === "student") {
          if (STATE.role !== "student") {
            STATE.role = "student";
            if (!STATE.studentName) STATE.screen = "student-name";
            else if (!STATE.classSection) STATE.screen = "student-class";
            else STATE.screen = "course-map";
          }
        } else {
          STATE.role = "instructor";
          STATE.screen = STATE.instructorAuthed ? "instructor-dashboard" : "instructor-password";
          if (STATE.instructorAuthed) loadDashboardData();
        }
        render();
        break;
      }
      case "enter-student":
        STATE.role = "student";
        STATE.screen = "student-name";
        render();
        break;
      case "enter-instructor":
        STATE.role = "instructor";
        STATE.screen = STATE.instructorAuthed ? "instructor-dashboard" : "instructor-password";
        render();
        if (STATE.instructorAuthed) loadDashboardData();
        break;
      case "submit-name": {
        const input = document.getElementById("name-input");
        const val = input ? input.value.trim() : "";
        const errEl = document.getElementById("name-error");
        if (!val) {
          if (errEl) errEl.innerHTML = "";
          if (errEl) errEl.appendChild(el("div", { class: "inline-error" }, ["Please enter your name."]));
          return;
        }
        STATE.studentName = val;
        STATE.studentSlug = slugify(val);
        STATE.screen = "student-class";
        render();
        break;
      }
      case "choose-class": {
        STATE.classSection = target.getAttribute("data-class");
        STATE.screen = "course-map";
        render();
        loadCourseMapDone();
        break;
      }
      case "open-activity": {
        STATE.currentActivityId = target.getAttribute("data-id");
        STATE.submitError = null;
        STATE.screen = "activity";
        render();
        break;
      }
      case "back-to-map":
        STATE.screen = "course-map";
        render();
        loadCourseMapDone();
        break;
      case "confirm-group": {
        const sel = document.getElementById("group-select");
        const val = sel ? sel.value : "";
        if (!val) {
          showModal({ title: "Pick a group", body: "Please choose a group number before continuing.", confirmLabel: "OK", onConfirm: closeModal });
          return;
        }
        STATE.groupNumber = Number(val);
        render();
        break;
      }
      case "change-group": {
        e.preventDefault();
        showModal({
          title: "Change group?",
          body: `You're currently in Group ${STATE.groupNumber}. Changing groups affects both group activities this session.`,
          confirmLabel: "Change Group", cancelLabel: "Cancel", danger: false,
          onConfirm: () => { STATE.groupNumber = null; closeModal(); },
          onCancel: closeModal
        });
        break;
      }
      case "poll-select": {
        const id = target.getAttribute("data-id");
        const idx = Number(target.getAttribute("data-idx"));
        getDraft(findActivity(id).activity).selected = idx;
        render();
        break;
      }
      case "quiz-select": {
        const id = target.getAttribute("data-id");
        const stem = Number(target.getAttribute("data-stem"));
        const idx = Number(target.getAttribute("data-idx"));
        getDraft(findActivity(id).activity).answers[stem] = idx;
        render();
        break;
      }
      case "order-up": case "order-down": {
        const id = target.getAttribute("data-id");
        const pos = Number(target.getAttribute("data-pos"));
        const draft = getDraft(findActivity(id).activity);
        const swapWith = action === "order-up" ? pos - 1 : pos + 1;
        if (swapWith < 0 || swapWith >= draft.order.length) return;
        const tmp = draft.order[pos];
        draft.order[pos] = draft.order[swapWith];
        draft.order[swapWith] = tmp;
        render();
        break;
      }
      case "bucket-pick": {
        const id = target.getAttribute("data-id");
        const idx = Number(target.getAttribute("data-idx"));
        const draft = getDraft(findActivity(id).activity);
        draft.pickedIndex = draft.pickedIndex === idx ? null : idx;
        render();
        break;
      }
      case "bucket-assign": {
        const id = target.getAttribute("data-id");
        const cat = Number(target.getAttribute("data-cat"));
        const draft = getDraft(findActivity(id).activity);
        if (draft.pickedIndex !== null) {
          draft.assignments[draft.pickedIndex] = cat;
          draft.pickedIndex = null;
          render();
        }
        break;
      }
      case "bucket-remove": {
        const id = target.getAttribute("data-id");
        const idx = Number(target.getAttribute("data-idx"));
        const draft = getDraft(findActivity(id).activity);
        draft.assignments[idx] = null;
        render();
        break;
      }
      case "pick-select": {
        const id = target.getAttribute("data-id");
        const idx = Number(target.getAttribute("data-idx"));
        getDraft(findActivity(id).activity).selected = idx;
        render();
        break;
      }
      case "submit-activity": case "retry-submit":
        submitActivity();
        break;
      case "submit-instructor-password": {
        const input = document.getElementById("instructor-password-input");
        const val = input ? input.value : "";
        if (val === INSTRUCTOR_PASSWORD) {
          STATE.instructorAuthed = true;
          STATE.screen = "instructor-dashboard";
          render();
          loadDashboardData();
        } else {
          const errEl = document.getElementById("password-error");
          if (errEl) {
            errEl.innerHTML = "";
            errEl.appendChild(el("div", { class: "inline-error" }, ["Incorrect password. Try again."]));
          }
        }
        break;
      }
      case "dash-tab": {
        STATE.dashboard.classTab = target.getAttribute("data-class");
        render();
        loadDashboardData();
        break;
      }
      case "refresh-dashboard":
        loadDashboardData();
        break;
      case "reset-all": {
        showModal({
          title: "Reset all data?",
          body: "This permanently clears every response for both A Class and B Class, and returns any active student session to the landing screen. This cannot be undone.",
          confirmLabel: "Reset Everything", cancelLabel: "Cancel", danger: true,
          onConfirm: () => { closeModal(); resetAll(); },
          onCancel: closeModal
        });
        break;
      }
      case "modal-confirm":
        if (STATE.modal && STATE.modal.onConfirm) STATE.modal.onConfirm();
        else closeModal();
        break;
      case "modal-cancel":
        if (STATE.modal && STATE.modal.onCancel) STATE.modal.onCancel();
        else closeModal();
        break;
    }
  });

  document.addEventListener("change", (e) => {
    const target = e.target;
    const action = target.getAttribute && target.getAttribute("data-action");
    if (!action) return;
    if (action === "match-select") {
      const id = target.getAttribute("data-id");
      const term = Number(target.getAttribute("data-term"));
      const val = target.value === "" ? null : Number(target.value);
      getDraft(findActivity(id).activity).answers[term] = val;
      render();
    } else if (action === "spectrum-slide") {
      const id = target.getAttribute("data-id");
      const idx = Number(target.getAttribute("data-idx"));
      getDraft(findActivity(id).activity).values[idx] = Number(target.value);
    }
  });

  document.addEventListener("input", (e) => {
    const target = e.target;
    const action = target.getAttribute && target.getAttribute("data-action");
    if (!action) return;
    if (action === "spectrum-note") {
      const id = target.getAttribute("data-id");
      const idx = Number(target.getAttribute("data-idx"));
      getDraft(findActivity(id).activity).notes[idx] = target.value;
      // enable/disable submit without full re-render (avoid losing focus)
      updateSubmitButtonState();
    } else if (action === "pick-justify") {
      const id = target.getAttribute("data-id");
      getDraft(findActivity(id).activity).justification = target.value;
      updateSubmitButtonState();
    }
  });
}

function updateSubmitButtonState() {
  const found = findActivity(STATE.currentActivityId);
  if (!found) return;
  const draft = getDraft(found.activity);
  const canSubmit = validateDraft(found.activity, draft);
  const btn = document.querySelector('[data-action="submit-activity"]');
  if (btn) btn.disabled = !canSubmit || STATE.submitInProgress;
}

/* =====================================================================
   INIT
   ===================================================================== */
render();
</script>
</body>
</html>
