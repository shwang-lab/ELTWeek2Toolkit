<script>
"use strict";

/* =========================================================
   7a. Storage Backend shim (reusable, do not rebuild)
   ========================================================= */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzJc_RFDdhCU4_VB41uMefmy6cKgjg4DVwqVk1xBDa5MDAA0aMq53VinzQf1iZKyy4i/exec";
const WEEK_NS = "week12";

/* ---- adaptive throttle shared by every raw storage call ---- */
const Throttle = {
  minGap: 120,       // ms, shrinks on success, grows on failure
  maxGap: 4000,
  lastDispatch: 0,
  pending: [],
  debounceTimer: null,
  queue(fn) {
    return new Promise((resolve, reject) => {
      this.pending.push({ fn, resolve, reject });
      this._schedule();
    });
  },
  _schedule() {
    if (this.debounceTimer) return;
    this.debounceTimer = setTimeout(() => { this.debounceTimer = null; this._drain(); }, 15);
  },
  async _drain() {
    while (this.pending.length) {
      const now = Date.now();
      const wait = Math.max(0, this.lastDispatch + this.minGap - now);
      if (wait > 0) await sleep(wait);
      const job = this.pending.shift();
      this.lastDispatch = Date.now();
      try {
        const result = await job.fn();
        this.minGap = Math.max(60, this.minGap * 0.9);
        job.resolve(result);
      } catch (e) {
        this.minGap = Math.min(this.maxGap, this.minGap * 1.8);
        job.reject(e);
      }
    }
  },
};
function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

async function rawGet(key) {
  const res = await fetch(APPS_SCRIPT_URL + "?action=get&key=" + encodeURIComponent(key));
  const data = await res.json();
  if (data.status !== "ok") throw new Error(data.message || "get failed");
  return data.value;
}
async function rawSet(key, value) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "set", key, value }),
  });
  const data = await res.json();
  if (data.status !== "ok") throw new Error(data.message || "set failed");
  return true;
}
async function rawList(prefix) {
  const res = await fetch(APPS_SCRIPT_URL + "?action=list&prefix=" + encodeURIComponent(prefix));
  const data = await res.json();
  if (data.status !== "ok") throw new Error(data.message || "list failed");
  return data.keys;
}
async function rawDelete(key) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "delete", key }),
  });
  const data = await res.json();
  if (data.status !== "ok") throw new Error(data.message || "delete failed");
  return true;
}

async function withRetry(fn, attempts) {
  attempts = attempts || 4;
  let lastErr;
  for (let i = 0; i < attempts; i++) {
    try {
      return await Throttle.queue(fn);
    } catch (e) {
      lastErr = e;
      await sleep(200 * Math.pow(2, i));
    }
  }
  throw lastErr;
}

async function kvGet(key) {
  try {
    return await withRetry(() => rawGet(key), 4);
  } catch (e) {
    return null; // caller treats as absent
  }
}
async function kvSet(key, value) {
  return withRetry(() => rawSet(key, value), 4); // throws on final failure -> caller shows inline error
}
async function kvList(prefix) {
  try {
    return await withRetry(() => rawList(prefix), 4);
  } catch (e) {
    return []; // treat as empty on repeated failure -- SAFE for read-only display paths only
  }
}
// Strict variant: does NOT swallow failures. Bulk/destructive flows (Reset All) must be able to
// tell "genuinely empty" apart from "couldn't reach the server" -- see doResetAll below.
async function kvListOrThrow(prefix) {
  return withRetry(() => rawList(prefix), 4);
}
async function kvDelete(key) {
  return withRetry(() => rawDelete(key), 4);
}

function sanitizeKeyPart(s) {
  return String(s).trim().toLowerCase().replace(/[\s\/\\'"]+/g, "-").slice(0, 60) || "anon";
}

/* =========================================================
   Deterministic per-activity shuffle (non-identity, no fixed points)
   ========================================================= */
function seededShuffleNoFixedPoints(arr, seed) {
  // Fisher-Yates with a simple seeded PRNG; retry until zero fixed points (small arrays -> fast)
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  let attempt = 0;
  let order = arr.map((_, i) => i);
  while (attempt < 50) {
    const rng = mulberry32(seed + attempt * 7919);
    order = arr.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    const hasFixedPoint = order.some((v, i) => v === i);
    if (!hasFixedPoint) break;
    attempt++;
  }
  return order;
}
function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) { h = (Math.imul(31, h) + s.charCodeAt(i)) | 0; }
  return h;
}

/* =========================================================
   Custom modal (never native alert/confirm/prompt)
   ========================================================= */
function showModal({ title, body, okText, cancelText, onOk, onCancel }) {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  const card = document.createElement("div");
  card.className = "modal-card";
  card.innerHTML = "<h3></h3><div class='mbody'></div><div class='modal-actions'></div>";
  card.querySelector("h3").textContent = title || "";
  card.querySelector(".mbody").textContent = body || "";
  overlay.appendChild(card);
  const actions = card.querySelector(".modal-actions");
  if (cancelText) {
    const cancelBtn = document.createElement("button");
    cancelBtn.className = "btn secondary";
    cancelBtn.textContent = cancelText;
    cancelBtn.onclick = () => { overlay.remove(); if (onCancel) onCancel(); };
    actions.appendChild(cancelBtn);
  }
  const okBtn = document.createElement("button");
  okBtn.className = "btn";
  okBtn.textContent = okText || "OK";
  okBtn.onclick = () => { overlay.remove(); if (onOk) onOk(); };
  actions.appendChild(okBtn);
  document.body.appendChild(overlay);
  return overlay;
}

  student: { name: "", cls: null, groups: {} }, // groups: {activityId: groupNum}
  instructorAuthed: false,
  currentActivity: null,
  completed: {},           // {activityId: true}
  loading: false,
  errorMsg: null,
  techErrorMsg: null,
  dash: { cls: "A", data: {}, loadingDash: false, resetInProgress: false, resetProgress: null },

};

}

/* ---------- Activity screen ---------- */
function renderActivity() {
  const id = STATE.currentActivity;
  const a = ACTIVITIES[id];
  const s = document.createElement("div");
  s.className = "screen wide";

  let bodyHtml = "";
  if (!STATE.draft[id]) STATE.draft[id] = {};
  const draft = STATE.draft[id];

  if (a.type === "poll") {
    bodyHtml = `<p style="font-weight:700;">${escapeHtml(a.prompt)}</p><div id="pollOpts">` +
      a.options.map((o, i) => `
        <div class="opt-row ${draft.choice === i ? "selected" : ""}" data-action="poll-choose" data-idx="${i}">
          <div class="opt-letter">${"ABCD"[i]}</div><div>${escapeHtml(o)}</div>
        </div>`).join("") + `</div>`;
    if (a.noRightAnswer) bodyHtml += `<div class="footer-note">\ud83d\udcac no right answer here</div>`;
  } else if (a.type === "scenario") {
    bodyHtml = a.stems.map((st, si) => `
      <div class="stem">
        <div class="stemtext">${si + 1}. ${escapeHtml(st.q)}</div>
        ${st.options.map((o, oi) => `
          <div class="opt-row ${draft["s" + si] === oi ? "selected" : ""}" data-action="scenario-choose" data-si="${si}" data-oi="${oi}">
            <div class="opt-letter">${"ABCD"[oi]}</div><div>${escapeHtml(o)}</div>
          </div>`).join("")}
      </div>`).join("");
  } else if (a.type === "ordering") {
    // Initial order must NOT start already-correct -- shuffle with zero fixed points relative to
    // the item's own index, since correctOrder for every ordering activity we ship is the identity
    // permutation (item index i belongs at position i). A student must actually move things.
    if (!draft.order) draft.order = seededShuffleNoFixedPoints(a.items, hashStr(id + ":" + WEEK_NS + ":initorder"));
    bodyHtml = `<p style="font-weight:700;">${escapeHtml(a.prompt)}</p><ul class="order-list" id="orderList">` +
      draft.order.map((itemIdx, pos) => `
        <li class="order-item" data-pos="${pos}">
          <div class="num">${pos + 1}</div>
          <div class="txt">${escapeHtml(a.items[itemIdx])}</div>
          <div class="arrows">
            <button data-action="order-up" data-pos="${pos}" ${pos === 0 ? "disabled" : ""}>\u25b2</button>
            <button data-action="order-down" data-pos="${pos}" ${pos === draft.order.length - 1 ? "disabled" : ""}>\u25bc</button>
          </div>
        </li>`).join("") + `</ul>`;
  } else if (a.type === "matching") {
    const seed = hashStr(id + ":" + WEEK_NS);
    if (!draft.dispOrder) draft.dispOrder = seededShuffleNoFixedPoints(a.defs, seed);
    if (!draft.picks) draft.picks = a.terms.map(() => null); // picks[termIdx] = defIdx (original index)
    // IMPORTANT: the option's displayed letter must be based on its DISPLAY position (dispOrder),
    // never on the definition's original/canonical index -- labeling by canonical index (e.g. always
    // showing "C" for the definition that happens to be defs[2]) directly encodes the answer key,
    // since a.correct maps term i -> defs[i]. Every dropdown shares the same dispOrder, so a
    // position-based letter is consistent across terms without leaking which term it answers.
    bodyHtml = `<p style="font-weight:700;">Choose the correct definition for each term.</p><div class="match-cols">` +
      `<div>` + a.terms.map((t, ti) => `
        <div class="match-term">
          <div style="font-weight:700;min-width:150px;">${ti + 1}. ${escapeHtml(t)}</div>
          <select data-action="match-pick" data-term="${ti}">
            <option value="">\u2014 choose \u2014</option>
            ${draft.dispOrder.map((defIdx, dispPos) => `<option value="${defIdx}" ${draft.picks[ti] === defIdx ? "selected" : ""}>${"ABCDE"[dispPos]}) ${escapeHtml(a.defs[defIdx])}</option>`).join("")}
          </select>
        </div>`).join("") + `</div><div></div></div>`;
  } else if (a.type === "bucket") {
    if (!draft.assign) draft.assign = {}; // itemIdx -> catIdx
    bodyHtml = `<p style="font-weight:700;">${escapeHtml(a.prompt)}</p>` +
      `<div class="bucket-items" id="bucketItems">` +
      a.items.map((it, ii) => (draft.assign[ii] === undefined ? `
        <div class="bucket-chip ${draft.selected === ii ? "selected" : ""}" data-action="bucket-select" data-item="${ii}">${escapeHtml(it)}</div>` : "")).join("") +
      `</div><div class="bucket-cats">` +
      a.categories.map((c, ci) => `
        <div class="bucket-cat" data-action="bucket-assign" data-cat="${ci}">
          <h4>${escapeHtml(c)}</h4>
          ${Object.keys(draft.assign).filter((k) => draft.assign[k] === ci).map((k) => `<div class="placed-chip">${escapeHtml(a.items[k])}</div>`).join("")}
        </div>`).join("") + `</div>` +
      `<div class="footer-note">\ud83d\udcac Discuss as a group before submitting one sort per group. Tap an item, then tap its category.</div>`;
  } else if (a.type === "spectrum") {
    if (draft.value === undefined) draft.value = 50;
    bodyHtml = `<p style="font-weight:700;">${escapeHtml(a.prompt)}</p>
      <div class="spectrum-track" id="spectrumTrack">
        <div class="spectrum-handle" id="spectrumHandle" data-action="spectrum-noop" style="left:${draft.value}%;"></div>
      </div>
      <div class="spectrum-labels"><span>${escapeHtml(a.leftLabel)}</span><span>${escapeHtml(a.rightLabel)}</span></div>
      <div class="field-row"><label>One-sentence justification</label>
        <textarea id="spectrumJustify" rows="2" placeholder="Because...">${escapeHtml(draft.justify || "")}</textarea>
      </div>`;
  }

  const groupNote = a.group ? `<div class="footer-note">Submitting as Group ${STATE.student.groups[id] || "?"}, Class ${STATE.student.cls}.</div>` : "";

  s.innerHTML = `
    <div class="kicker">${a.label.toUpperCase()} \u00b7 TOOLKIT${a.group ? " (GROUP)" : ""}</div>
    <span class="pill block">${escapeHtml(a.label)}</span>
    <span class="pill ${a.group ? "mode-grp" : "mode-ind"}">${a.group ? "GROUP" : "INDIVIDUAL"}</span>
    <h2 style="color:var(--teal);margin-top:14px;">${escapeHtml(a.title)}</h2>
    <div id="activityBody">${bodyHtml}</div>
    ${groupNote}
    ${STATE.errorMsg ? `<div class="error-banner">${escapeHtml(STATE.errorMsg)}${STATE.techErrorMsg ? `<span class="tech">${escapeHtml(STATE.techErrorMsg)}</span>` : ""}</div>` : ""}
    <div style="margin-top:20px;display:flex;gap:10px;">
      <button class="btn secondary" data-action="back-to-map">Back to Course Map</button>
      <button class="btn" data-action="submit-activity" ${STATE.loading ? "disabled" : ""}>${STATE.loading ? '<span class="spinner"></span>Saving...' : "Submit"}</button>
    </div>
  `;
  return s;
}

function renderDashCard(a, id, entries) {
  const n = entries.length;
  let html = `<h4>${escapeHtml(a.title)} <span style="color:var(--muted-light,#9db3ac);font-weight:400;">(${n} submitted)</span></h4>`;
  if (a.type === "poll") {
    const counts = a.options.map(() => 0);
    entries.forEach((e) => { if (e && typeof e.choice === "number") counts[e.choice]++; });
    a.options.forEach((o, i) => {
      html += `<div class="result-row"><span>${"ABCD"[i]}) ${escapeHtml(o)}</span><span>${counts[i]}</span></div>`;
    });
  } else if (a.type === "scenario") {
    a.stems.forEach((st, si) => {
      let correctCount = 0;
      entries.forEach((e) => { if (e && e["s" + si] === st.correct) correctCount++; });
      const pct = n ? Math.round((100 * correctCount) / n) : 0;
      html += `<div class="result-row correct"><span>Q${si + 1}: correct = ${"ABCD"[st.correct]}) ${escapeHtml(st.options[st.correct])}</span><span class="acc-badge">${correctCount}/${n} (${pct}%)</span></div>`;
    });
  } else if (a.type === "matching") {
    let correctCount = 0;
    entries.forEach((e) => {
      if (e && Array.isArray(e.picks)) {
        const allRight = e.picks.every((p, ti) => p === a.correct[ti]);
        if (allRight) correctCount++;
      }
    });
    const pct = n ? Math.round((100 * correctCount) / n) : 0;
    html += `<div class="result-row correct"><span>Correct answer key: ${a.terms.map((t, i) => `${t}\u2192${a.defs[a.correct[i]]}`).join(" | ")}</span></div>`;
    html += `<div class="result-row correct"><span>Fully correct submissions</span><span class="acc-badge">${correctCount}/${n} (${pct}%)</span></div>`;
  } else if (a.type === "ordering") {
    let correctCount = 0;
    entries.forEach((e) => { if (e && Array.isArray(e.order) && JSON.stringify(e.order) === JSON.stringify(a.correctOrder)) correctCount++; });
    const pct = n ? Math.round((100 * correctCount) / n) : 0;
    html += `<div class="result-row correct"><span>Correct order: ${a.correctOrder.map((i) => i + 1).join(" \u2192 ")}</span><span class="acc-badge">${correctCount}/${n} (${pct}%)</span></div>`;
  } else if (a.type === "bucket") {
    entries.forEach((e, ei) => {
      const label = a.group ? `Group ${e.groupNum || "?"}` : `Submission ${ei + 1}`;
      let correctCount = 0;
      if (e && e.assign) {
        a.items.forEach((_, ii) => { if (e.assign[ii] === a.correctCat[ii]) correctCount++; });
      }
      html += `<div class="result-row"><span>${label}</span><span class="acc-badge">${correctCount}/${a.items.length} match suggested key</span></div>`;
    });
  } else if (a.type === "spectrum") {
    entries.forEach((e, ei) => {
      html += `<div class="result-row"><span>${escapeHtml((e && e.justify) || "(no justification)")}</span><span>${e ? e.value : "?"}/100</span></div>`;
    });
  }
  return html;
}

/* =========================================================
   Event delegation
   ========================================================= */
function attachDelegatedHandlers(root) {
  root.querySelectorAll("[data-action]").forEach((el) => {
    el.addEventListener("click", onAction);
  });
  const nameInput = root.querySelector("#nameInput");
  if (nameInput) nameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") doSubmitName(); });
  const pwInput = root.querySelector("#pwInput");
  if (pwInput) pwInput.addEventListener("keydown", (e) => { if (e.key === "Enter") doSubmitPassword(); });
  const justify = root.querySelector("#spectrumJustify");
  if (justify) justify.addEventListener("input", (e) => {
    const id = STATE.currentActivity;
    STATE.draft[id] = STATE.draft[id] || {};
    STATE.draft[id].justify = e.target.value;
  });
  const track = root.querySelector("#spectrumTrack");
  if (track) {
    track.addEventListener("click", (e) => {
      const rect = track.getBoundingClientRect();
      const pct = Math.max(0, Math.min(100, Math.round((100 * (e.clientX - rect.left)) / rect.width)));
      const id = STATE.currentActivity;
      STATE.draft[id] = STATE.draft[id] || {};
      STATE.draft[id].value = pct;
      render();
    });
  }
  const selects = root.querySelectorAll("select[data-action='match-pick']");
  selects.forEach((sel) => {
    sel.addEventListener("change", (e) => {
      const ti = parseInt(sel.getAttribute("data-term"), 10);
      const id = STATE.currentActivity;
      STATE.draft[id] = STATE.draft[id] || {};
      STATE.draft[id].picks[ti] = e.target.value === "" ? null : parseInt(e.target.value, 10);
    });
  });
}

function onAction(e) {
  const el = e.currentTarget;
  const action = el.getAttribute("data-action");
  switch (action) {
    case "toggle-role": {
      const role = el.getAttribute("data-role");
      if (role === "student") {
        STATE.role = "student";
        STATE.view = STATE.student.name && STATE.student.cls ? "course-map" : "student-name";
      } else {
        STATE.role = "instructor";
        STATE.view = STATE.instructorAuthed ? "instructor-dash" : "instructor-login";
        if (STATE.instructorAuthed) loadDashboard();
      }
      STATE.errorMsg = null;
      render();
      break;
    }
    case "enter-student": STATE.role = "student"; STATE.view = "student-name"; render(); break;
    case "enter-instructor": STATE.role = "instructor"; STATE.view = STATE.instructorAuthed ? "instructor-dash" : "instructor-login"; if (STATE.instructorAuthed) loadDashboard(); render(); break;
    case "submit-name": doSubmitName(); break;
    case "pick-class": STATE.student.cls = el.getAttribute("data-cls"); STATE.view = "course-map"; loadCompletionState(); render(); break;
    case "open-activity": openActivity(el.getAttribute("data-activity")); break;
    case "back-to-map": STATE.view = "course-map"; STATE.errorMsg = null; render(); break;
    case "poll-choose": {
      const id = STATE.currentActivity;
      STATE.draft[id] = STATE.draft[id] || {};
      STATE.draft[id].choice = parseInt(el.getAttribute("data-idx"), 10);
      render();
      break;
    }
    case "scenario-choose": {
      const id = STATE.currentActivity;
      STATE.draft[id] = STATE.draft[id] || {};
      STATE.draft[id]["s" + el.getAttribute("data-si")] = parseInt(el.getAttribute("data-oi"), 10);
      render();
      break;
    }
    case "order-up": moveOrder(-1, parseInt(el.getAttribute("data-pos"), 10)); break;
    case "order-down": moveOrder(1, parseInt(el.getAttribute("data-pos"), 10)); break;
    case "bucket-select": {
      const id = STATE.currentActivity;
      const d = STATE.draft[id];
      const item = parseInt(el.getAttribute("data-item"), 10);
      d.selected = d.selected === item ? null : item;
      render();
      break;
    }
    case "bucket-assign": {
      const id = STATE.currentActivity;
      const d = STATE.draft[id];
      if (d.selected !== null && d.selected !== undefined) {
        d.assign[d.selected] = parseInt(el.getAttribute("data-cat"), 10);
        d.selected = null;
      }
      render();
      break;
    }
    case "submit-activity": doSubmitActivity(); break;
    case "submit-password": doSubmitPassword(); break;
    case "dash-tab": STATE.dash.cls = el.getAttribute("data-cls"); render(); loadDashboard(); break;
    case "dash-refresh": loadDashboard(); break;
    case "dash-reset": confirmReset(); break;
    default: break;
  }
}

function moveOrder(dir, pos) {
  const id = STATE.currentActivity;
  const d = STATE.draft[id];
  const newPos = pos + dir;
  if (newPos < 0 || newPos >= d.order.length) return;
  const tmp = d.order[pos];
  d.order[pos] = d.order[newPos];
  d.order[newPos] = tmp;
  render();
}

function doSubmitName() {
  const input = document.getElementById("nameInput");
  const val = (input && input.value || "").trim();
  if (!val) {
    showModal({ title: "Name required", body: "Please enter your name before continuing.", okText: "OK" });
    return;
  }
  STATE.student.name = val;
  STATE.view = "student-class";
  render();
}

async function openActivity(id) {
  const a = ACTIVITIES[id];
  STATE.currentActivity = id;
  STATE.errorMsg = null;
  STATE.techErrorMsg = null;
  if (a.group && !STATE.student.groups[id]) {
    const groupCount = Math.ceil(CLASS_SIZE[STATE.student.cls] / 4);
    const options = Array.from({ length: groupCount }, (_, i) => i + 1);
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <div class="modal-card">
        <h3>Pick your group</h3>
        <div class="mbody">This is a GROUP activity for Class ${STATE.student.cls}.</div>
        <select id="groupSelect" style="margin-top:12px;">
          ${options.map((n) => `<option value="${n}">Group ${n}</option>`).join("")}
        </select>
        <div class="modal-actions"><button class="btn" id="groupOkBtn">Continue</button></div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector("#groupOkBtn").onclick = () => {
      const sel = overlay.querySelector("#groupSelect");
      STATE.student.groups[id] = parseInt(sel.value, 10);
      overlay.remove();
      STATE.view = "activity";
      render();
    };
    return;
  }
  STATE.view = "activity";
  render();
}

async function doSubmitActivity() {
  const id = STATE.currentActivity;
  const a = ACTIVITIES[id];
  const draft = STATE.draft[id] || {};

  // validation
  let valid = true;
  if (a.type === "poll" && draft.choice === undefined) valid = false;
  if (a.type === "scenario") { for (let i = 0; i < a.stems.length; i++) { if (draft["s" + i] === undefined) valid = false; } }
  if (a.type === "matching") { if (!draft.picks || draft.picks.some((p) => p === null || p === undefined)) valid = false; }
  if (a.type === "bucket") { if (!draft.assign || Object.keys(draft.assign).length < a.items.length) valid = false; }
  if (a.type === "spectrum") { if (!draft.justify || !draft.justify.trim()) valid = false; }

  if (!valid) {
    showModal({ title: "Not quite finished", body: "Please complete every part of this activity before submitting.", okText: "OK" });
    return;
  }

  STATE.loading = true;
  STATE.errorMsg = null;
  render();

  const payload = buildPayload(a, draft);
  const groupNum = a.group ? STATE.student.groups[id] : undefined;
  const key = keyFor(id, groupNum);

  try {
    await kvSet(key, JSON.stringify(payload));
    STATE.loading = false;
    STATE.completed[id] = true;
    showSubmittedModal(id);
  } catch (e) {
    STATE.loading = false;
    STATE.errorMsg = "\u26a0\ufe0f Couldn't save \u2014 Try Again";
    STATE.techErrorMsg = String((e && e.message) || e);
    render();
  }
}

function buildPayload(a, draft) {
  const base = { studentName: STATE.student.name, cls: STATE.student.cls, ts: Date.now() };
  if (a.group) base.groupNum = STATE.student.groups[STATE.currentActivity];
  if (a.type === "poll") return { ...base, choice: draft.choice };
  if (a.type === "scenario") {
    const out = { ...base };
    a.stems.forEach((_, i) => { out["s" + i] = draft["s" + i]; });
    return out;
  }
  if (a.type === "matching") return { ...base, picks: draft.picks.slice() };
  if (a.type === "ordering") return { ...base, order: draft.order.slice() };
  if (a.type === "bucket") return { ...base, assign: { ...draft.assign } };
  if (a.type === "spectrum") return { ...base, value: draft.value, justify: draft.justify };
  return base;
}

function showSubmittedModal(id) {
  const blk = ACTIVITIES[id].block;
  const list = ACT_ORDER_BY_BLOCK[blk];
  const idx = list.indexOf(id);
  const next = list[idx + 1] || nextBlockFirst(blk);
  showModal({
    title: "Submitted!",
    body: next ? "Nice work. Ready for the next activity?" : "Nice work \u2014 that's the last activity in this block.",
    okText: next ? "Next Activity" : "Back to Course Map",
    cancelText: "Back to Course Map",
    onOk: () => { if (next) { openActivity(next); } else { STATE.view = "course-map"; render(); } },
    onCancel: () => { STATE.view = "course-map"; render(); },
  });
}
function nextBlockFirst(blk) {
  const i = BLOCK_ORDER.indexOf(blk);
  const nb = BLOCK_ORDER[i + 1];
  return nb ? ACT_ORDER_BY_BLOCK[nb][0] : null;
}

async function loadCompletionState() {
  // one kvList call per activity type prefix would still be N calls; instead list the whole student prefix once.
  const prefix = `${WEEK_NS}:resp:${STATE.student.cls}:${studentSlug()}:`;
  const keys = await kvList(prefix);
  const set = new Set(keys.map((k) => k.split(":").pop()));
  Object.keys(ACTIVITIES).forEach((id) => {
    if (!ACTIVITIES[id].group && set.has(id)) STATE.completed[id] = true;
  });
  // group activities: check via student's own recorded group number this session only (can't know group without asking)
  render();
}

function doSubmitPassword() {
  const input = document.getElementById("pwInput");
  const val = (input && input.value) || "";
  if (val === "ELT100") {
    STATE.instructorAuthed = true;
    STATE.view = "instructor-dash";
    STATE.errorMsg = null;
    render();
    loadDashboard();
  } else {
    STATE.errorMsg = "Incorrect password. Try again.";
    render();
  }
}

/* ---------- Instructor dashboard data loading ---------- */
async function loadDashboard() {
  STATE.dash.loadingDash = true;
  STATE.errorMsg = null;
  render();
  const cls = STATE.dash.cls;
  try {
    const result = {};
    for (const id of Object.keys(ACTIVITIES)) {
      const a = ACTIVITIES[id];
      const prefix = a.group ? `${WEEK_NS}:groupresp:${cls}:` : `${WEEK_NS}:resp:${cls}:`;
      const keys = await kvList(prefix);
      const relevant = keys.filter((k) => k.endsWith(":" + id));
      const values = await mapLimited(relevant, 5, async (k) => {
        const v = await kvGet(k);
        if (v === null) return null;
        try { return JSON.parse(v); } catch (e) { return null; }
      });
      result[id] = values.filter((v) => v !== null);
    }
    STATE.dash.data[cls] = result;
    STATE.dash.loadingDash = false;
    render();
  } catch (e) {
    STATE.dash.loadingDash = false;
    STATE.errorMsg = "Couldn't load dashboard data.";
    STATE.techErrorMsg = String((e && e.message) || e);
    render();
  }
}

async function mapLimited(items, limit, fn) {
  const results = new Array(items.length);
  let idx = 0;
  async function worker() {
    while (idx < items.length) {
      const my = idx++;
      results[my] = await fn(items[my], my);
    }
  }
  const workers = Array.from({ length: Math.min(limit, items.length) }, worker);
  await Promise.all(workers);
  return results;
}

/* ---------- Reset All ---------- */
function confirmReset() {
  showModal({
    title: "Reset ALL data?",
    body: "This clears every response for both A Class and B Class, and returns all active student sessions to the landing screen. This cannot be undone.",
    okText: "Reset Everything",
    cancelText: "Cancel",
    onOk: doResetAll,
  });
}

async function doResetAll() {
  STATE.dash.resetInProgress = true;
  STATE.errorMsg = null;
  STATE.dash.resetProgress = "Starting reset\u2026";
  render();
  try {
    const allKeys = [];
    for (const cls of ["A", "B"]) {
      const respKeys = await kvListOrThrow(`${WEEK_NS}:resp:${cls}:`);
      const groupKeys = await kvListOrThrow(`${WEEK_NS}:groupresp:${cls}:`);
      allKeys.push(...respKeys, ...groupKeys);
    }
    let done = 0;
    const total = allKeys.length;
    STATE.dash.resetProgress = `Resetting\u2026 0/${total}`;
    render();
    await mapLimited(allKeys, 6, async (k) => {
      await kvDelete(k); // kvDelete already retries internally; let a genuine final failure propagate
      done++;
      if (done % 5 === 0 || done === total) {
        STATE.dash.resetProgress = `Resetting\u2026 ${done}/${total}`;
        render();
      }
    });
    // Verify -- must be able to tell "confirmed empty" from "couldn't confirm" (see kvListOrThrow above)
    let remaining = [];
    for (const cls of ["A", "B"]) {
      const r1 = await kvListOrThrow(`${WEEK_NS}:resp:${cls}:`);
      const r2 = await kvListOrThrow(`${WEEK_NS}:groupresp:${cls}:`);
      remaining = remaining.concat(r1, r2);
    }
    if (remaining.length > 0) {
      STATE.dash.resetInProgress = false;
      STATE.dash.resetProgress = null;
      STATE.errorMsg = `Reset incomplete \u2014 ${remaining.length} key(s) still remain. Try again.`;
      render();
      return;
    }
    STATE.dash.resetInProgress = false;
    STATE.dash.resetProgress = null;
    STATE.dash.data = {};
    showModal({
      title: "Reset complete",
      body: "All response data has been cleared for both classes.",
      okText: "OK",
      onOk: () => { loadDashboard(); },
    });
    // Reset local student session state too (in case this browser was also mid-session as a student)
    STATE.student = { name: "", cls: null, groups: {} };
    STATE.completed = {};
  } catch (e) {
    STATE.dash.resetInProgress = false;
    STATE.dash.resetProgress = null;
    STATE.errorMsg = "Reset failed \u2014 staying on dashboard. You can try again.";
    STATE.techErrorMsg = String((e && e.message) || e);
    render();
  }
}

/* ---------- utils ---------- */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

render();
</script>
