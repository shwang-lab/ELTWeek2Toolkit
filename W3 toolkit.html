      prompt: "Pick one language feature from Harmer's chapter \u2014 register, genre, or cohesion. Would you teach it with a PPP-style procedure, or a Text-Based scaffolding procedure? Why?"
    }
  }
];

const BLOCK_LABELS = { A: "Concept Block A \u00b7 R&R Ch.2", B: "Concept Block B \u00b7 Harmer Ch.2", SYN: "Synthesis" };

function activityById(id) { return ACTIVITIES.find(a => a.id === id); }
function activitiesInBlock(block) { return ACTIVITIES.filter(a => a.block === block); }

/* =========================================================================
   STATE  (in-memory only \u2014 resets on page reload, matches "session-local"
   student progress behavior described in the course architecture notes)
   ========================================================================= */
let state = {
  mode: "student",              // "student" | "instructor"
  instructorAuthed: false,
  screen: "landing",            // landing | name | classPick | courseMap | activity | dashboard
  studentName: "",
  studentClass: null,           // "A" | "B"
  groupNumbers: {},             // activityId -> group number (in-memory)
  currentActivityId: null,
  dashboardClass: "A",
  completedCache: {},           // activityId -> bool (derived from storage, cached per session)
};

/* =========================================================================
   STORAGE HELPERS (robustness rules)
   ========================================================================= */
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function sanitizeKey(str) {
  return String(str).toLowerCase().trim()
    .replace(/[^a-z0-9]+/g, "_")
    .replace(/^_+|_+$/g, "")
    .slice(0, 60) || "anon";
}

// This app no longer uses Claude's window.storage. Instead every raw call
// goes through fetch() to our own Apps Script backend (a KV store over a
// Google Sheet), which runs outside the artifact sandbox and is not subject
// to Anthropic's storage rate limits. storageReady() is kept only so the
// rest of the retry/throttle logic below (unchanged) has something to check.
function storageReady() {
  return typeof APPS_SCRIPT_URL === "string" && APPS_SCRIPT_URL.length > 0;
}

async function kvSet(key, value) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids CORS preflight
    body: JSON.stringify({ action: "set", key, value }),
  });
  const data = await res.json();
  if (data.status !== "ok") throw new Error(data.message || "set failed");
  return data;
}
async function kvGet(key) {
  const res = await fetch(APPS_SCRIPT_URL + "?action=get&key=" + encodeURIComponent(key));
  const data = await res.json();
  if (data.status !== "ok") throw new Error(data.message || "get failed");
  return data.value; // string or null
}
async function kvList(prefix) {
  const res = await fetch(APPS_SCRIPT_URL + "?action=list&prefix=" + encodeURIComponent(prefix));
  const data = await res.json();
  if (data.status !== "ok") throw new Error(data.message || "list failed");
  return data.keys;
}
async function kvDelete(key) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "delete", key }),
  });
  const data = await res.json();
  if (data.status !== "ok") throw new Error(data.message || "delete failed");
  return data;
}

function isRateLimitError(err) {
  const msg = (err && err.message) ? err.message.toLowerCase() : String(err).toLowerCase();
  return msg.includes("rate limit");
}

// ---------------------------------------------------------------------
// GLOBAL ADAPTIVE THROTTLE
// We don't know the host's exact rate limit, and hand-tuned fixed
// concurrency/delay numbers are just guesses that can still be wrong for a
// large real class (many stored responses). Instead, every raw storage call
// in the app passes through one shared gate that self-tunes: it slows down
// sharply the moment it sees a rate-limit error, and gradually speeds back
// up after a run of successes. This lets the app find a sustainable request
// rate on its own rather than assuming a specific number.
// ---------------------------------------------------------------------
const throttle = { gapMs: 40, minGapMs: 40, maxGapMs: 2500, lastCallAt: 0, lastRateLimitAt: 0 };

async function throttleGate() {
  const wait = throttle.gapMs - (Date.now() - throttle.lastCallAt);
  if (wait > 0) await sleep(wait);
  throttle.lastCallAt = Date.now();
}
function throttleReportSuccess() {
  throttle.gapMs = Math.max(throttle.minGapMs, throttle.gapMs * 0.7);
}
function throttleReportRateLimit() {
  // several concurrent callers can each hit the SAME rate-limit burst and
  // report it almost simultaneously; without debouncing, their backoff
  // multipliers compound (e.g. 4 workers x 2.5x each = ~40x overshoot from
  // one real incident), which then takes far too long to recover from.
  // Treat reports within a short window as one incident.
  const now = Date.now();
  if (now - throttle.lastRateLimitAt < 600) return;
  throttle.lastRateLimitAt = now;
  throttle.gapMs = Math.min(throttle.maxGapMs, Math.max(400, throttle.gapMs * 1.8));
}

// Every low-level call to window.storage.* should go through one of these
// wrappers so they all share the same adaptive gate and error classification.
async function rawGet(key, shared) {
  await throttleGate();
  try {
    const value = await kvGet(key);
    throttleReportSuccess();
    return value === null ? null : { value: value };
  } catch (e) {
    if (isRateLimitError(e)) throttleReportRateLimit();
    throw e;
  }
}
async function rawSet(key, value, shared) {
  await throttleGate();
  try {
    await kvSet(key, value);
    throttleReportSuccess();
    return true;
  } catch (e) {
    if (isRateLimitError(e)) throttleReportRateLimit();
    throw e;
  }
}
async function rawDelete(key, shared) {
  await throttleGate();
  try {
    await kvDelete(key);
    throttleReportSuccess();
    return true;
  } catch (e) {
    if (isRateLimitError(e)) throttleReportRateLimit();
    throw e;
  }
}
async function rawList(prefix, shared) {
  await throttleGate();
  try {
    const keys = await kvList(prefix);
    throttleReportSuccess();
    return { keys: keys };
  } catch (e) {
    if (isRateLimitError(e)) throttleReportRateLimit();
    throw e;
  }
}

// Some hosting environments inject window.storage asynchronously shortly
// after the page loads, rather than having it present at parse time. A
// student who interacts very quickly (first activity, first few seconds)
// could otherwise hit a real race: window.storage simply isn't defined
// *yet*. Treat "not ready" as just another retryable condition instead of
// failing immediately with zero retries.
async function storageSetRetry(key, value, shared) {
  let lastErr = null;
  for (let i = 0; i < 8; i++) {
    if (!storageReady()) {
      lastErr = new Error("Storage API not yet available (window.storage is undefined)");
      await sleep(300 * (i + 1));
      continue;
    }
    try {
      const r = await rawSet(key, value, shared);
      if (r) return { ok: true };
      lastErr = new Error("storage.set returned a falsy result");
    } catch (e) { lastErr = e; }
    const backoff = isRateLimitError(lastErr) ? 1200 * (i + 1) : 300 * (i + 1);
    await sleep(backoff);
  }
  return { ok: false, errorMsg: lastErr ? (lastErr.message || String(lastErr)) : "Unknown error" };
}

async function storageGetSafe(key, shared) {
  for (let i = 0; i < 5; i++) {
    if (!storageReady()) { await sleep(300 * (i + 1)); continue; }
    try {
      const r = await rawGet(key, shared);
      return r ? r.value : null;
    } catch (e) {
      if (i === 4) return null;
      const backoff = isRateLimitError(e) ? 1000 * (i + 1) : 150 * (i + 1);
      await sleep(backoff);
    }
  }
  return null;
}

async function storageListSafe(prefix, shared) {
  for (let i = 0; i < 5; i++) {
    if (!storageReady()) { await sleep(300 * (i + 1)); continue; }
    try {
      const r = await rawList(prefix, shared);
      return r ? r.keys : [];
    } catch (e) {
      if (i === 4) return [];
      const backoff = isRateLimitError(e) ? 1000 * (i + 1) : 150 * (i + 1);
      await sleep(backoff);
    }
  }
  return [];
}

// delete: never trust delete()'s own throw/return as failure signal;
// verify success by re-fetching afterward. Critically, the delete() call
// itself must also be retried on transient failures (rate limits, etc.) --
// previously it was only attempted once, so a swallowed transient error
// there meant the key was never actually deleted no matter how many times
// the verification step re-checked it.
async function storageDeleteVerified(key, shared) {
  async function attemptDelete() {
    for (let i = 0; i < 4; i++) {
      if (!storageReady()) { await sleep(400 * (i + 1)); continue; }
      try {
        await rawDelete(key, shared);
        return; // call didn't throw
      } catch (e) {
        const msg = (e && e.message) ? e.message.toLowerCase() : "";
        if (msg.includes("does not exist") || msg.includes("not found")) return; // already gone, not a real failure
        const backoff = isRateLimitError(e) ? 1200 * (i + 1) : 300 * (i + 1);
        await sleep(backoff);
      }
    }
  }

  await attemptDelete();

  for (let i = 0; i < 5; i++) {
    if (!storageReady()) { await sleep(400 * (i + 1)); continue; }
    try {
      const r = await rawGet(key, shared);
      if (!r) return true; // gone -> success
    } catch (e) {
      return true; // get() throwing means the key is gone -> success
    }
    // still present after our first delete attempt -- try again before the next check
    await attemptDelete();
    await sleep(300 * (i + 1));
  }
  return false; // still present after repeated delete + verify cycles -> genuine failure
}

function respKey(cls, activityId, ownerKey) {
  return `resp_${cls}_${activityId}_${ownerKey}`;
}

/* =========================================================================
   MODAL
   ========================================================================= */
function showModal({ title, message, buttons, inputPlaceholder = null }) {
  return new Promise((resolve) => {
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    const card = document.createElement("div");
    card.className = "modal-card";
    card.innerHTML = `
      <h3>${title}</h3>
      ${message ? `<p>${message}</p>` : ""}
      ${inputPlaceholder !== null ? `<input type="password" id="modalInput" placeholder="${inputPlaceholder}" style="margin-bottom:16px;" />` : ""}
      <div class="modal-actions" id="modalActions"></div>
    `;
    overlay.appendChild(card);
    document.body.appendChild(overlay);

    const actionsEl = card.querySelector("#modalActions");
    buttons.forEach(btn => {
      const b = document.createElement("button");
      b.className = "btn " + (btn.primary ? "" : "outline");
      b.style.color = btn.primary ? "" : "#2F6F62";
      b.textContent = btn.label;
      b.onclick = () => {
        const inputEl = card.querySelector("#modalInput");
        const val = inputEl ? inputEl.value : null;
        document.body.removeChild(overlay);
        resolve({ id: btn.id, value: val });
      };
      actionsEl.appendChild(b);
    });

    const inputEl = card.querySelector("#modalInput");
    if (inputEl) {
      inputEl.focus();
      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          const primaryBtn = buttons.find(b => b.primary);
          if (primaryBtn) actionsEl.querySelectorAll("button")[buttons.indexOf(primaryBtn)].click();
        }
      });
    }
  });
}

/* =========================================================================
   RENDER ROOT
   ========================================================================= */
function render() {
  document.body.className = state.mode === "instructor" ? "dark" : "";
  const app = document.getElementById("app");
  app.innerHTML = "";

  if (state.screen !== "landing") {
    app.classList.add("with-toggle");
    app.appendChild(renderTopToggle());
  }

  let content;
  switch (state.screen) {
    case "landing": content = renderLanding(); break;
    case "name": content = renderNameEntry(); break;
    case "classPick": content = renderClassPick(); break;
    case "courseMap": content = renderCourseMap(); break;
    case "activity": content = renderActivityScreen(); break;
    case "dashboard": content = renderDashboard(); break;
    default: content = document.createElement("div");
  }
  app.appendChild(content);
}

function renderTopToggle() {
  const wrap = document.createElement("div");
  wrap.className = "top-toggle";
  const studentBtn = document.createElement("button");
  studentBtn.textContent = "Student";
  studentBtn.className = state.mode === "student" ? "active" : "";
  studentBtn.onclick = () => switchToStudent();
  const instrBtn = document.createElement("button");
  instrBtn.textContent = "Instructor";
  instrBtn.className = state.mode === "instructor" ? "active" : "";
  instrBtn.onclick = () => switchToInstructor();
  wrap.appendChild(studentBtn);
  wrap.appendChild(instrBtn);
  return wrap;
}

function switchToStudent() {
  state.mode = "student";
  if (!state.studentName) state.screen = "name";
  else if (!state.studentClass) state.screen = "classPick";
  else state.screen = state.screen === "dashboard" ? "courseMap" : state.screen;
  render();
}

async function switchToInstructor() {
  if (state.instructorAuthed) {
    state.mode = "instructor";
    state.screen = "dashboard";
    render();
    return;
  }
  const res = await showModal({
    title: "Instructor Login",
    message: "Enter the instructor password to continue.",
    inputPlaceholder: "Password",
    buttons: [{ id: "cancel", label: "Cancel", primary: false }, { id: "ok", label: "Enter", primary: true }],
  });
  if (res.id === "ok") {
    if (res.value === INSTRUCTOR_PASSWORD) {
      state.instructorAuthed = true;
      state.mode = "instructor";
      state.screen = "dashboard";
      render();
    } else {
      await showModal({
        title: "Incorrect Password",
        message: "That password wasn't right. Try again.",
        buttons: [{ id: "ok", label: "OK", primary: true }],
      });
    }
  }
}

/* =========================================================================
   STUDENT: COURSE MAP
   ========================================================================= */
function renderCourseMap() {
  const wrap = document.createElement("div");
  wrap.innerHTML = `
    <div class="kicker">Course Map</div>
    <h2 style="margin:0 0 4px;">${escapeHtml(state.studentName)} \u00b7 Class ${state.studentClass}</h2>
    <p class="muted" id="cmSub">Loading your progress\u2026</p>
    <div id="cmBlocks"></div>
  `;
  const blocksEl = wrap.querySelector("#cmBlocks");
  const order = ["A", "B", "SYN"];

  (async () => {
    const cache = {};
    // Single list() call for the whole class, instead of one get() per
    // activity (11 concurrent calls). Firing many parallel storage calls
    // back-to-back can trip the host's own message rate limit, especially
    // right before a student's first activity submission.
    const allKeys = await storageListSafe(`resp_${state.studentClass}_`, true);
    const keySet = new Set(allKeys);
    ACTIVITIES.forEach(a => {
      if (a.group) {
        const g = state.groupNumbers[a.id];
        cache[a.id] = g ? keySet.has(respKey(state.studentClass, a.id, `group${g}`)) : false;
      } else {
        const owner = sanitizeKey(state.studentName);
        cache[a.id] = keySet.has(respKey(state.studentClass, a.id, owner));
      }
    });
    state.completedCache = cache;
    wrap.querySelector("#cmSub").textContent = "Tap any activity below \u2014 you can do them in any order.";

    order.forEach(block => {
      const acts = activitiesInBlock(block);
      const doneCount = acts.filter(a => cache[a.id]).length;

      const header = document.createElement("div");
      header.className = "block-header";
      header.innerHTML = `<h3 style="margin:0;">${BLOCK_LABELS[block]}</h3><span class="progress-pill">${doneCount} / ${acts.length} done</span>`;
      blocksEl.appendChild(header);

      acts.forEach(a => {
        const row = document.createElement("div");
        row.className = "activity-row" + (cache[a.id] ? " done" : "");
        row.innerHTML = `
          <div class="num">${a.num}</div>
          <div class="body">
            <div class="title">${escapeHtml(a.title)} ${a.group ? '<span class="pill gold">GROUP</span>' : ''}</div>
            <div class="blurb">${escapeHtml(a.blurb)}</div>
          </div>
          <div>${cache[a.id] ? '<span class="check">\u2713</span>' : ''}</div>
        `;
        row.onclick = () => { state.currentActivityId = a.id; state.screen = "activity"; render(); };
        blocksEl.appendChild(row);
      });
    });
  })();

  return wrap;
}

/* ---- form builders per activity type ---- */
function buildActivityForm(bodyEl, a, submitAreaEl) {
  bodyEl.innerHTML = "";
  let getPayload = null;

  if (a.type === "poll") {
    bodyEl.innerHTML = `<p style="font-size:16px; font-weight:700; margin-bottom:12px;">${escapeHtml(a.data.question)}</p>`;
    a.data.options.forEach((opt, i) => {
      const row = document.createElement("label");
      row.className = "radio-row";
      row.innerHTML = `<input type="radio" name="pollOpt" value="${i}"/> <span>${escapeHtml(opt)}</span>`;
      bodyEl.appendChild(row);
    });
    getPayload = () => {
      const sel = bodyEl.querySelector('input[name="pollOpt"]:checked');
      if (!sel) return { error: "Please choose an option before submitting." };
      return { value: { answerIndex: parseInt(sel.value, 10), answerText: a.data.options[parseInt(sel.value, 10)] } };
    };
  }

  else if (a.type === "quiz") {
    a.data.questions.forEach((q, qi) => {
      const qWrap = document.createElement("div");
      qWrap.style.marginBottom = "18px";
      qWrap.innerHTML = `<p style="font-weight:700; margin-bottom:8px;">${qi + 1}. ${escapeHtml(q.q)}</p>`;
      q.options.forEach((opt, oi) => {
        const row = document.createElement("label");
        row.className = "radio-row";
        row.innerHTML = `<input type="radio" name="quizQ${qi}" value="${oi}"/> <span>${escapeHtml(opt)}</span>`;
        qWrap.appendChild(row);
      });
      bodyEl.appendChild(qWrap);
    });
    getPayload = () => {
      const answers = [];
      for (let qi = 0; qi < a.data.questions.length; qi++) {
        const sel = bodyEl.querySelector(`input[name="quizQ${qi}"]:checked`);
        if (!sel) return { error: `Please answer question ${qi + 1} before submitting.` };
        answers.push(parseInt(sel.value, 10));
      }
      return { value: { answers } };
    };
  }

  else if (a.type === "matching") {
    const shuffledDefs = shuffle(a.data.pairs.map(p => p.def));
    a.data.pairs.forEach((pair, i) => {
      const row = document.createElement("div");
      row.style.marginBottom = "12px";
      row.innerHTML = `
        <label class="field-label">${escapeHtml(pair.term)}</label>
        <select data-term-idx="${i}">
          <option value="">\u2014 choose a definition \u2014</option>
          ${shuffledDefs.map(d => `<option value="${escapeAttr(d)}">${escapeHtml(d)}</option>`).join("")}
        </select>
      `;
      bodyEl.appendChild(row);
    });
    getPayload = () => {
      const answers = {};
      const selects = bodyEl.querySelectorAll("select[data-term-idx]");
      for (const sel of selects) {
        if (!sel.value) return { error: "Please match every term to a definition before submitting." };
        const idx = parseInt(sel.getAttribute("data-term-idx"), 10);
        answers[a.data.pairs[idx].term] = sel.value;
      }
      return { value: { answers } };
    };
  }

  else if (a.type === "ordering") {
    const localSeqs = a.data.sequences.map(s => ({ name: s.name, items: [...s.items] }));
    localSeqs.forEach((seq, si) => {
      const seqWrap = document.createElement("div");
      seqWrap.style.marginBottom = "20px";
      seqWrap.innerHTML = `<label class="field-label">${escapeHtml(seq.name)}</label><div class="order-list" data-seq="${si}"></div>`;
      bodyEl.appendChild(seqWrap);
      renderOrderList(seqWrap.querySelector(".order-list"), seq);
    });
    getPayload = () => {
      const sequences = localSeqs.map(s => ({ name: s.name, order: s.items }));
      return { value: { sequences } };
    };
  }

  else if (a.type === "spectrum_group") {
    a.data.methods.forEach((m, i) => {
      const row = document.createElement("div");
      row.className = "slider-row";
      row.innerHTML = `
        <label class="field-label">${escapeHtml(m)}</label>
        <input type="range" min="0" max="100" value="50" data-method-idx="${i}" class="spectrum-slider"/>
        <div class="slider-labels"><span>${escapeHtml(a.data.leftLabel)}</span><span>${escapeHtml(a.data.rightLabel)}</span></div>
        <textarea placeholder="One sentence justifying this placement..." data-method-just="${i}" style="margin-top:8px;"></textarea>
      `;
      bodyEl.appendChild(row);
    });
    getPayload = () => {
      const values = {};
      a.data.methods.forEach((m, i) => {
        const pos = bodyEl.querySelector(`input[data-method-idx="${i}"]`).value;
        const just = bodyEl.querySelector(`textarea[data-method-just="${i}"]`).value.trim();
        if (!just) return null;
        values[m] = { position: parseInt(pos, 10), justification: just };
      });
      const missing = a.data.methods.some(m => !values[m]);
      if (missing) return { error: "Please add a justification sentence for every method." };
      return { value: { placements: values } };
    };
  }

  else if (a.type === "group_text") {
    bodyEl.innerHTML = `<div class="card" style="background:#F3F1EC;"><em>${escapeHtml(a.data.snippet)}</em></div>`;
    a.data.fields.forEach((f, i) => {
      const row = document.createElement("div");
      row.innerHTML = `<label class="field-label">${escapeHtml(f)}</label><textarea data-field-idx="${i}"></textarea>`;
      bodyEl.appendChild(row);
    });
    getPayload = () => {
      const answers = {};
      let ok = true;
      a.data.fields.forEach((f, i) => {
        const val = bodyEl.querySelector(`textarea[data-field-idx="${i}"]`).value.trim();
        if (!val) ok = false;
        answers[f] = val;
      });
      if (!ok) return { error: "Please fill in every field as a group before submitting." };
      return { value: { answers } };
    };
  }

  else if (a.type === "freetext") {
    bodyEl.innerHTML = `
      <p style="font-size:15px; margin-bottom:10px;">${escapeHtml(a.data.prompt)}</p>
      <textarea id="freeTextArea" placeholder="Type your answer here..." style="min-height:140px;"></textarea>
    `;
    getPayload = () => {
      const val = bodyEl.querySelector("#freeTextArea").value.trim();
      if (!val) return { error: "Please write a short answer before submitting." };
      return { value: { text: val } };
    };
  }

  renderSubmitArea(submitAreaEl, a, () => getPayload());
}

function renderOrderList(container, seq) {
  container.innerHTML = "";
  seq.items.forEach((item, idx) => {
    const row = document.createElement("div");
    row.className = "order-item";
    row.innerHTML = `
      <span class="rank">${idx + 1}</span>
      <span>${escapeHtml(item)}</span>
      <span class="arrows">
        <button data-dir="up" ${idx === 0 ? "disabled" : ""}>\u25B2</button>
        <button data-dir="down" ${idx === seq.items.length - 1 ? "disabled" : ""}>\u25BC</button>
      </span>
    `;
    row.querySelector('[data-dir="up"]').onclick = () => {
      if (idx > 0) { [seq.items[idx - 1], seq.items[idx]] = [seq.items[idx], seq.items[idx - 1]]; renderOrderList(container, seq); }
    };
    row.querySelector('[data-dir="down"]').onclick = () => {
      if (idx < seq.items.length - 1) { [seq.items[idx + 1], seq.items[idx]] = [seq.items[idx], seq.items[idx + 1]]; renderOrderList(container, seq); }
    };
    container.appendChild(row);
  });
}

function renderSubmitArea(submitAreaEl, a, getPayloadFn) {
  submitAreaEl.innerHTML = `<button class="btn block" id="submitBtn">Submit</button><div id="submitErr"></div>`;
  const btn = submitAreaEl.querySelector("#submitBtn");
  const errEl = submitAreaEl.querySelector("#submitErr");

  btn.onclick = async () => {
    errEl.innerHTML = "";
    const result = getPayloadFn();
    if (!result || result.error) {
      errEl.innerHTML = `<div class="save-error">${escapeHtml((result && result.error) || "Please complete the activity before submitting.")}</div>`;
      return;
    }
    // loading state BEFORE await
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span> Submitting...`;

    const owner = a.group ? `group${state.groupNumbers[a.id]}` : sanitizeKey(state.studentName);
    const payload = {
      ...(a.group ? { groupNumber: state.groupNumbers[a.id] } : { studentName: state.studentName }),
      cls: state.studentClass,
      ts: Date.now(),
      ...result.value,
    };
    const setResult = await storageSetRetry(respKey(state.studentClass, a.id, owner), JSON.stringify(payload), true);

    if (!setResult.ok) {
      btn.disabled = false;
      btn.textContent = "Submit";
      const isRateLimit = (setResult.errorMsg || "").toLowerCase().includes("rate limit");
      const headline = isRateLimit
        ? "\u26A0\uFE0F Too many requests right now \u2014 please wait a moment and try again"
        : "\u26A0\uFE0F Couldn't save";
      errEl.innerHTML = `<div class="save-error">${headline} \u2014 <button class="btn danger" id="retryBtn" style="padding:6px 14px; font-size:13px;">Try Again</button>
        <div style="margin-top:8px; font-size:11px; opacity:0.75; word-break:break-word;">Technical detail: ${escapeHtml(setResult.errorMsg || "unknown")}</div></div>`;
      errEl.querySelector("#retryBtn").onclick = () => btn.onclick();
      return;
    }

    state.completedCache[a.id] = true;
    renderSubmittedScreen(a);
  };
}

function renderSubmittedScreen(a) {
  const app = document.getElementById("app");
  const nextAct = ACTIVITIES[ACTIVITIES.indexOf(a) + 1];
  const wrap = document.createElement("div");
  wrap.style.maxWidth = "480px";
  wrap.style.margin = "64px auto 0";
  wrap.style.textAlign = "center";
  wrap.innerHTML = `
    <div style="font-size:52px;">\u2705</div>
    <h2 style="margin:10px 0 4px;">Submitted!</h2>
    <p class="muted">Your answer has been saved.</p>
    <div style="display:flex; flex-direction:column; gap:10px; margin-top:22px;">
      <button class="btn outline block" id="backToMap">Back to Course Map</button>
      ${nextAct ? `<button class="btn block" id="nextAct">Next: ${escapeHtml(nextAct.title)} \u2192</button>` : ""}
    </div>
  `;
  wrap.querySelector("#backToMap").onclick = () => { state.screen = "courseMap"; render(); };
  if (nextAct) {
    wrap.querySelector("#nextAct").onclick = () => { state.currentActivityId = nextAct.id; state.screen = "activity"; render(); };
  }
  const appEl = document.getElementById("app");
  appEl.innerHTML = "";
  appEl.classList.add("with-toggle");
  appEl.appendChild(renderTopToggle());
  appEl.appendChild(wrap);
}

/* =========================================================================
   INSTRUCTOR DASHBOARD
   ========================================================================= */
function renderDashboard() {
  const wrap = document.createElement("div");
  wrap.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:16px;">
      <div>
        <div class="kicker">Instructor Dashboard</div>
        <h2 style="margin:0;">Week 3 \u00b7 Live Results</h2>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn outline" id="refreshBtn">\uD83D\uDD04 Refresh All</button>
        <button class="btn danger" id="resetBtn">\uD83D\uDDD1\uFE0F Reset All</button>
      </div>
    </div>
    <div class="dash-tabs">
      <button id="tabA" class="${state.dashboardClass === "A" ? "active" : ""}">A Class</button>
      <button id="tabB" class="${state.dashboardClass === "B" ? "active" : ""}">B Class</button>
    </div>
    <div id="dashBody"><p class="muted">Loading\u2026</p></div>
  `;

  wrap.querySelector("#tabA").onclick = () => { state.dashboardClass = "A"; render(); };
  wrap.querySelector("#tabB").onclick = () => { state.dashboardClass = "B"; render(); };

  wrap.querySelector("#refreshBtn").onclick = async (e) => {
    const btn = e.currentTarget;
    btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Refreshing...`;
    await loadDashboardBody(wrap.querySelector("#dashBody"));
    btn.disabled = false; btn.innerHTML = "\uD83D\uDD04 Refresh All";
  };

  wrap.querySelector("#resetBtn").onclick = async () => {
    const confirmRes = await showModal({
      title: "Reset All Data?",
      message: "This permanently deletes every response from BOTH classes for every activity, and clears your local student view. This can't be undone.",
      buttons: [{ id: "cancel", label: "Cancel", primary: false }, { id: "confirm", label: "Yes, Reset Everything", primary: true }],
    });
    if (confirmRes.id !== "confirm") return;

    const btn = wrap.querySelector("#resetBtn");
    btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Resetting...`;

    // gather all response keys across both classes (single prefix covers all)
    const keys = await storageListSafe("resp_", true);
    let doneCount = 0;
    const results = await mapLimited(keys, 3, async (k) => {
      const r = await storageDeleteVerified(k, true);
      doneCount++;
      btn.innerHTML = `<span class="spinner"></span> Resetting... ${doneCount}/${keys.length}`;
      return r;
    });
    const failCount = results.filter(r => !r).length;

    // clear local student-side session state, and send everyone back to the
    // very first landing screen (student vs. instructor choice) rather than
    // skipping ahead to name-entry or a stale class selection.
    state.studentName = "";
    state.studentClass = null;
    state.groupNumbers = {};
    state.completedCache = {};
    state.screen = "landing";
    state.mode = "student";

    btn.disabled = false; btn.innerHTML = "\uD83D\uDDD1\uFE0F Reset All";

    await showModal({
      title: failCount === 0 ? "Reset Complete" : "Reset Finished (with warnings)",
      message: failCount === 0
        ? "All response data has been cleared for both classes."
        : `${failCount} item(s) could not be confirmed deleted. You may want to try Reset All again.`,
      buttons: [{ id: "ok", label: "OK", primary: true }],
    });
    render();
  };

  loadDashboardBody(wrap.querySelector("#dashBody"));
  return wrap;
}

async function mapLimited(items, limit, fn, staggerMs) {
  const results = new Array(items.length);
  let idx = 0;
  async function worker() {
    while (idx < items.length) {
      const cur = idx++;
      if (staggerMs && cur > 0) await sleep(staggerMs);
      results[cur] = await fn(items[cur], cur);
    }
  }
  const workerCount = Math.max(1, Math.min(limit, items.length));
  await Promise.all(Array.from({ length: workerCount }, () => worker()));
  return results;
}

async function loadDashboardBody(container) {
  container.innerHTML = `<p class="muted">Loading\u2026</p>`;
  const cls = state.dashboardClass;

  // Single list() call for the entire class, then a concurrency-limited
  // batch of get() calls for just the keys that exist \u2014 instead of firing
  // 11 list() calls plus dozens of unthrottled get() calls all at once,
  // which risks tripping the host's own message rate limit as class data grows.
  const allKeys = await storageListSafe(`resp_${cls}_`, true);
  const keysByActivity = {};
  ACTIVITIES.forEach(a => { keysByActivity[a.id] = []; });
  allKeys.forEach(k => {
    const withoutClsPrefix = k.slice(`resp_${cls}_`.length);
    const matchedActivity = ACTIVITIES.find(a => withoutClsPrefix.startsWith(a.id + "_"));
    if (matchedActivity) keysByActivity[matchedActivity.id].push(k);
  });

  const allValues = await mapLimited(allKeys, 4, (k) => storageGetSafe(k, true));
  const valueByKey = {};
  allKeys.forEach((k, i) => { valueByKey[k] = allValues[i]; });

  const perActivity = ACTIVITIES.map((a) => {
    const values = (keysByActivity[a.id] || []).map(k => valueByKey[k]);
    const parsed = values.filter(Boolean).map(v => { try { return JSON.parse(v); } catch (e) { return null; } }).filter(Boolean);
    return { activity: a, responses: parsed };
  });

  container.innerHTML = "";
  ["A", "B", "SYN"].forEach(block => {
    const items = perActivity.filter(x => x.activity.block === block);
    if (!items.length) return;
    const h = document.createElement("h3");
    h.style.margin = "22px 0 10px";
    h.textContent = BLOCK_LABELS[block];
    container.appendChild(h);

    items.forEach(({ activity, responses }) => {
      const denom = activity.group ? GROUP_COUNT[cls] : CLASS_SIZE[cls];
      const card = document.createElement("div");
      card.className = "result-card";
      card.innerHTML = `<h4>${escapeHtml(activity.title)} ${activity.group ? '<span class="pill gold">GROUP</span>' : ''}</h4>
        <div class="muted" style="margin-bottom:8px;">${responses.length} / ${denom} ${activity.group ? "groups" : "students"} responded</div>
        <div id="detail_${activity.id}"></div>`;
      container.appendChild(card);
      renderActivityDetail(card.querySelector(`#detail_${activity.id}`), activity, responses);
    });
  });

  if (!container.children.length) container.innerHTML = `<p class="muted">No activities yet.</p>`;
}

function renderActivityDetail(el, activity, responses) {
  if (!responses.length) { el.innerHTML = `<div class="muted">No responses yet.</div>`; return; }

  if (activity.type === "poll") {
    const counts = new Array(activity.data.options.length).fill(0);
    responses.forEach(r => { if (typeof r.answerIndex === "number") counts[r.answerIndex]++; });
    const total = responses.length;
    el.innerHTML = activity.data.options.map((opt, i) => {
      const pct = total ? Math.round((counts[i] / total) * 100) : 0;
      return `<div class="opt-bar-wrap">
        <div class="opt-bar-label">${escapeHtml(opt)} \u2014 ${counts[i]} (${pct}%)</div>
        <div class="opt-bar-bg"><div class="opt-bar-fill" style="width:${pct}%;"></div></div>
      </div>`;
    }).join("");
  }

  else if (activity.type === "quiz") {
    el.innerHTML = activity.data.questions.map((q, qi) => {
      const dist = new Array(q.options.length).fill(0);
      responses.forEach(r => { const a = (r.answers || [])[qi]; if (typeof a === "number") dist[a]++; });
      const total = responses.length;
      const hasCorrect = typeof q.correct === "number";
      const correctCount = hasCorrect ? dist[q.correct] : 0;
      const correctPct = hasCorrect && total ? Math.round((correctCount / total) * 100) : null;
      return `<div style="margin-bottom:14px;">
        <div style="font-weight:700; font-size:13px; margin-bottom:2px;">Q${qi + 1}. ${escapeHtml(q.q)}</div>
        ${hasCorrect ? `<div style="font-size:12px; color:#E8C468; margin-bottom:6px;">\u2713 Correct answer: <strong>${escapeHtml(q.options[q.correct])}</strong>${correctPct !== null ? ` \u2014 ${correctCount}/${total} students got this right (${correctPct}%)` : ""}</div>` : ""}
        ${q.options.map((opt, oi) => {
          const pct = total ? Math.round((dist[oi] / total) * 100) : 0;
          const isCorrect = hasCorrect && oi === q.correct;
          return `<div class="opt-bar-wrap"><div class="opt-bar-label">${isCorrect ? "\u2713 " : ""}${escapeHtml(opt)} \u2014 ${dist[oi]} (${pct}%)</div>
            <div class="opt-bar-bg"><div class="opt-bar-fill" style="width:${pct}%; ${isCorrect ? "background:#7BC67E;" : ""}"></div></div></div>`;
        }).join("")}
      </div>`;
    }).join("");
  }

  else if (activity.type === "matching") {
    el.innerHTML = responses.map(r => {
      const who = r.studentName || `Group ${r.groupNumber}`;
      const lines = Object.entries(r.answers || {}).map(([term, def]) => `${escapeHtml(term)} \u2192 ${escapeHtml(def)}`).join("<br/>");
      return `<div class="result-line"><strong>${escapeHtml(who)}</strong><br/>${lines}</div>`;
    }).join("");
  }

  else if (activity.type === "ordering") {
    el.innerHTML = responses.map(r => {
      const who = r.studentName || `Group ${r.groupNumber}`;
      const seqLines = (r.sequences || []).map(s => `<em>${escapeHtml(s.name)}:</em> ${s.order.map(escapeHtml).join(" \u2192 ")}`).join("<br/>");
      return `<div class="result-line"><strong>${escapeHtml(who)}</strong><br/>${seqLines}</div>`;
    }).join("");
  }

  else if (activity.type === "spectrum_group") {
    el.innerHTML = responses.map(r => {
      const who = `Group ${r.groupNumber}`;
      const lines = Object.entries(r.placements || {}).map(([m, v]) =>
        `${escapeHtml(m)}: <strong>${v.position}</strong>/100 \u2014 <em>${escapeHtml(v.justification)}</em>`
      ).join("<br/>");
      return `<div class="result-line"><strong>${escapeHtml(who)}</strong><br/>${lines}</div>`;
    }).join("");
  }

  else if (activity.type === "group_text") {
    el.innerHTML = responses.map(r => {
      const who = `Group ${r.groupNumber}`;
      const lines = Object.entries(r.answers || {}).map(([f, v]) => `<em>${escapeHtml(f)}:</em> ${escapeHtml(v)}`).join("<br/>");
      return `<div class="result-line"><strong>${escapeHtml(who)}</strong><br/>${lines}</div>`;
    }).join("");
  }

  else if (activity.type === "freetext") {
    el.innerHTML = responses.map(r => `<div class="result-line"><strong>${escapeHtml(r.studentName || "\u2014")}</strong><br/>${escapeHtml(r.text)}</div>`).join("");
  }
}

/* =========================================================================
   UTILITIES
   ========================================================================= */
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function escapeAttr(str) { return escapeHtml(str); }
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* =========================================================================
   INIT
   ========================================================================= */
render();
</script>
