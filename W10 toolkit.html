var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzJc_RFDdhCU4_VB41uMefmy6cKgjg4DVwqVk1xBDa5MDAA0aMq53VinzQf1iZKyy4i/exec";

async function kvGetRaw(key) {
  var res = await fetch(APPS_SCRIPT_URL + "?action=get&key=" + encodeURIComponent(key));
  var data = await res.json();
  if (data.status !== "ok") throw new Error(data.message || "get failed");
  return data.value;
}
async function kvSetRaw(key, value) {
  var res = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "set", key: key, value: value })
  });
  var data = await res.json();
  if (data.status !== "ok") throw new Error(data.message || "set failed");
  return true;
}
async function kvListRaw(prefix) {
  var res = await fetch(APPS_SCRIPT_URL + "?action=list&prefix=" + encodeURIComponent(prefix));
  var data = await res.json();
  if (data.status !== "ok") throw new Error(data.message || "list failed");
  return data.keys;
}
async function kvDeleteRaw(key) {
  var res = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "delete", key: key })
  });
  var data = await res.json();
  if (data.status !== "ok") throw new Error(data.message || "delete failed");
  return true;
}

/* ---- global adaptive throttle: shrinks on success, grows on failure ---- */
var THROTTLE = { gapMs: 120, lastDispatch: 0 };
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
async function throttleGate() {
  var now = Date.now();
  var wait = (THROTTLE.lastDispatch + THROTTLE.gapMs) - now;
  if (wait > 0) await sleep(wait);
  THROTTLE.lastDispatch = Date.now();
}
function throttleSuccess() { THROTTLE.gapMs = Math.max(60, THROTTLE.gapMs * 0.92); }
function throttleFailure() { THROTTLE.gapMs = Math.min(4000, THROTTLE.gapMs * 1.8); }

async function withRetry(fn, opts) {
  opts = opts || {};
  var attempts = opts.attempts || 4;
  var baseDelay = opts.baseDelay || 300;
  var lastErr = null;
  for (var i = 0; i < attempts; i++) {
    try {
      await throttleGate();
      var result = await fn();
      throttleSuccess();
      return result;
    } catch (e) {
      lastErr = e;
      throttleFailure();
      if (i < attempts - 1) await sleep(baseDelay * Math.pow(2, i));
    }
  }
  throw lastErr;
}

async function kvGet(key) {
  try { return await withRetry(function () { return kvGetRaw(key); }, { attempts: 4 }); }
  catch (e) { console.warn("kvGet failed, treating as null:", key, e); return null; }
}
async function kvSet(key, value) {
  return await withRetry(function () { return kvSetRaw(key, value); }, { attempts: 5, baseDelay: 400 });
}
async function kvList(prefix) {
  try { return await withRetry(function () { return kvListRaw(prefix); }, { attempts: 4 }); }
  catch (e) { console.warn("kvList failed, treating as empty:", prefix, e); return []; }
}
async function kvDelete(key) {
  return await withRetry(function () { return kvDeleteRaw(key); }, { attempts: 5, baseDelay: 400 });
}

async function mapLimited(items, limit, fn) {
  var results = new Array(items.length);
  var idx = 0;
  async function worker() {
    while (idx < items.length) {
      var my = idx++;
      results[my] = await fn(items[my], my);
    }
  }
  var n = Math.min(limit, items.length) || 1;
  var workers = [];
  for (var i = 0; i < n; i++) workers.push(worker());
  await Promise.all(workers);
  return results;
}

var WEEK = "week10";
function slugify(name) {
  return String(name).trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "student";
}
function shuffledIndices(n, seed) {
  var arr = [];
  for (var i = 0; i < n; i++) arr.push(i);
  var s = seed || Math.floor(Math.random() * 100000);
  function rand() { s = (s * 9301 + 49297) % 233280; return s / 233280; }
  for (var j = arr.length - 1; j > 0; j--) {
    var k = Math.floor(rand() * (j + 1));
    var tmp = arr[j]; arr[j] = arr[k]; arr[k] = tmp;
  }
  return arr;
}

/* ============================================================
   3. CUSTOM MODAL  (never native alert/confirm/prompt)
   ============================================================ */
function showModal(opts) {
  STATE.modal = {
    title: opts.title || "",
    message: opts.message || "",
    confirmText: opts.confirmText || "OK",
    cancelText: opts.cancelText || null,
    onConfirm: opts.onConfirm || null,
    onCancel: opts.onCancel || null
  };
  renderModal();
}
function closeModal() {
  STATE.modal = null;
  var existing = document.getElementById("modal-root");
  if (existing) existing.remove();
}
function renderModal() {
  var existing = document.getElementById("modal-root");
  if (existing) existing.remove();
  if (!STATE.modal) return;
  var root = document.createElement("div");
  root.id = "modal-root";
  root.className = "modal-overlay";
  var cancelBtn = STATE.modal.cancelText
    ? '<button class="btn outline" data-action="modal-cancel">' + escapeHtml(STATE.modal.cancelText) + '</button>'
    : "";
  root.innerHTML =
    '<div class="modal-card">' +
      (STATE.modal.title ? "<h3>" + escapeHtml(STATE.modal.title) + "</h3>" : "") +
      "<div>" + escapeHtml(STATE.modal.message) + "</div>" +
      '<div class="modal-actions">' +
        cancelBtn +
        '<button class="btn gold" data-action="modal-confirm">' + escapeHtml(STATE.modal.confirmText) + "</button>" +
      "</div>" +
    "</div>";
  document.body.appendChild(root);
}

function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

  for (var i = 0; i < DATA.blocks.length; i++) if (DATA.blocks[i].id === blockId) return DATA.blocks[i];
  return null;
}
function individualKey(cls, slug, activityId) { return WEEK + ":resp:" + cls + ":" + slug + ":" + activityId; }
function groupKey(cls, groupNum, activityId) { return WEEK + ":groupresp:" + cls + ":g" + groupNum + ":" + activityId; }
function groupCountForClass(cls) {
  var size = cls === "A" ? 24 : 20;
  return Math.max(1, Math.ceil(size / 4));
}

/* ============================================================
   5. TOP-LEVEL RENDER DISPATCH
   ============================================================ */
function render() {
  document.body.classList.toggle("dark-mode", STATE.role === "instructor");
  var html = "";
  if (STATE.screen === "landing") html = renderLanding();
  else if (STATE.screen === "studentSetup") html = renderStudentSetup();
  else if (STATE.screen === "courseMap") html = renderCourseMap();
  else if (STATE.screen === "activity") html = renderActivityScreen();
  else if (STATE.screen === "instructorAuth") html = renderInstructorAuth();
  else if (STATE.screen === "dashboard") html = renderDashboard();
  else html = "<div class='screen'>Unknown screen</div>";

  var toggle = "";
  if (STATE.screen !== "landing") {
    toggle =
      '<div class="toggle-pill">' +
        '<button data-action="switch-role" data-role="student" class="' + (STATE.role === "student" ? "active" : "") + '">Student</button>' +
        '<button data-action="switch-role" data-role="instructor" class="' + (STATE.role === "instructor" ? "active" : "") + '">Instructor</button>' +
      "</div>";
  }
  app.innerHTML = toggle + html;
  renderModal();
}

/* ============================================================
   8. COURSE MAP
   ============================================================ */
async function loadCourseMapData() {
  STATE.courseMapCache.loading = true;
  STATE.courseMapCache.error = null;
  render();
  var slug = STATE.student.slug, cls = STATE.student.cls;
  try {
    var indivPrefix = WEEK + ":resp:" + cls + ":" + slug + ":";
    var groupPrefix = WEEK + ":groupresp:" + cls + ":";
    var indivKeys = await kvList(indivPrefix);
    var groupKeys = await kvList(groupPrefix);
    STATE.courseMapCache.indivKeys = indivKeys || [];
    STATE.courseMapCache.groupKeys = groupKeys || [];
  } catch (e) {
    STATE.courseMapCache.error = String(e && e.message || e);
  }
  STATE.courseMapCache.loading = false;
  // guard: only repaint if the user is still on the Course Map - an in-flight load
  // that resolves after the user has already navigated elsewhere must not clobber
  // whatever screen (e.g. an in-progress activity) is now showing.
  if (STATE.screen === "courseMap") render();
}

function isActivityDone(activityId) {
  var act = activityLookup(activityId);
  var cls = STATE.student.cls, slug = STATE.student.slug;
  if (!act.group) {
    return STATE.courseMapCache.indivKeys.indexOf(individualKey(cls, slug, activityId)) !== -1;
  } else {
    var g = STATE.student.groups[activityId];
    if (!g) return false;
    return STATE.courseMapCache.groupKeys.indexOf(groupKey(cls, g, activityId)) !== -1;
  }
}

function renderCourseMap() {
  var totalCount = 0, doneCount = 0;
  var blocksHtml = "";
  DATA.blocks.forEach(function (block) {
    blocksHtml += '<div class="map-block-title">' + escapeHtml(block.label) + "</div>";
    block.activities.forEach(function (activityId, i) {
      var act = activityLookup(activityId);
      totalCount++;
      var done = isActivityDone(activityId);
      if (done) doneCount++;
      var idxHtml = done ? "\u2713" : String(i + 1);
      blocksHtml +=
        '<div class="map-item" data-action="open-activity" data-activity="' + activityId + '">' +
          '<div class="idx ' + (done ? "done" : "") + '">' + idxHtml + "</div>" +
          '<div class="body">' +
            '<div class="t">' + escapeHtml(act.title) + (act.group ? '  <span class="pill gold" style="margin-left:6px;">GROUP</span>' : "") + "</div>" +
            '<div class="b">' + escapeHtml(act.blurb) + "</div>" +
          "</div>" +
        "</div>";
    });
  });
  var loadingNote = STATE.courseMapCache.loading ? '<p class="muted-text"><span class="spinner" style="border-top-color:#2F6F62;border-color:rgba(47,111,98,0.3)"></span>Checking your progress...</p>' : "";
  var errNote = STATE.courseMapCache.error ? '<div class="err-banner">Couldn\'t check progress - showing activities anyway.<span class="tech">' + escapeHtml(STATE.courseMapCache.error) + "</span></div>" : "";
  return (
    '<div class="screen wide">' +
      '<div class="progress-pill">' + doneCount + " / " + totalCount + " done</div>" +
      "<h2>" + escapeHtml(STATE.student.name) + " - Class " + escapeHtml(STATE.student.cls) + "</h2>" +
      loadingNote + errNote +
      blocksHtml +
    "</div>"
  );
}

/* ============================================================
   9. ACTIVITY SCREEN - dispatch + group-picker gate
   ============================================================ */
function ensureDraft(activityId) {
  if (STATE.activityDraft[activityId]) return STATE.activityDraft[activityId];
  var act = activityLookup(activityId);
  var draft = { submitting: false, submitError: null, submitted: false };
  if (act.type === "poll") draft.choice = null;
  if (act.type === "synthesis") { draft.choice = null; draft.justification = ""; }
  if (act.type === "quiz") draft.answers = act.stems.map(function () { return null; });
  if (act.type === "matching") {
    draft.picks = act.terms.map(function () { return null; });
    if (!STATE.activityLoadedShuffle[activityId]) {
      STATE.activityLoadedShuffle[activityId] = shuffledIndices(act.definitions.length);
    }
  }
  if (act.type === "ordering") {
    if (!STATE.activityLoadedShuffle[activityId]) {
      STATE.activityLoadedShuffle[activityId] = shuffledIndices(act.items.length);
    }
    draft.order = STATE.activityLoadedShuffle[activityId].slice();
  }
  if (act.type === "bucket") {
    draft.assignments = {};
    draft.selectedItem = null;
  }
  if (act.type === "spectrum") {
    draft.values = act.statements.map(function () { return 3; });
    draft.justifications = act.statements.map(function () { return ""; });
  }
  if (act.type === "group") {
    draft.fields = act.fields.map(function () { return ""; });
  }
  STATE.activityDraft[activityId] = draft;
  return draft;
}

function renderActivityScreen() {
  var activityId = STATE.currentActivityId;
  var act = activityLookup(activityId);
  if (!act) return '<div class="screen">Activity not found. <button class="btn" data-action="back-to-map">Back</button></div>';

  if (act.group && !STATE.student.groups[activityId]) {
    return renderGroupPicker(activityId, act);
  }

  var draft = ensureDraft(activityId);
  var blockLabel = blockLookup(act.block).label;

  if (draft.submitted) {
    return renderSubmittedScreen(activityId, act);
  }

  var inner = "";
  if (act.type === "poll") inner = renderPollActivity(activityId, act, draft);
  else if (act.type === "matching") inner = renderMatchingActivity(activityId, act, draft);
  else if (act.type === "quiz") inner = renderQuizActivity(activityId, act, draft);
  else if (act.type === "ordering") inner = renderOrderingActivity(activityId, act, draft);
  else if (act.type === "bucket") inner = renderBucketActivity(activityId, act, draft);
  else if (act.type === "spectrum") inner = renderSpectrumActivity(activityId, act, draft);
  else if (act.type === "group") inner = renderGroupTaskActivity(activityId, act, draft);
  else if (act.type === "synthesis") inner = renderSynthesisActivity(activityId, act, draft);

  var errHtml = draft.submitError
    ? '<div class="err-banner">Couldn\'t save - Try Again<span class="tech">' + escapeHtml(draft.submitError) + "</span></div>"
    : "";

  return (
    '<div class="screen">' +
      '<button class="btn outline small" data-action="back-to-map" style="margin-bottom:14px;">&larr; Course Map</button>' +
      '<div class="pill teal" style="margin-bottom:10px;">' + escapeHtml(blockLabel) + "</div>" +
      "<h2>" + escapeHtml(act.title) + (act.group ? ' <span class="pill gold">GROUP ' + escapeHtml(STATE.student.groups[activityId] || "") + "</span>" : "") + "</h2>" +
      inner +
      errHtml +
      '<button class="btn gold" style="margin-top:20px;" data-action="submit-activity" data-activity="' + activityId + '" ' + (draft.submitting ? "disabled" : "") + ">" +
        (draft.submitting ? '<span class="spinner"></span>Saving...' : "Submit") +
      "</button>" +
    "</div>"
  );
}

function renderGroupPicker(activityId, act) {
  var cls = STATE.student.cls;
  var n = groupCountForClass(cls);
  var opts = "";
  for (var i = 1; i <= n; i++) opts += '<option value="' + i + '">Group ' + i + "</option>";
  return (
    '<div class="screen">' +
      '<button class="btn outline small" data-action="back-to-map" style="margin-bottom:14px;">&larr; Course Map</button>' +
      "<h2>" + escapeHtml(act.title) + '  <span class="pill gold">GROUP</span></h2>' +
      '<p class="muted-text">This is a group activity. Pick your group number - your group\'s answer counts as one shared submission.</p>' +
      '<label class="field-label">Your group (Class ' + escapeHtml(cls) + ", " + n + " groups)</label>" +
      '<select id="group-picker-select">' + opts + "</select>" +
      '<button class="btn gold" style="margin-top:16px;" data-action="confirm-group" data-activity="' + activityId + '">Continue</button>' +
    "</div>"
  );
}

function renderSubmittedScreen(activityId, act) {
  var blockActs = blockLookup(act.block).activities;
  var idx = blockActs.indexOf(activityId);
  var nextId = null;
  for (var bi = 0; bi < DATA.blocks.length && !nextId; bi++) {
    var b = DATA.blocks[bi];
    var actsIdx = b.activities.indexOf(activityId);
    if (actsIdx !== -1) {
      if (actsIdx + 1 < b.activities.length) nextId = b.activities[actsIdx + 1];
      else if (bi + 1 < DATA.blocks.length) nextId = DATA.blocks[bi + 1].activities[0];
    }
  }
  var nextBtn = nextId
    ? '<button class="btn gold" data-action="open-activity" data-activity="' + nextId + '">Next Activity: ' + escapeHtml(activityLookup(nextId).title) + "</button>"
    : "";
  return (
    '<div class="screen">' +
      '<div class="card"><h2 style="color:#2F6F62;">Submitted!</h2>' +
      '<p class="muted-text">Your response has been saved.</p></div>' +
      '<div style="display:flex; gap:10px; flex-wrap:wrap;">' +
        '<button class="btn outline" data-action="back-to-map">Back to Course Map</button>' +
        nextBtn +
      "</div>" +
    "</div>"
  );
}

/* ============================================================
   10. PER-TYPE ACTIVITY RENDERERS
   ============================================================ */
function renderPollActivity(activityId, act, draft) {
  var letters = ["A", "B", "C", "D", "E"];
  var rows = act.options.map(function (opt, i) {
    var sel = draft.choice === i;
    return (
      '<div class="option-row ' + (sel ? "selected" : "") + '" data-action="poll-pick" data-activity="' + activityId + '" data-idx="' + i + '">' +
        '<input type="radio" ' + (sel ? "checked" : "") + " readonly>" +
        "<div><b>" + letters[i] + ".</b> " + escapeHtml(opt) + "</div>" +
      "</div>"
    );
  }).join("");
  return "<p>" + escapeHtml(act.prompt) + "</p>" + rows + '<p class="muted-text">No right answer here - just your honest instinct.</p>';
}

function renderMatchingActivity(activityId, act, draft) {
  var shuffle = STATE.activityLoadedShuffle[activityId];
  var rows = act.terms.map(function (term, i) {
    var selectId = "match-select-" + activityId + "-" + i;
    var options = shuffle.map(function (origIdx) {
      var selected = draft.picks[i] === origIdx ? "selected" : "";
      return '<option value="' + origIdx + '" ' + selected + ">" + escapeHtml(act.definitions[origIdx]) + "</option>";
    }).join("");
    return (
      '<div class="group-field">' +
        "<label>" + escapeHtml(term) + "</label>" +
        '<select data-action="matching-pick" data-activity="' + activityId + '" data-term="' + i + '" id="' + selectId + '">' +
          '<option value="">-- choose the matching definition --</option>' + options +
        "</select>" +
      "</div>"
    );
  }).join("");
  return rows;
}

function renderQuizActivity(activityId, act, draft) {
  var letters = ["A", "B", "C", "D"];
  return act.stems.map(function (stem, si) {
    var opts = act.options.map(function (opt, oi) {
      var sel = draft.answers[si] === oi;
      return (
        '<div class="option-row ' + (sel ? "selected" : "") + '" data-action="quiz-pick" data-activity="' + activityId + '" data-stem="' + si + '" data-idx="' + oi + '">' +
          '<input type="radio" ' + (sel ? "checked" : "") + " readonly>" +
          "<div><b>" + letters[oi] + ".</b> " + escapeHtml(opt) + "</div>" +
        "</div>"
      );
    }).join("");
    return '<div class="card"><b>' + (si + 1) + ".</b> " + escapeHtml(stem) + "</div>" + opts;
  }).join("");
}

function renderOrderingActivity(activityId, act, draft) {
  return draft.order.map(function (origIdx, pos) {
    return (
      '<div class="order-row">' +
        '<div class="num">' + (pos + 1) + "</div>" +
        '<div class="txt">' + escapeHtml(act.items[origIdx]) + "</div>" +
        '<div class="order-btns" style="display:flex; gap:6px;">' +
          '<button data-action="order-move" data-activity="' + activityId + '" data-pos="' + pos + '" data-dir="-1" ' + (pos === 0 ? "disabled" : "") + ">\u25B2</button>" +
          '<button data-action="order-move" data-activity="' + activityId + '" data-pos="' + pos + '" data-dir="1" ' + (pos === draft.order.length - 1 ? "disabled" : "") + ">\u25BC</button>" +
        "</div>" +
      "</div>"
    );
  }).join("") + '<p class="muted-text">Use the arrows to reorder, earliest at the top.</p>';
}

function renderBucketActivity(activityId, act, draft) {
  var itemsHtml = act.items.map(function (item, i) {
    var placed = draft.assignments[i] !== undefined;
    var selected = draft.selectedItem === i;
    if (placed) return "";
    return (
      '<div class="bucket-item ' + (selected ? "selected" : "") + '" data-action="bucket-select-item" data-activity="' + activityId + '" data-item="' + i + '">' +
        escapeHtml(item.text) +
      "</div>"
    );
  }).join("");
  var catsHtml = act.categories.map(function (catName, ci) {
    var inCat = act.items.map(function (item, i) { return draft.assignments[i] === ci ? i : null; }).filter(function (x) { return x !== null; });
    var chips = inCat.map(function (i) {
      return '<div class="bucket-item placed">' + escapeHtml(act.items[i].text) + "</div>";
    }).join("");
    return (
      '<div class="bucket-cat ' + (draft.selectedItem !== null ? "hot" : "") + '" data-action="bucket-assign" data-activity="' + activityId + '" data-cat="' + ci + '">' +
        "<b>" + escapeHtml(catName) + "</b><div>" + chips + "</div>" +
      "</div>"
    );
  }).join("");
  var remaining = act.items.length - Object.keys(draft.assignments).length;
  return (
    '<p class="muted-text">' + (draft.selectedItem !== null ? "Now tap a category to place it." : "Tap an excerpt below, then tap a category.") + "</p>" +
    '<div style="margin-bottom:14px;">' + (itemsHtml || '<i class="muted-text">All items placed.</i>') + "</div>" +
    catsHtml +
    '<p class="muted-text">' + remaining + " item(s) left to sort.</p>"
  );
}

function renderSpectrumActivity(activityId, act, draft) {
  return act.statements.map(function (st, i) {
    return (
      '<div class="card">' +
        "<p>" + (i + 1) + ". " + escapeHtml(st) + "</p>" +
        '<div class="slider-row">' +
          '<input type="range" min="1" max="5" value="' + draft.values[i] + '" data-action="spectrum-slide" data-activity="' + activityId + '" data-stmt="' + i + '">' +
          '<div class="slider-labels"><span>Disagree</span><span>Agree</span></div>' +
        "</div>" +
        '<textarea placeholder="One sentence justifying your position..." data-action="spectrum-justify" data-activity="' + activityId + '" data-stmt="' + i + '">' + escapeHtml(draft.justifications[i]) + "</textarea>" +
      "</div>"
    );
  }).join("");
}

function renderGroupTaskActivity(activityId, act, draft) {
  return (
    "<p>" + escapeHtml(act.instruction) + "</p>" +
    act.fields.map(function (label, i) {
      return (
        '<div class="group-field">' +
          "<label>" + escapeHtml(label) + "</label>" +
          '<textarea data-action="group-field-input" data-activity="' + activityId + '" data-field="' + i + '">' + escapeHtml(draft.fields[i]) + "</textarea>" +
        "</div>"
      );
    }).join("")
  );
}

function renderSynthesisActivity(activityId, act, draft) {
  var letters = ["A", "B"];
  var rows = act.options.map(function (opt, i) {
    var sel = draft.choice === i;
    return (
      '<div class="option-row ' + (sel ? "selected" : "") + '" data-action="synth-pick" data-activity="' + activityId + '" data-idx="' + i + '">' +
        '<input type="radio" ' + (sel ? "checked" : "") + " readonly>" +
        "<div><b>" + letters[i] + ".</b> " + escapeHtml(opt) + "</div>" +
      "</div>"
    );
  }).join("");
  return (
    "<p>" + escapeHtml(act.prompt) + "</p>" + rows +
    '<label class="field-label">One-line justification</label>' +
    '<input type="text" placeholder="Your reason..." value="' + escapeHtml(draft.justification) + '" data-action="synth-justify" data-activity="' + activityId + '">'
  );
}

/* ============================================================
   11. VALIDATION per activity type
   ============================================================ */
function validateDraft(act, draft) {
  if (act.type === "poll") return draft.choice !== null ? null : "Pick one option first.";
  if (act.type === "quiz") return draft.answers.every(function (a) { return a !== null; }) ? null : "Answer every question first.";
  if (act.type === "matching") return draft.picks.every(function (p) { return p !== null; }) ? null : "Match every term first.";
  if (act.type === "ordering") return null;
  if (act.type === "bucket") return Object.keys(draft.assignments).length === act.items.length ? null : "Sort every item into a category first.";
  if (act.type === "spectrum") return draft.justifications.every(function (j) { return j.trim().length > 0; }) ? null : "Write a one-line justification for every statement.";
  if (act.type === "group") return draft.fields.every(function (f) { return f.trim().length > 0; }) ? null : "Fill in all three fields as a group first.";
  if (act.type === "synthesis") return (draft.choice !== null && draft.justification.trim().length > 0) ? null : "Pick a side and write a one-line justification first.";
  return null;
}

function buildPayload(act, draft) {
  if (act.type === "poll") return { choice: draft.choice };
  if (act.type === "quiz") return { answers: draft.answers };
  if (act.type === "matching") return { picks: draft.picks };
  if (act.type === "ordering") return { order: draft.order };
  if (act.type === "bucket") return { assignments: draft.assignments };
  if (act.type === "spectrum") return { values: draft.values, justifications: draft.justifications };
  if (act.type === "group") return { fields: draft.fields };
  if (act.type === "synthesis") return { choice: draft.choice, justification: draft.justification };
  return {};
}

/* ============================================================
   12. EVENT HANDLING - click delegation
   ============================================================ */
async function handleSubmitActivity(activityId) {
  var act = activityLookup(activityId);
  var draft = STATE.activityDraft[activityId];
  var validationMsg = validateDraft(act, draft);
  if (validationMsg) {
    showModal({ title: "Almost done", message: validationMsg, confirmText: "OK" });
    return;
  }
  draft.submitting = true;
  draft.submitError = null;
  render();
  var payload = buildPayload(act, draft);
  var cls = STATE.student.cls;
  var key = act.group
    ? groupKey(cls, STATE.student.groups[activityId], activityId)
    : individualKey(cls, STATE.student.slug, activityId);
  try {
    await kvSet(key, JSON.stringify(payload));
    draft.submitting = false;
    draft.submitted = true;
    if (!act.group) STATE.courseMapCache.indivKeys.push(key);
    else STATE.courseMapCache.groupKeys.push(key);
    render();
  } catch (e) {
    draft.submitting = false;
    draft.submitError = String(e && e.message || e);
    render();
  }
}

function handleClick(e) {
  var target = e.target.closest("[data-action]");
  if (!target) return;
  var action = target.getAttribute("data-action");

  if (action === "modal-confirm") {
    var cb = STATE.modal && STATE.modal.onConfirm;
    closeModal();
    if (cb) cb();
    return;
  }
  if (action === "modal-cancel") {
    var cb2 = STATE.modal && STATE.modal.onCancel;
    closeModal();
    if (cb2) cb2();
    return;
  }

  if (action === "enter-student") { STATE.role = "student"; STATE.screen = "studentSetup"; render(); return; }
  if (action === "enter-instructor") {
    STATE.role = "instructor";
    if (STATE.instructorAuthed) { STATE.screen = "dashboard"; loadDashboardData(); }
    else STATE.screen = "instructorAuth";
    render();
    return;
  }
  if (action === "switch-role") {
    var role = target.getAttribute("data-role");
    if (role === "student") {
      STATE.role = "student";
      STATE.screen = STATE.student.name && STATE.student.cls ? "courseMap" : "studentSetup";
      if (STATE.screen === "courseMap") loadCourseMapData(); else render();
    } else {
      STATE.role = "instructor";
      if (STATE.instructorAuthed) { STATE.screen = "dashboard"; loadDashboardData(); }
      else { STATE.screen = "instructorAuth"; render(); }
    }
    return;
  }

  if (action === "pick-class") { STATE.student.cls = target.getAttribute("data-cls"); render(); return; }
  if (action === "student-continue") {
    var name = (STATE.student.name || "").trim();
    if (!name) { showModal({ title: "Name needed", message: "Please enter your name first." }); return; }
    if (!STATE.student.cls) { showModal({ title: "Class needed", message: "Please pick your class section first." }); return; }
    STATE.student.name = name;
    STATE.student.slug = slugify(name);
    STATE.screen = "courseMap";
    loadCourseMapData();
    return;
  }

  if (action === "open-activity") {
    STATE.currentActivityId = target.getAttribute("data-activity");
    STATE.screen = "activity";
    render();
    return;
  }
  if (action === "back-to-map") {
    STATE.screen = "courseMap";
    loadCourseMapData();
    return;
  }
  if (action === "confirm-group") {
    var sel = document.getElementById("group-picker-select");
    var g = sel ? sel.value : "1";
    STATE.student.groups[target.getAttribute("data-activity")] = g;
    render();
    return;
  }

  if (action === "poll-pick") {
    var d1 = STATE.activityDraft[target.getAttribute("data-activity")];
    d1.choice = parseInt(target.getAttribute("data-idx"), 10);
    render();
    return;
  }
  if (action === "synth-pick") {
    var d2 = STATE.activityDraft[target.getAttribute("data-activity")];
    d2.choice = parseInt(target.getAttribute("data-idx"), 10);
    render();
    return;
  }
  if (action === "quiz-pick") {
    var d3 = STATE.activityDraft[target.getAttribute("data-activity")];
    d3.answers[parseInt(target.getAttribute("data-stem"), 10)] = parseInt(target.getAttribute("data-idx"), 10);
    render();
    return;
  }
  if (action === "order-move") {
    var d4 = STATE.activityDraft[target.getAttribute("data-activity")];
    var pos = parseInt(target.getAttribute("data-pos"), 10);
    var dir = parseInt(target.getAttribute("data-dir"), 10);
    var newPos = pos + dir;
    if (newPos < 0 || newPos >= d4.order.length) return;
    var tmp = d4.order[pos]; d4.order[pos] = d4.order[newPos]; d4.order[newPos] = tmp;
    render();
    return;
  }
  if (action === "bucket-select-item") {
    var d5 = STATE.activityDraft[target.getAttribute("data-activity")];
    var itemIdx = parseInt(target.getAttribute("data-item"), 10);
    d5.selectedItem = d5.selectedItem === itemIdx ? null : itemIdx;
    render();
    return;
  }
  if (action === "bucket-assign") {
    var d6 = STATE.activityDraft[target.getAttribute("data-activity")];
    if (d6.selectedItem === null) return;
    var catIdx = parseInt(target.getAttribute("data-cat"), 10);
    d6.assignments[d6.selectedItem] = catIdx;
    d6.selectedItem = null;
    render();
    return;
  }
  if (action === "submit-activity") {
    handleSubmitActivity(target.getAttribute("data-activity"));
    return;
  }

  if (action === "dash-tab") { STATE.dashboard.cls = target.getAttribute("data-cls"); loadDashboardData(); return; }
  if (action === "dash-refresh") { loadDashboardData(); return; }
  if (action === "dash-reset") {
    showModal({
      title: "Reset all data?",
      message: "This clears every response for BOTH classes and cannot be undone. Are you sure?",
      confirmText: "Yes, reset everything",
      cancelText: "Cancel",
      onConfirm: function () { performResetAll(); }
    });
    return;
  }
  if (action === "instructor-auth-submit") {
    var pwInput = document.getElementById("instructor-pw-input");
    var pw = pwInput ? pwInput.value : "";
    if (pw === "ELT100") {
      STATE.instructorAuthed = true;
      STATE.screen = "dashboard";
      loadDashboardData();
    } else {
      showModal({ title: "Incorrect password", message: "That password isn't correct. Try again." });
    }
    return;
  }
}

function handleInputEvent(e) {
  var target = e.target.closest("[data-action]");
  if (!target) return;
  var action = target.getAttribute("data-action");
  if (action === "name-input") {
    STATE.student.name = target.value;
    return;
  }
  if (action === "matching-pick") {
    var d1 = STATE.activityDraft[target.getAttribute("data-activity")];
    var termIdx = parseInt(target.getAttribute("data-term"), 10);
    var v = target.value;
    d1.picks[termIdx] = v === "" ? null : parseInt(v, 10);
    return;
  }
  if (action === "spectrum-slide") {
    var d2 = STATE.activityDraft[target.getAttribute("data-activity")];
    d2.values[parseInt(target.getAttribute("data-stmt"), 10)] = parseInt(target.value, 10);
    return;
  }
  if (action === "spectrum-justify") {
    var d3 = STATE.activityDraft[target.getAttribute("data-activity")];
    d3.justifications[parseInt(target.getAttribute("data-stmt"), 10)] = target.value;
    return;
  }
  if (action === "group-field-input") {
    var d4 = STATE.activityDraft[target.getAttribute("data-activity")];
    d4.fields[parseInt(target.getAttribute("data-field"), 10)] = target.value;
    return;
  }
  if (action === "synth-justify") {
    var d5 = STATE.activityDraft[target.getAttribute("data-activity")];
    d5.justification = target.value;
    return;
  }
}

document.addEventListener("click", handleClick);
document.addEventListener("input", handleInputEvent);
document.addEventListener("change", handleInputEvent);

/* ============================================================
   13. INSTRUCTOR AUTH
   ============================================================ */
function renderInstructorAuth() {
  return (
    '<div class="screen">' +
      "<h2>Instructor Login</h2>" +
      '<label class="field-label">Password</label>' +
      '<input type="text" id="instructor-pw-input" placeholder="Enter password">' +
      '<button class="btn gold" style="margin-top:16px;" data-action="instructor-auth-submit">Enter Dashboard</button>' +
    "</div>"
  );
}

/* ============================================================
   14. DASHBOARD DATA LOADING
   ============================================================ */
async function loadDashboardData() {
  STATE.dashboard.loading = true;
  STATE.dashboard.error = null;
  render();
  var cls = STATE.dashboard.cls;
  try {
    var indivPrefix = WEEK + ":resp:" + cls + ":";
    var groupPrefix = WEEK + ":groupresp:" + cls + ":";
    var indivKeys = await kvList(indivPrefix);
    var groupKeysList = await kvList(groupPrefix);

    var indivRows = await mapLimited(indivKeys, 6, async function (key) {
      var val = await kvGet(key);
      return { key: key, value: val };
    });
    var groupRows = await mapLimited(groupKeysList, 6, async function (key) {
      var val = await kvGet(key);
      return { key: key, value: val };
    });

    var byActivity = {};
    Object.keys(DATA.activities).forEach(function (id) { byActivity[id] = []; });

    indivRows.forEach(function (row) {
      if (!row.value) return;
      var activityId = row.key.split(":").pop();
      if (!byActivity[activityId]) byActivity[activityId] = [];
      try { byActivity[activityId].push({ payload: JSON.parse(row.value), who: row.key }); }
      catch (e) { /* skip malformed */ }
    });
    groupRows.forEach(function (row) {
      if (!row.value) return;
      var activityId = row.key.split(":").pop();
      if (!byActivity[activityId]) byActivity[activityId] = [];
      try { byActivity[activityId].push({ payload: JSON.parse(row.value), who: row.key }); }
      catch (e) { /* skip malformed */ }
    });

    STATE.dashboard.data = byActivity;
  } catch (e) {
    STATE.dashboard.error = String(e && e.message || e);
  }
  STATE.dashboard.loading = false;
  if (STATE.screen === "dashboard") render();
}

/* ============================================================
   15. DASHBOARD AGGREGATION + RENDER PER ACTIVITY TYPE
   ============================================================ */
function renderDashCard(activityId) {
  var act = activityLookup(activityId);
  var rows = STATE.dashboard.data[activityId] || [];
  var body = "";
  var n = rows.length;

  if (act.type === "poll" || act.type === "synthesis") {
    var counts = act.options.map(function () { return 0; });
    var justifications = [];
    rows.forEach(function (r) {
      var c = r.payload.choice;
      if (typeof c === "number" && counts[c] !== undefined) counts[c]++;
      if (r.payload.justification) justifications.push(r.payload.justification);
    });
    body = act.options.map(function (opt, i) {
      var pct = n ? Math.round((counts[i] / n) * 100) : 0;
      return '<div class="dash-row"><span>' + escapeHtml(opt) + "</span><span>" + counts[i] + " (" + pct + "%)</span></div>";
    }).join("");
    if (justifications.length) {
      body += '<div style="margin-top:10px;"><b>Justifications:</b>' +
        justifications.map(function (j) { return '<div class="dash-row"><span>' + escapeHtml(j) + "</span><span></span></div>"; }).join("") +
        "</div>";
    }
  } else if (act.type === "quiz") {
    var quizLetters = ["A", "B", "C", "D", "E"];
    body = act.stems.map(function (stem, si) {
      var correctIdx = act.correct[si];
      var correctCount = 0;
      rows.forEach(function (r) { if (r.payload.answers && r.payload.answers[si] === correctIdx) correctCount++; });
      var pct = n ? Math.round((correctCount / n) * 100) : 0;
      return '<div class="dash-row"><span>Q' + (si + 1) + ": " + escapeHtml(stem.slice(0, 44)) + "...</span>" +
        '<span class="dash-correct">' + correctCount + "/" + n + " (" + pct + "%) correct - answer: " + quizLetters[correctIdx] + "</span></div>";
    }).join("");
  } else if (act.type === "matching") {
    body = act.terms.map(function (term, ti) {
      var correctCount = 0, answeredCount = 0;
      rows.forEach(function (r) {
        if (r.payload.picks && r.payload.picks[ti] !== null && r.payload.picks[ti] !== undefined) {
          answeredCount++;
          if (r.payload.picks[ti] === ti) correctCount++;
        }
      });
      var pct = answeredCount ? Math.round((correctCount / answeredCount) * 100) : 0;
      return '<div class="dash-row"><span>' + escapeHtml(term) + "</span><span class=\"dash-correct\">" + correctCount + "/" + answeredCount + " (" + pct + "%)</span></div>";
    }).join("");
  } else if (act.type === "ordering") {
    var exact = 0;
    rows.forEach(function (r) {
      if (r.payload.order && JSON.stringify(r.payload.order) === JSON.stringify(act.correctOrder)) exact++;
    });
    var pct2 = n ? Math.round((exact / n) * 100) : 0;
    body = '<div class="dash-row"><span>Fully correct order</span><span class="dash-correct">' + exact + "/" + n + " (" + pct2 + "%)</span></div>";
  } else if (act.type === "bucket") {
    body = act.items.map(function (item, ii) {
      var correctCount = 0;
      rows.forEach(function (r) {
        if (r.payload.assignments && r.payload.assignments[ii] === item.cat) correctCount++;
      });
      var pct3 = n ? Math.round((correctCount / n) * 100) : 0;
      return '<div class="dash-row"><span>' + escapeHtml(item.text.slice(0, 40)) + "...</span><span class=\"dash-correct\">" + correctCount + "/" + n + " (" + pct3 + "%)</span></div>";
    }).join("") + '<div class="muted-text" style="margin-top:6px;color:#B9C7C1;">' + n + " group submission(s)</div>";
  } else if (act.type === "spectrum") {
    body = act.statements.map(function (st, si) {
      var vals = rows.map(function (r) { return (r.payload.values && r.payload.values[si]) || null; }).filter(function (v) { return v !== null; });
      var avg = vals.length ? (vals.reduce(function (a, b) { return a + b; }, 0) / vals.length).toFixed(1) : "-";
      var justs = rows.map(function (r) { return r.payload.justifications && r.payload.justifications[si]; }).filter(function (j) { return j; });
      var justHtml = justs.length
        ? '<div style="margin:4px 0 10px 0;">' + justs.map(function (j) { return '<div class="muted-text" style="color:#B9C7C1;">- ' + escapeHtml(j) + "</div>"; }).join("") + "</div>"
        : "";
      return '<div class="dash-row"><span>' + escapeHtml(st.slice(0, 40)) + "...</span><span>avg " + avg + "/5 (n=" + vals.length + ")</span></div>" + justHtml;
    }).join("");
  } else if (act.type === "group") {
    body = rows.length
      ? rows.map(function (r) {
          var g = r.who.split(":")[2];
          return '<div class="dash-row" style="display:block;"><b>' + escapeHtml(g) + "</b><br>" +
            act.fields.map(function (label, fi) { return "<i>" + escapeHtml(label) + ":</i> " + escapeHtml(r.payload.fields[fi] || "") + "<br>"; }).join("") +
            "</div>";
        }).join("")
      : '<div class="muted-text">No group submissions yet.</div>';
  }

  return (
    '<div class="dash-card">' +
      "<h4>" + escapeHtml(act.title) + (act.group ? "  [GROUP]" : "") + " - " + n + " submission(s)</h4>" +
      body +
    "</div>"
  );
}

function renderDashboard() {
  var cls = STATE.dashboard.cls;
  var tabs = '<div class="tab-row">' +
    '<button class="' + (cls === "A" ? "active" : "") + '" data-action="dash-tab" data-cls="A">Class A</button>' +
    '<button class="' + (cls === "B" ? "active" : "") + '" data-action="dash-tab" data-cls="B">Class B</button>' +
    "</div>";

  var controls =
    '<div style="display:flex; gap:10px; margin-bottom:20px;">' +
      '<button class="btn gold" data-action="dash-refresh" ' + (STATE.resetInProgress ? "disabled" : "") + ">\uD83D\uDD04 Refresh All</button>" +
      '<button class="btn danger" data-action="dash-reset" ' + (STATE.resetInProgress ? "disabled" : "") + ">\uD83D\uDDD1 Reset All</button>" +
    "</div>";

  var resetNote = STATE.resetInProgress
    ? '<div class="card dark"><span class="spinner"></span>' + escapeHtml(STATE.resetProgressText) + "</div>"
    : "";

  var loadingNote = STATE.dashboard.loading ? '<p><span class="spinner"></span>Loading results...</p>' : "";
  var errNote = STATE.dashboard.error
    ? '<div class="err-banner">Couldn\'t load results.<span class="tech">' + escapeHtml(STATE.dashboard.error) + '</span></div><button class="btn gold small" data-action="dash-refresh">Try Again</button>'
    : "";

  var blocksHtml = "";
  if (!STATE.dashboard.loading && !STATE.dashboard.error) {
    DATA.blocks.forEach(function (block) {
      blocksHtml += '<h3 style="color:#E8C468;">' + escapeHtml(block.label) + "</h3>";
      block.activities.forEach(function (activityId) { blocksHtml += renderDashCard(activityId); });
    });
  }

  return (
    '<div class="screen wide">' +
      "<h2>Instructor Dashboard</h2>" +
      tabs + controls + resetNote + loadingNote + errNote + blocksHtml +
    "</div>"
  );
}

/* ============================================================
   16. RESET ALL
   ============================================================ */
async function performResetAll() {
  STATE.resetInProgress = true;
  STATE.resetProgressText = "Gathering keys...";
  render();
  try {
    var allKeys = [];
    for (var ci = 0; ci < 2; ci++) {
      var c = ci === 0 ? "A" : "B";
      var k1 = await kvList(WEEK + ":resp:" + c + ":");
      var k2 = await kvList(WEEK + ":groupresp:" + c + ":");
      allKeys = allKeys.concat(k1 || [], k2 || []);
    }
    var total = allKeys.length;
    var done = 0;
    STATE.resetProgressText = "Resetting... 0/" + total;
    render();
    await mapLimited(allKeys, 5, async function (key) {
      try { await kvDelete(key); } catch (e) { /* retried internally; count regardless */ }
      done++;
      STATE.resetProgressText = "Resetting... " + done + "/" + total;
    });

    // verification pass
    STATE.resetProgressText = "Verifying...";
    render();
    var remaining = [];
    for (var cj = 0; cj < 2; cj++) {
      var c2 = cj === 0 ? "A" : "B";
      var v1 = await kvList(WEEK + ":resp:" + c2 + ":");
      var v2 = await kvList(WEEK + ":groupresp:" + c2 + ":");
      remaining = remaining.concat(v1 || [], v2 || []);
    }
    if (remaining.length > 0) {
      STATE.resetInProgress = false;
      showModal({ title: "Reset incomplete", message: remaining.length + " item(s) could not be confirmed deleted. Try Reset All again." });
      render();
      return;
    }

    STATE.resetInProgress = false;
    STATE.student = { name: "", cls: "", slug: "", groups: {} };
    STATE.role = null;
    STATE.screen = "landing";
    STATE.activityDraft = {};
    STATE.activityLoadedShuffle = {};
    STATE.instructorAuthed = false;
    showModal({ title: "Reset complete", message: "All response data for both classes has been cleared." });
    render();
  } catch (e) {
    STATE.resetInProgress = false;
    showModal({ title: "Reset failed", message: "Something went wrong: " + String(e && e.message || e) + ". Nothing was navigated away - try again." });
    render();
  }
}

/* ============================================================
   17. BOOTSTRAP
   ============================================================ */
render();
</script>
