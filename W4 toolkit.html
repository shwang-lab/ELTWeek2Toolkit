<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 4 Toolkit &mdash; World Englishes &amp; ELF</title>
<style>
  :root{
    --teal:#1F4E44;
    --teal-acc:#2F6F62;
    --gold:#C98A2B;
    --gold-lt:#E8C468;
    --ink:#1B2430;
    --cream:#F2EFE6;
    --white:#FFFFFF;
    --cardbg:#F3F1EC;
    --cardbg2:#EFF5F3;
    --muted:#6B7280;
    --success:#7BC67E;
    --error:#A23B33;
    --error-bg:#FDEDEA;
    --e4efec:#E4EFEC;
    --fbf0dc:#FBF0DC;
    --d8e5e1:#D8E5E1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI", Arial, sans-serif;
    background:var(--white);
    color:var(--ink);
  }
  h1,h2,h3{ font-family:Georgia, "Times New Roman", serif; margin:0; }
  button{ font-family:inherit; cursor:pointer; border:none; }
  #app{ min-height:600px; padding-top:76px; position:relative; }

  /* ---------- top toggle ---------- */
  .top-toggle{
    position:fixed; top:16px; right:16px; z-index:500;
    display:flex; background:var(--cardbg); border-radius:999px; padding:4px;
    box-shadow:0 2px 8px rgba(0,0,0,0.12);
  }
  .top-toggle button{
    padding:8px 18px; border-radius:999px; background:transparent;
    font-size:13px; font-weight:600; color:var(--muted);
  }
  .top-toggle button.active{ background:var(--teal); color:#fff; }

  /* ---------- generic layout ---------- */
  .wrap{ max-width:920px; margin:0 auto; padding:24px 20px 60px; }
  .center-wrap{ max-width:520px; margin:60px auto; padding:0 20px; }
  .card{ background:var(--cardbg); border-radius:14px; padding:28px; }
  .card2{ background:var(--cardbg2); border-radius:14px; padding:28px; }
  .kicker{ color:var(--gold); font-weight:700; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:8px; }
  .muted{ color:var(--muted); font-size:14px; }
  .btn{
    display:inline-block; padding:12px 24px; border-radius:10px; font-weight:700; font-size:14px;
    background:var(--teal); color:#fff; transition:opacity .15s;
  }
  .btn:hover{ opacity:.9; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .btn.secondary{ background:var(--cardbg); color:var(--teal); border:1.5px solid var(--teal-acc); }
  .btn.gold{ background:var(--gold); }
  .btn.danger{ background:var(--error); }
  .btn.block{ display:block; width:100%; text-align:center; }
  input[type=text], select, textarea{
    width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid #D8DCE0;
    font-size:15px; font-family:inherit; background:#fff; color:var(--ink);
  }
  textarea{ resize:vertical; min-height:110px; }
  label{ font-size:13px; font-weight:600; color:var(--ink); display:block; margin-bottom:6px; }

  /* ---------- landing ---------- */
  .landing-title{ font-size:32px; color:var(--teal); margin-bottom:6px; }
  .landing-cards{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:20px; margin-top:32px; }
  .landing-card{
    background:var(--cardbg); border-radius:16px; padding:32px 24px; text-align:center;
    cursor:pointer; transition:transform .15s, box-shadow .15s; border:2px solid transparent;
  }
  .landing-card:hover{ transform:translateY(-3px); box-shadow:0 8px 20px rgba(0,0,0,0.08); border-color:var(--teal-acc); }
  .landing-card .icon{ font-size:36px; margin-bottom:10px; }
  .landing-card h3{ font-size:20px; color:var(--teal); margin-bottom:6px; }

  /* ---------- course map ---------- */
  .progress-pill{
    display:inline-block; background:var(--teal); color:#fff; font-size:12px; font-weight:700;
    padding:5px 14px; border-radius:999px;
  }
  .block-section{ margin-top:28px; }
  .block-title{ font-size:18px; color:var(--teal); font-weight:700; margin-bottom:12px; }
  .activity-row{
    display:flex; align-items:center; gap:14px; background:#fff; border:1.5px solid #E4E4E4;
    border-radius:12px; padding:14px 16px; margin-bottom:10px; cursor:pointer; transition:border-color .15s, box-shadow .15s;
  }
  .activity-row:hover{ border-color:var(--teal-acc); box-shadow:0 3px 10px rgba(0,0,0,0.06); }
  .activity-row .num{
    width:34px; height:34px; border-radius:50%; background:var(--gold); color:#fff; font-weight:700;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:14px;
  }
  .activity-row .body{ flex:1; min-width:0; }
  .activity-row .title{ font-weight:700; font-size:15px; color:var(--ink); }
  .activity-row .blurb{ font-size:12.5px; color:var(--muted); margin-top:2px; }
  .tag{ font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .tag.group{ background:var(--teal); color:#fff; }
  .tag.individual{ background:var(--teal-acc); color:#fff; }
  .check{ width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:14px; font-weight:900; }
  .check.done{ background:var(--success); color:#fff; }
  .check.todo{ background:#E4E4E4; color:transparent; }

  /* ---------- activity screen ---------- */
  .activity-header{ display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  .back-link{ color:var(--teal-acc); font-size:13px; font-weight:600; cursor:pointer; margin-bottom:14px; display:inline-block; }
  .badge-label{ background:var(--gold); color:#fff; font-weight:700; font-size:13px; padding:8px 16px; border-radius:8px; }
  .qbox{ background:#fff; border:1.5px solid #E4E4E4; border-radius:12px; padding:18px 20px; margin-bottom:16px; }
  .qtext{ font-weight:700; font-size:15px; margin-bottom:12px; }
  .opt-row{ display:flex; align-items:flex-start; gap:10px; padding:10px 12px; border-radius:8px; margin-bottom:6px; cursor:pointer; border:1.5px solid #E4E4E4; }
  .opt-row:hover{ border-color:var(--teal-acc); background:var(--cardbg2); }
  .opt-row.selected{ border-color:var(--teal); background:var(--e4efec); }
  .opt-row input{ margin-top:3px; }
  .match-item{ display:flex; align-items:center; gap:12px; background:#fff; border:1.5px solid #E4E4E4; border-radius:10px; padding:10px 14px; margin-bottom:8px; }
  .match-item .term{ flex:1; font-weight:600; font-size:14px; }
  .bucket-zone{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; margin-top:16px; }
  .bucket{ border-radius:12px; padding:14px; min-height:60px; }
  .bucket h4{ font-size:13px; margin-bottom:8px; }
  .group-item-pill{ background:#fff; border:1.5px solid #D8DCE0; border-radius:8px; padding:8px 10px; font-size:12.5px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; gap:6px; }
  .group-item-pill select{ width:auto; padding:4px 8px; font-size:12px; }
  .spectrum-track{ position:relative; height:8px; background:#E4E4E4; border-radius:4px; margin:40px 10px 20px; }
  .spectrum-fill{ position:absolute; top:0; left:0; height:8px; background:var(--gold); border-radius:4px; }
  .spectrum-handle{ position:absolute; top:-14px; width:36px; height:36px; border-radius:50%; background:var(--gold); border:3px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,0.25); cursor:grab; transform:translateX(-18px); }
  .spectrum-labels{ display:flex; justify-content:space-between; font-size:12.5px; font-weight:700; color:var(--teal); }

  /* ---------- toast / inline errors ---------- */
  .inline-error{ background:var(--error-bg); color:var(--error); padding:10px 14px; border-radius:8px; font-size:13px; margin-top:10px; font-weight:600; }
  .inline-error .tech{ font-weight:400; color:#8a4a44; font-size:11px; margin-top:4px; }
  .loading-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:#fff; animation:pulse 1s infinite; margin-right:6px; }

  /* ---------- modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,25,30,0.55); z-index:1000;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal-card{ background:#fff; border-radius:14px; padding:28px; max-width:420px; width:100%; }
  .modal-card h3{ font-size:18px; color:var(--teal); margin-bottom:10px; font-family:"Segoe UI",Arial,sans-serif; font-weight:700;}
  .modal-card p{ font-size:14px; color:var(--ink); line-height:1.5; margin-bottom:20px; }
  .modal-actions{ display:flex; gap:10px; justify-content:flex-end; }

  /* ---------- submitted screen ---------- */
  .submitted-box{ text-align:center; padding:50px 20px; }
  .submitted-box .check-big{ width:64px; height:64px; border-radius:50%; background:var(--success); color:#fff; font-size:32px; display:flex; align-items:center; justify-content:center; margin:0 auto 18px; }

  /* ---------- instructor ---------- */
  #app.instructor-mode{ background:var(--teal); color:var(--cream); min-height:100vh; }
  .instr-wrap{ max-width:1080px; margin:0 auto; padding:24px 20px 60px; }
  .instr-tabs{ display:flex; gap:8px; margin-bottom:20px; }
  .instr-tabs button{
    padding:10px 26px; border-radius:10px; background:#245A4E; color:var(--cream); font-weight:700; font-size:14px;
  }

  .instr-actions{ display:flex; gap:10px; margin-bottom:26px; flex-wrap:wrap; }
  .instr-actions .btn{ background:#245A4E; color:var(--cream); }
  .instr-actions .btn.danger-i{ background:var(--error); color:#fff; }
  .instr-block{ margin-bottom:30px; }
  .instr-block-title{ font-size:16px; font-weight:700; color:var(--gold-lt); margin-bottom:12px; text-transform:uppercase; letter-spacing:1px; font-size:12px;}
  .result-card{ background:#245A4E; border-radius:12px; padding:18px 20px; margin-bottom:14px; }
  .result-card h4{ font-family:"Segoe UI",Arial,sans-serif; font-size:15px; font-weight:700; color:#fff; margin-bottom:4px; }
  .result-meta{ font-size:12px; color:#9FC4BA; margin-bottom:12px; }
  .accuracy-bar-track{ background:#1A463C; border-radius:6px; height:10px; overflow:hidden; margin:6px 0; }
  .accuracy-bar-fill{ background:var(--success); height:10px; }
  .correct-tag{ background:var(--success); color:#0d2b23; font-weight:700; font-size:11px; padding:2px 8px; border-radius:6px; }
  .resp-line{ font-size:13px; color:var(--cream); padding:6px 0; border-bottom:1px solid #1A463C; }
  .resp-line:last-child{ border-bottom:none; }
  .progress-line{ font-size:13px; color:var(--gold-lt); margin-top:10px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
"use strict";

// ============================================================
// CONFIG
// ============================================================
var INSTRUCTOR_PASSWORD = "ELT100";
var CLASS_SIZES = { A: 26, B: 20 };

// Week 2/3와 동일한 Apps Script(구글시트 KV 백엔드)를 재사용합니다.
var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzJc_RFDdhCU4_VB41uMefmy6cKgjg4DVwqVk1xBDa5MDAA0aMq53VinzQf1iZKyy4i/exec";

// This app was originally written against Claude's window.storage API.
// storageShim below implements the exact same method shapes (get/set/list/delete
// returning the same value shapes window.storage used to) but talks to our own
// Apps Script backend via fetch() instead. Every call site below still calls
// "window.storage.X" unchanged; we simply assign our shim onto that name so
// nothing else in this file needs to change.
window.storage = {
  get: async function(key, shared){
    var res = await fetch(APPS_SCRIPT_URL + "?action=get&key=" + encodeURIComponent(key));
    var data = await res.json();
    if (data.status !== "ok") throw new Error(data.message || "get failed");
    if (data.value === null || typeof data.value === "undefined") return null;
    return { key: key, value: data.value, shared: shared };
  },
  set: async function(key, value, shared){
    var res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids CORS preflight
      body: JSON.stringify({ action: "set", key: key, value: value })
    });
    var data = await res.json();
    if (data.status !== "ok") throw new Error(data.message || "set failed");
    return true;
  },
  list: async function(prefix, shared){
    var res = await fetch(APPS_SCRIPT_URL + "?action=list&prefix=" + encodeURIComponent(prefix));
    var data = await res.json();
    if (data.status !== "ok") throw new Error(data.message || "list failed");
    return { keys: data.keys };
  },
  delete: async function(key, shared){
    var res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "delete", key: key })
    });
    var data = await res.json();
    if (data.status !== "ok") throw new Error(data.message || "delete failed");
    return true;
  }
};

// Group count is fixed explicitly, independent of CLASS_SIZES - a roster
// change (A Class 24 -> 26) must never silently reshuffle how many groups
// exist. Both counts were originally derived as ceil(size/4); keep the same
// group counts (6, 5) going forward regardless of CLASS_SIZES.
var GROUP_COUNTS = { A: 6, B: 5 };

var ACTIVITIES = [
  { id:"a1", block:"Block A", blockKey:"A", num:1, type:"matching", mode:"individual",
    title:"Match the Country to the Circle", blurb:"Match 8 countries to Inner / Outer / Expanding Circle.",
    options:["Inner Circle","Outer Circle","Expanding Circle"],
    pairs:[
      {term:"United States", answer:"Inner Circle"},
      {term:"Nigeria", answer:"Outer Circle"},
      {term:"China", answer:"Expanding Circle"},
      {term:"India", answer:"Outer Circle"},
      {term:"United Kingdom", answer:"Inner Circle"},
      {term:"Brazil", answer:"Expanding Circle"},
      {term:"Singapore", answer:"Outer Circle"},
      {term:"Japan", answer:"Expanding Circle"}
    ]
  },
  { id:"a2", block:"Block A", blockKey:"A", num:2, type:"scenario", mode:"individual",
    title:"Susan's Dilemma, Three Ways", blurb:"3 classroom scenarios \u2014 pick the best response.",
    questions:[
      { q:"A Filipino teacher of English is criticized by a parent for not sounding \u201Clike a real American.\u201D What's the most defensible response, per the chapter's stance on ownership?",
        opts:["Apologize and commit to intensive American-accent training.",
              "Explain that Filipino English is a legitimate Outer Circle variety, not a flawed imitation of American English.",
              "Suggest the parent switch their child to a native-speaker teacher.",
              "Agree that only Inner Circle accents should be taught in schools."], correct:1 },
      { q:"A Korean and a Brazilian colleague communicate fluently despite frequent article omissions and generic-verb overuse. A consultant insists on correcting every error live. What does the chapter's ELF research suggest?",
        opts:["Necessary \u2014 these errors are a real barrier to understanding.",
              "Counterproductive \u2014 these features rarely cause breakdowns; constant correction can damage comity.",
              "Required by international business etiquette.",
              "Only matters if a native speaker is present."], correct:1 },
      { q:"A new teacher is deciding which pronunciation features to prioritize with Expanding Circle learners. Which approach best fits current ELF thinking?",
        opts:["Drill native-like vowel quality and both th sounds intensively.",
              "Ignore pronunciation entirely \u2014 grammar matters more.",
              "Prioritize features with real intelligibility payoff (consistent vowel contrasts, word stress); deprioritize ones research shows rarely cause breakdowns.",
              "Copy whatever pronunciation curriculum was used for Inner Circle ESL students."], correct:2 }
    ]
  },
  { id:"a3", block:"Block A", blockKey:"A", num:3, type:"group", mode:"group",
    title:"Sort the Slip-Ups: Comity or Real Risk?", blurb:"As a group, sort 8 items and justify your split.",
    items:[
      "\u201CShe go to the market every day.\u201D",
      "\u201CMary is the manager which they hired.\u201D",
      "\u201CI am seeking for a solution.\u201D",
      "\u201CWe should do a discussion about this.\u201D",
      "\u201CPlease give me a advice.\u201D",
      "He said \u201Csink\u201D when he meant \u201Cthink.\u201D",
      "She stressed \u201CREfuse\u201D instead of \u201CreFUSE,\u201D confusing the listener.",
      "They confused \u201Cship\u201D and \u201Csheep\u201D because both sounded the same."
    ],
    buckets:["Bucket 1: Comity absorbs it \u2014 unlikely to cause real breakdown","Bucket 2: Plausible real breakdown risk"]
  },
  { id:"a4", block:"Block A", blockKey:"A", num:4, type:"spectrum", mode:"individual",
    title:"Prepping for the International Call", blurb:"Slide to your position, then justify it.",
    scenario:"You're prepping a team of Expanding Circle employees for a critical live video call with clients from several L1 backgrounds.",
    leftLabel:"Prioritize native-like accent (RP / GA target)", rightLabel:"Prioritize Lingua Franca Core / mutual intelligibility"
  },
  { id:"b1", block:"Block B", blockKey:"B", num:1, type:"poll", mode:"individual",
    title:"WE or ELF?", blurb:"Single-click poll.",
    scenario:"Two Nigerian civil servants discuss a policy proposal in English, in Lagos, freely using local idioms and \u2018isn't it?\u2019 tags.",
    options:["World Englishes","ELF","Both","Neither"], correct:0
  },
  { id:"b2", block:"Block B", blockKey:"B", num:2, type:"matching", mode:"individual",
    title:"Match the Term to Its Definition", blurb:"Match 4 terms to real definitions.",
    options:["1,000+ European ELF speaker corpus","first-gen hybrid, not a stable variety","generative resource speakers exploit","shuttle between languages as one system"],
    pairs:[
      {term:"VOICE", answer:"1,000+ European ELF speaker corpus"},
      {term:"Similect", answer:"first-gen hybrid, not a stable variety"},
      {term:"Virtual language", answer:"generative resource speakers exploit"},
      {term:"Translanguaging", answer:"shuttle between languages as one system"}
    ]
  },
  { id:"b3", block:"Block B", blockKey:"B", num:3, type:"group", mode:"group",
    title:"MES, BES, or NBES \u2014 Does It Actually Help?", blurb:"Discuss and submit a group consensus.",
    prompt1:"Each member: which category would you fall under \u2014 MES, BES, or NBES \u2014 per Jenkins's definitions?",
    prompt2:"Debate: does this three-category system actually solve the native/non-native problem, or just relabel the same hierarchy under new names?"
  },
  { id:"b4", block:"Block B", blockKey:"B", num:4, type:"scenario", mode:"individual",
    title:"Theoretical Foundation Check", blurb:"4 questions on Ch.2.",
    questions:[
      { q:"Which best describes \u201CWorld Englishes\u201D as defined in the Secondary reading?",
        opts:["Local, indigenised varieties developed through English's institutionalized use in Outer Circle countries","A single standardized global variety","Slang used only among non-native speakers abroad","A dialect spoken exclusively in the UK"], correct:0 },
      { q:"According to Seidlhofer and Widdowson, \u201Cvirtual language\u201D refers to:",
        opts:["A fixed grammar textbook standard","A generative encoding potential that speakers creatively exploit","Software-generated English used in translation apps","The official register of international treaties"], correct:1 },
      { q:"Medgyes's later (2017) view on non-native English-speaking teachers is that:",
        opts:["They can never match native-speaker teaching quality","Despite a linguistic handicap, they have an equal chance of success \u2014 reflection matters more than proficiency","They should specialize only in grammar instruction","They are indistinguishable from native-speaker teachers in every way"], correct:1 },
      { q:"ELF-informed pedagogy differs from ELF-aware pedagogy mainly because it:",
        opts:["Treats learners as first-person users within a Communicative Language Teaching framework, rather than as observers/analysts","Removes all reading materials from the syllabus","Only applies to Expanding Circle classrooms","Rejects communicative language teaching entirely"], correct:0 }
    ]
  },
  { id:"syn", block:"Synthesis", blockKey:"SYN", num:1, type:"freetext", mode:"individual",
    title:"Connect the Two Blocks", blurb:"Free-text, 3\u20135 sentences.",
    prompt:"How does the identity-vs-intelligibility tension from Ch.5 resurface in Ch.2's ELF-aware vs. ELF-informed pedagogy debate?"
  }
];

var BLOCK_ORDER = ["Block A", "Block B", "Synthesis"];

function activityById(id){
  for (var i=0;i<ACTIVITIES.length;i++){ if (ACTIVITIES[i].id===id) return ACTIVITIES[i]; }
  return null;
}

// ============================================================
// STATE
// ============================================================
var STATE = {
  screen: "landing",     // landing | studentName | studentClass | courseMap | activity | submitted | instructorAuth | instructorDash
  role: null,
  name: "",
  klass: null,           // 'A' | 'B'
  groupNum: {},           // per-activity group number, keyed by activityId
  currentActivityId: null,
  instructorAuthed: false,
  resetInProgress: false,
  resetProgressText: "",
  resetError: null,
  instructorTab: "A",
  doneSet: {},            // activityId -> true (cache, refreshed from storage)
  busy: false,
};

var app = document.getElementById("app");

// ============================================================
// STORAGE LAYER - retry, adaptive throttle, batching
// ============================================================
var throttleGap = 120;      // ms, adaptive
var THROTTLE_MIN = 60, THROTTLE_MAX = 8000;
var lastDispatch = 0;
var rateLimitDebounceUntil = 0;

function sleep(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }

function isRateLimitError(err){
  var msg = (err && err.message) ? err.message : String(err || "");
  return /rate limit/i.test(msg);
}

function noteRateLimitHit(){
  var now = Date.now();
  if (now < rateLimitDebounceUntil) return; // already backing off from a very recent burst
  rateLimitDebounceUntil = now + 400;
  throttleGap = Math.min(THROTTLE_MAX, Math.round(throttleGap * 1.8) + 40);
}
function noteSuccess(){
  throttleGap = Math.max(THROTTLE_MIN, Math.round(throttleGap * 0.7));
}

async function throttleGate(){
  var now = Date.now();
  var wait = (lastDispatch + throttleGap) - now;
  if (wait > 0) await sleep(wait);
  lastDispatch = Date.now();
}

async function waitForStorageReady(maxWaitMs){
  var start = Date.now();
  while (typeof window.storage === "undefined") {
    if (Date.now() - start > maxWaitMs) return false;
    await sleep(150);
  }
  return true;
}

async function withRetry(fn, opts){
  opts = opts || {};
  var attempts = opts.attempts || 5;
  var lastErr = null;
  for (var i=0; i<attempts; i++){
    await throttleGate();
    var ready = await waitForStorageReady(4000);
    if (!ready){ lastErr = new Error("Storage not ready yet"); await sleep(200 + i*150); continue; }
    try{
      var result = await fn();
      noteSuccess();
      return { ok:true, value: result };
    }catch(err){
      lastErr = err;
      if (isRateLimitError(err)) noteRateLimitHit();
      await sleep(150 * Math.pow(1.6, i) + Math.random()*100);
    }
  }
  return { ok:false, error: lastErr };
}

async function safeSet(key, value, shared){
  return withRetry(function(){ return window.storage.set(key, typeof value === "string" ? value : JSON.stringify(value), shared !== false); });
}
async function safeGet(key, shared){
  var r = await withRetry(function(){ return window.storage.get(key, shared !== false); }, { attempts: 4 });
  if (!r.ok) return null;
  // withRetry wraps the raw call's result as { ok, value: <raw return> }, and the raw
  // storage.get() call itself resolves to { key, value, shared } - so the actual stored
  // payload is nested two levels deep (r.value.value), not r.value itself. Returning the
  // unwrapped wrapper object here silently broke every downstream JSON.parse() call site
  // (matching/scenario/poll/group accuracy all read as "undefined") - caught only by
  // visual QA of the instructor dashboard, not by the earlier functional Playwright pass.
  if (r.value && typeof r.value === "object" && "value" in r.value) return r.value.value;
  return r.value;
}
async function safeList(prefix, shared){
  var r = await withRetry(function(){ return window.storage.list(prefix, shared !== false); }, { attempts: 4 });
  if (!r.ok) return null;
  return r.value;
}
async function safeDelete(key, shared){
  // retry the delete call itself, not just a verification step
  var delRes = await withRetry(function(){ return window.storage.delete(key, shared !== false); }, { attempts: 4 });
  // verify by re-fetching; delete()'s own throw/return is not the success signal
  var check = await withRetry(function(){ return window.storage.get(key, shared !== false); }, { attempts: 2 });
  var stillThere = check.ok && check.value != null;
  return !stillThere;
}

// Bulk variant: retries the delete call itself, but skips the per-key GET verification
// round-trip. Used for large batch operations (Reset All) where verification instead happens
// once in aggregate via a single list() pass at the end (see runResetAll) - halves total
// storage round-trips on a bulk wipe without weakening the "never trust delete()'s own
// throw/return alone" guarantee, since the aggregate list-and-retry pass still catches any
// key that didn't actually go away.
async function rawDeleteRetried(key, shared){
  return withRetry(function(){ return window.storage.delete(key, shared !== false); }, { attempts: 4 });
}

async function mapLimited(items, limit, fn, onProgress){
  var idx = 0, done = 0, results = new Array(items.length);
  async function worker(){
    while (idx < items.length){
      var my = idx++;
      results[my] = await fn(items[my], my);
      done++;
      if (onProgress) onProgress(done, items.length);
    }
  }
  var workers = [];
  for (var i=0;i<Math.min(limit, items.length);i++) workers.push(worker());
  await Promise.all(workers);
  return results;
}

// RENDER HELPERS

function el(tag, attrs, children){
  var e = document.createElement(tag);
  attrs = attrs || {};
  for (var k in attrs){
    if (k === "class") e.className = attrs[k];
    else if (k === "html") e.innerHTML = attrs[k];
    else if (k.indexOf("on") === 0){
      // only wire real handler functions; skip null/false entirely rather than
      // stringifying them into a literal onclick="null" HTML attribute (which used to
      // happen via the generic setAttribute() fallback below, and silently swallowed
      // clicks instead of cleanly doing nothing)
      if (typeof attrs[k] === "function") e.addEventListener(k.slice(2), attrs[k]);
    }
    else if (k === "disabled"){
      // boolean HTML attributes must be set as a real DOM property, not via setAttribute()
      // with a JS boolean - setAttribute() stringifies false to the literal text "false",
      // which HTML still treats as *present* (i.e. still disabled). This was a real bug:
      // every disabled:false button on the instructor dashboard was permanently disabled.
      e.disabled = !!attrs[k];
    }
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(function(c){
    if (c == null) return;
    if (typeof c === "string") e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}

function renderSpectrumBody(container, a){

  var track = el("div", { class:"spectrum-track" });
  var fill = el("div", { class:"spectrum-fill", style:"width:50%;" });
  var handle = el("div", { class:"spectrum-handle", style:"left:50%;" });
  track.appendChild(fill); track.appendChild(handle);
  container.appendChild(track);
  container.appendChild(el("div", { class:"spectrum-labels" }, [
    el("span", {}, [a.leftLabel]),
    el("span", {}, [a.rightLabel]),
  ]));
  var value = { v:50 };
  var dragging = false;
  function setFromClientX(clientX){
    var rect = track.getBoundingClientRect();
    var pct = Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));
    value.v = Math.round(pct);
    fill.style.width = value.v + "%";
    handle.style.left = value.v + "%";
  }
  handle.addEventListener("mousedown", function(){ dragging = true; });
  window.addEventListener("mousemove", function(e){ if (dragging) setFromClientX(e.clientX); });
  window.addEventListener("mouseup", function(){ dragging = false; });
  handle.addEventListener("touchstart", function(){ dragging = true; }, { passive:true });
  window.addEventListener("touchmove", function(e){ if (dragging && e.touches[0]) setFromClientX(e.touches[0].clientX); }, { passive:true });
  window.addEventListener("touchend", function(){ dragging = false; });
  track.addEventListener("click", function(e){ setFromClientX(e.clientX); });

  container.appendChild(el("label", { style:"margin-top:20px; display:block;" }, ["Justify your position (2\u20133 sentences)"]));
  var ta = el("textarea", { id:"spectrumJustify", placeholder:"What tips the scale for this specific team?" });
  container.appendChild(ta);

  submitBar(container, async function(btn, errBox){
    var text = ta.value.trim();

    var key = "resp:" + STATE.klass + ":" + a.id + ":" + STATE.name;
    await doSubmit(key, { name: STATE.name, klass: STATE.klass, activityId: a.id, position: value.v, justification: text, ts: Date.now() }, btn, errBox);
  });
}

    var ta = el("textarea", { placeholder:"What pattern did your group notice?" });
    container.appendChild(ta);

    submitBar(container, async function(btn, errBox){
      var answers = {}; var allFilled = true;
      a.items.forEach(function(item, idx){
        var v = placement[idx].value;
        if (!v) allFilled = false;
        answers[item] = v;
      });
      var text = ta.value.trim();
      if (!allFilled || !text){ showInlineError(errBox, "Please sort every item and add your group's justification."); return; }
      var key = "resp:" + STATE.klass + ":" + a.id + ":group" + groupNum;
      await doSubmit(key, { klass: STATE.klass, groupNum: groupNum, activityId: a.id, answers: answers, justification: text, ts: Date.now() }, btn, errBox);
    });
  } else {
    // b3 - MES/BES/NBES discussion. The prompt explicitly asks EACH member to self-identify,
    // so this needs one entry per person, not a single group-wide dropdown (a Week 4 QA catch:
    // the original version collected only one value total, silently discarding every member's
    // answer but one).
    container.appendChild(el("label", {}, [a.prompt1]));
    container.appendChild(el("p", { class:"muted", style:"margin:2px 0 10px;" }, ["Add one row per group member present."]));
    var rowsWrap = el("div", { id:"selfIdRows" });
    container.appendChild(rowsWrap);

    function addMemberRow(){
      var rowWrap = el("div", { style:"display:flex; gap:8px; align-items:center; margin-bottom:8px;" });
      var sel = el("select", { style:"flex:1;" }, [
        el("option", { value:"" }, ["Choose\u2026"]),
        el("option", { value:"MES" }, ["MES \u2014 Monolingual English Speaker"]),
        el("option", { value:"BES" }, ["BES \u2014 Bilingual English Speaker"]),
        el("option", { value:"NBES" }, ["NBES \u2014 Non-Bilingual English Speaker"]),
      ]);
      var removeBtn = el("button", { class:"btn secondary", style:"padding:8px 14px; flex:0 0 auto;" }, ["\u2715"]);
      removeBtn.onclick = function(){
        if (rowsWrap.children.length > 1) rowWrap.remove();
      };
      rowWrap.appendChild(sel);
      rowWrap.appendChild(removeBtn);
      rowsWrap.appendChild(rowWrap);
    }
    addMemberRow(); // start with one row

    var addBtn = el("button", { class:"btn secondary", style:"margin-bottom:6px;" }, ["+ Add another member"]);
    addBtn.onclick = function(){ addMemberRow(); };
    container.appendChild(addBtn);

    container.appendChild(el("label", { style:"margin-top:18px; display:block;" }, [a.prompt2]));
    var debate = el("textarea", { placeholder:"Your group's shared answer to the debate question." });
    container.appendChild(debate);
    container.appendChild(el("label", { style:"margin-top:16px; display:block;" }, ["One open question your group couldn't resolve"]));
    var openQ = el("textarea", { placeholder:"An unresolved question the framework raises\u2026" });
    container.appendChild(openQ);

    submitBar(container, async function(btn, errBox){
      var selects = rowsWrap.querySelectorAll("select");
      var selfIds = [];
      var allFilled = true;
      selects.forEach(function(s){ if (!s.value) allFilled = false; else selfIds.push(s.value); });
      if (!allFilled || selfIds.length === 0 || !debate.value.trim() || !openQ.value.trim()){
        showInlineError(errBox, "Please fill in every member's self-ID row plus both text fields before submitting.");
        return;
      }
      var key = "resp:" + STATE.klass + ":" + a.id + ":group" + groupNum;
      await doSubmit(key, {
        klass: STATE.klass, groupNum: groupNum, activityId: a.id,
        selfIds: selfIds, debateAnswer: debate.value.trim(), openQuestion: openQ.value.trim(), ts: Date.now()
      }, btn, errBox);
    });
  }
}

// ---- Free text (synthesis) ----
function renderFreetextBody(container, a){
  container.appendChild(el("div", { class:"card2", style:"margin-bottom:16px;" }, [
    el("p", { style:"font-style:italic; font-size:16px; margin:0;" }, ["\u201C" + a.prompt + "\u201D"]),
  ]));
  var ta = el("textarea", { placeholder:"3\u20135 sentences\u2026", style:"min-height:160px;" });
  container.appendChild(ta);
  submitBar(container, async function(btn, errBox){
    var text = ta.value.trim();
    if (text.length < 10){ showInlineError(errBox, "Please write a few sentences before submitting."); return; }
    var key = "resp:" + STATE.klass + ":" + a.id + ":" + STATE.name;
    await doSubmit(key, { name: STATE.name, klass: STATE.klass, activityId: a.id, text: text, ts: Date.now() }, btn, errBox);
  });
}

// INSTRUCTOR
// ============================================================
function renderInstructorAuth(){
  app.className = "";
  clear(app);
  app.appendChild(topToggle());
  var wrap = el("div", { class:"center-wrap" });
  wrap.appendChild(el("h2", { style:"color:var(--teal); margin-bottom:10px;" }, ["Instructor Login"]));
  var input = el("input", { type:"text", placeholder:"Password" });
  input.type = "password";
  wrap.appendChild(input);
  var errBox = el("div", {});
  wrap.appendChild(errBox);
  var btn = el("button", { class:"btn block", style:"margin-top:16px;" }, ["Enter"]);
  btn.onclick = function(){
    if (input.value === INSTRUCTOR_PASSWORD){
      STATE.instructorAuthed = true;
      STATE.screen = "instructorDash";
      render();
    } else {
      clear(errBox);
      errBox.appendChild(el("div", { class:"inline-error" }, ["Incorrect password. Please try again."]));
    }
  };
  wrap.appendChild(btn);
  app.appendChild(wrap);
}

async function fetchActivityResponses(activityId, klass){
  var a = activityById(activityId);
  var prefix = "resp:" + klass + ":" + activityId + ":";
  var listed = await safeList(prefix, true);
  var keys = (listed && listed.keys) ? listed.keys : [];
  var results = await mapLimited(keys, 5, async function(k){
    var v = await safeGet(k, true);
    if (!v) return null;
    try { return typeof v === "string" ? JSON.parse(v) : v; } catch(e){ return null; }
  });
  return results.filter(function(r){ return r != null; });
}

async function renderInstructorDash(){
  app.className = "instructor-mode";
  clear(app);
  app.appendChild(topToggle());
  var wrap = el("div", { class:"instr-wrap" });
  wrap.appendChild(el("h2", { style:"color:#fff; margin-bottom:4px;" }, ["Instructor Dashboard \u2014 Week 4"]));
  wrap.appendChild(el("p", { style:"color:#9FC4BA; margin-bottom:18px;" }, ["World Englishes & ELF"]));

  var tabs = el("div", { class:"instr-tabs" }, [
    el("button", { class: (STATE.instructorTab==="A"?"active":""), disabled: STATE.resetInProgress, onclick: STATE.resetInProgress ? null : function(){ STATE.instructorTab="A"; render(); } }, ["A Class"]),
    el("button", { class: (STATE.instructorTab==="B"?"active":""), disabled: STATE.resetInProgress, onclick: STATE.resetInProgress ? null : function(){ STATE.instructorTab="B"; render(); } }, ["B Class"]),
  ]);
  wrap.appendChild(tabs);

  var actionsErrBox = el("div", {});
  var actions = el("div", { class:"instr-actions" }, [
    el("button", { class:"btn", disabled: STATE.resetInProgress, onclick: STATE.resetInProgress ? null : function(){ render(); } }, ["\uD83D\uDD04 Refresh All"]),
    el("button", { class:"btn danger-i", disabled: STATE.resetInProgress, onclick: STATE.resetInProgress ? null : function(){ confirmResetAll(); } }, [STATE.resetInProgress ? "\u23F3 Resetting\u2026" : "\uD83D\uDDD1\uFE0F Reset All"]),
  ]);
  wrap.appendChild(actions);
  wrap.appendChild(actionsErrBox);

  if (STATE.resetError){
    wrap.appendChild(el("div", { class:"inline-error", style:"margin-top:4px; margin-bottom:14px;" }, ["\u26A0\uFE0F " + STATE.resetError]));
  }

  // While a reset is in flight, stop here: don't kick off a concurrent results fetch that
  // would race the reset's own storage calls (see the note in runResetAll). All progress
  // reporting reads from STATE (STATE.resetProgressText) rather than poking a captured DOM
  // node from the async reset routine, which is what caused an earlier version of this fix
  // to silently erase its own error message: appending an error node into a `wrap` grabbed via
  // document.querySelector and then calling render() right after wipes that exact node, since
  // render() unconditionally clears and rebuilds #app from scratch. State-driven, not DOM-poked.
  if (STATE.resetInProgress){
    wrap.appendChild(el("div", { class:"progress-line", style:"margin-top:10px;" }, [
      "\u23F3 " + (STATE.resetProgressText || "Reset in progress\u2026") + " \u2014 controls are locked until it finishes.",
    ]));
    app.appendChild(wrap);
    return;
  }

  var resultsHost = el("div", { id:"resultsHost" }, [el("p", { style:"color:#9FC4BA;" }, ["Loading results\u2026"])]);
  wrap.appendChild(resultsHost);
  app.appendChild(wrap);

  var klass = STATE.instructorTab;
  var blockGroups = {};
  BLOCK_ORDER.forEach(function(b){ blockGroups[b] = ACTIVITIES.filter(function(a){ return a.block === b; }); });

  var allData = {};
  try {
    await mapLimited(ACTIVITIES, 4, async function(a){
      allData[a.id] = await fetchActivityResponses(a.id, klass);
    });
  } catch (fetchErr){
    if (STATE.screen !== "instructorDash" || STATE.resetInProgress) return;
    clear(resultsHost);
    resultsHost.appendChild(el("div", { class:"inline-error" }, [
      "\u26A0\uFE0F Couldn't load results \u2014 please try Refresh All again.",
      el("div", { class:"tech" }, [String(fetchErr && fetchErr.message || fetchErr)]),
    ]));
    return;
  }

  if (STATE.screen !== "instructorDash" || STATE.instructorTab !== klass || STATE.resetInProgress) return; // stale render guard

  clear(resultsHost);
  BLOCK_ORDER.forEach(function(blockName){
    var acts = blockGroups[blockName];
    if (!acts.length) return;
    var section = el("div", { class:"instr-block" });
    section.appendChild(el("div", { class:"instr-block-title" }, [blockName]));
    acts.forEach(function(a){
      section.appendChild(renderResultCard(a, allData[a.id] || [], klass));
    });
    wrap.querySelector ? null : null;
    resultsHost.appendChild(section);
  });
}

function renderResultCard(a, responses, klass){
  var expected = a.mode === "group" ? (GROUP_COUNTS[klass]||6) : (CLASS_SIZES[klass]||26);
  var card = el("div", { class:"result-card" });
  card.appendChild(el("h4", {}, [a.num + ". " + a.title]));
  card.appendChild(el("div", { class:"result-meta" }, [responses.length + " / " + expected + " submitted \u00B7 " + (a.mode==="group"?"GROUP":"INDIVIDUAL")]));

  if (a.type === "scenario" || a.type === "poll"){
    var qs = a.type === "poll" ? [{ opts:a.options, correct:a.correct }] : a.questions;
    qs.forEach(function(q, qi){
      var counts = new Array(q.opts.length).fill(0);
      responses.forEach(function(r){
        var ans = a.type === "poll" ? r.answer : (r.answers ? r.answers[qi] : null);
        if (ans != null && counts[ans] !== undefined) counts[ans]++;
      });
      var correctCount = counts[q.correct] || 0;
      var pct = responses.length ? Math.round((correctCount/responses.length)*100) : 0;
      var qWrap = el("div", { style:"margin-bottom:10px;" });
      if (a.type === "scenario") qWrap.appendChild(el("div", { style:"font-size:13px; color:#cfe3dd; margin-bottom:4px;" }, ["Q" + (qi+1) + ": " + q.q.slice(0,70) + (q.q.length>70?"\u2026":"")]));
      qWrap.appendChild(el("div", { style:"display:flex; align-items:center; gap:8px;" }, [
        el("span", { class:"correct-tag" }, ["Correct: " + String.fromCharCode(65+q.correct)]),
        el("span", { style:"font-size:12px; color:#9FC4BA;" }, [pct + "% correct (" + correctCount + "/" + responses.length + ")"]),
      ]));
      var bar = el("div", { class:"accuracy-bar-track" }, [el("div", { class:"accuracy-bar-fill", style:"width:"+pct+"%;" })]);
      qWrap.appendChild(bar);
      card.appendChild(qWrap);
    });
  } else if (a.type === "matching"){
    var totalPairs = a.pairs.length * (responses.length || 0);
    var correctPairs = 0;
    responses.forEach(function(r){
      a.pairs.forEach(function(p){ if (r.answers && r.answers[p.term] === p.answer) correctPairs++; });
    });
    var pct2 = totalPairs ? Math.round((correctPairs/totalPairs)*100) : 0;
    card.appendChild(el("div", { style:"font-size:12px; color:#9FC4BA; margin-bottom:6px;" }, [pct2 + "% of all matches correct across submitted responses"]));
    var bar2 = el("div", { class:"accuracy-bar-track" }, [el("div", { class:"accuracy-bar-fill", style:"width:"+pct2+"%;" })]);
    card.appendChild(bar2);
  } else if (a.type === "spectrum"){
    var avg = responses.length ? Math.round(responses.reduce(function(s,r){ return s+(r.position||0); },0)/responses.length) : 0;
    card.appendChild(el("div", { style:"font-size:12px; color:#9FC4BA;" }, ["Average position: " + avg + " / 100 (0 = " + a.leftLabel + ", 100 = " + a.rightLabel + ")"]));
    responses.slice(0,4).forEach(function(r){
      card.appendChild(el("div", { class:"resp-line" }, [(r.name||"?") + " (" + r.position + "): " + (r.justification||"").slice(0,90)]));
    });
  } else if (a.type === "group"){
    if (a.id === "a3"){
      responses.forEach(function(r){
        card.appendChild(el("div", { class:"resp-line" }, ["Group " + r.groupNum + ": " + (r.justification||"").slice(0,140)]));
      });
    } else {
      // b3: show each group's per-member self-ID tally (not just one value) alongside the debate answer
      var totalTally = { MES:0, BES:0, NBES:0 };
      responses.forEach(function(r){
        var ids = r.selfIds || [];
        var tally = { MES:0, BES:0, NBES:0 };
        ids.forEach(function(x){ if (tally[x] !== undefined) { tally[x]++; totalTally[x]++; } });
        var tallyStr = "MES:" + tally.MES + " BES:" + tally.BES + " NBES:" + tally.NBES + " (" + ids.length + " members)";
        card.appendChild(el("div", { class:"resp-line" }, [
          "Group " + r.groupNum + " \u2014 " + tallyStr + " \u2014 " + (r.debateAnswer||"").slice(0,110)
        ]));
      });
      if (responses.length){
        card.appendChild(el("div", { style:"font-size:12px; color:#9FC4BA; margin-top:8px;" }, [
          "Class-wide self-ID tally \u2014 MES: " + totalTally.MES + "  \u00B7  BES: " + totalTally.BES + "  \u00B7  NBES: " + totalTally.NBES
        ]));
      }
    }
  } else if (a.type === "freetext"){
    responses.slice(0,6).forEach(function(r){
      card.appendChild(el("div", { class:"resp-line" }, [(r.name||"?") + ": " + (r.text||"").slice(0,140)]));
    });
    if (responses.length > 6) card.appendChild(el("div", { class:"resp-line" }, ["\u2026 and " + (responses.length-6) + " more"]));
  }
  return card;
}

function confirmResetAll(){
  if (STATE.resetInProgress){
    showModal({ title:"Reset Already Running", message:"A reset is already in progress. Please wait for it to finish." });
    return;
  }
  showModal({
    title: "Reset All Data?",
    message: "This clears every student response for BOTH A Class and B Class, and returns all active sessions to the landing screen. This cannot be undone.",
    showCancel: true,
    okText: "Reset Everything",
    danger: true,
    onConfirm: function(){ runResetAll(); }
  });
}

async function runResetAll(){
  // Guard against a real race that was reported in Week 4 QA: with no guard here, clicking
  // "Refresh All" while a Reset was still mid-flight (e.g., slow under real rate limits with a
  // full class's worth of data) would spin up a second concurrent renderInstructorDash() call,
  // which looked like "Refresh dumps you to landing" whenever the background reset later
  // finished. Locking Refresh/tabs/Reset while a reset is running, and only navigating away
  // with an explicit on-screen confirmation instead of silently, closes that race.
  //
  // Everything below is state-driven (STATE.resetProgressText / STATE.resetError), never a
  // captured DOM node from document.querySelector. An earlier version of this fix grabbed
  // `.instr-wrap` once and kept appending progress/error nodes into it directly - but every
  // render() call (including the one this function itself calls to show the disabled-controls
  // state) unconditionally clears and rebuilds #app from scratch, which silently detached or
  // erased those manually-appended nodes moments after they were added. That bug was the real
  // cause of "Reset All doesn't work": the failure message was being written correctly, then
  // immediately wiped by the very next render() call before anyone could see it.
  STATE.resetInProgress = true;
  STATE.resetError = null;
  STATE.resetProgressText = "Resetting\u2026";
  render();

  var listed = await safeList("resp:", true);
  var keys = (listed && listed.keys) ? listed.keys : [];
  var total = keys.length;
  var done = 0;
  STATE.resetProgressText = "Resetting\u2026 0/" + total;

  await mapLimited(keys, 5, async function(k){
    await rawDeleteRetried(k, true);
    done++;
    STATE.resetProgressText = "Resetting\u2026 " + done + "/" + total;
    render();
  });

  // verify in aggregate (single list() call) rather than one GET per key - this is the
  // real success signal, never delete()'s own throw/return; retry whatever's left, and
  // keep looping this pass until a list() genuinely comes back empty (bounded attempts).
  // Important: a *failed* list() call (safeList returns null) is NOT the same thing as a
  // genuinely empty list - conflating the two would let a totally down storage layer look
  // like a successful reset. Track them separately.
  var remaining = [], guard = 0, verifyFailed = false;
  do {
    var check = await safeList("resp:", true);
    if (check == null){
      verifyFailed = true;
      remaining = [];
    } else {
      verifyFailed = false;
      remaining = check.keys || [];
      if (remaining.length > 0){
        STATE.resetProgressText = "Reset mostly complete \u2014 " + remaining.length + " item(s) remaining, retrying\u2026";
        await mapLimited(remaining, 5, async function(k){ await rawDeleteRetried(k, true); });
      }
    }
    guard++;
  } while ((verifyFailed || remaining.length > 0) && guard < 6);

  STATE.resetInProgress = false;
  STATE.resetProgressText = "";

  if (verifyFailed || remaining.length > 0){
    STATE.resetError = verifyFailed
      ? "Couldn't confirm the reset finished \u2014 the storage layer didn't respond after repeated retries. Nothing was necessarily lost, but please check your connection and press Reset All again."
      : "Reset did not fully complete \u2014 " + remaining.length + " item(s) could not be deleted after repeated retries. This can happen under a very heavy real rate limit. Press Reset All again to retry.";
    render();
    return;
  }

  showModal({
    title: "Reset Complete",
    message: "All student responses for both A Class and B Class have been cleared. Returning to the landing screen now.",
    okText: "OK",
    onConfirm: function(){
      STATE.name = ""; STATE.klass = null; STATE.groupNum = {}; STATE.doneSet = {};
      STATE.currentActivityId = null;
      STATE.screen = "landing"; STATE.role = null;
      render();
    }
  });
}

// ============================================================
// MAIN RENDER DISPATCH
// ============================================================
function render(){
  if (STATE.screen === "landing") renderLanding();
  else if (STATE.screen === "studentName") renderStudentName();
  else if (STATE.screen === "studentClass") renderStudentClass();
  else if (STATE.screen === "courseMap") renderCourseMap();
  else if (STATE.screen === "groupPick") renderGroupPick();
  else if (STATE.screen === "activity") renderActivity();
  else if (STATE.screen === "submitted") renderSubmitted();
  else if (STATE.screen === "instructorAuth") renderInstructorAuth();
  else if (STATE.screen === "instructorDash") renderInstructorDash();
  else renderLanding();
}

render();

})();
